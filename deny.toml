[advisories]
version = 2
# Transitive unmaintained-crate advisories with no available fix
ignore = [
    # proc-macro-error: unmaintained, transitive via genawaiter -> bao-tree -> iroh-blobs
    "RUSTSEC-2024-0370",
    # atomic-polyfill: unmaintained, platform-conditional transitive dep (not on linux x86_64)
    "RUSTSEC-2023-0089",
    # paste: unmaintained, transitive via alloy-primitives
    "RUSTSEC-2024-0436",
    # proc-macro-error2: unmaintained fork of proc-macro-error (itself already
    # ignored above as RUSTSEC-2024-0370). Build-time-only proc-macro pulled via
    # alloy-sol-macro -> alloy; no runtime exposure and no maintained successor.
    "RUSTSEC-2026-0173",
    # NOTE: the hickory-proto / hickory-net DNS DoS ignores
    # (RUSTSEC-2026-0119 + 0120) were dropped when iroh 1.0 pulled the
    # fixed hickory 0.26.1 (iroh 0.98 had exact-pinned the vulnerable
    # =0.26.0-beta.4). `cargo deny check advisories` flags either as
    # "advisory-not-detected" if re-added.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
