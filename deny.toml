[advisories]
version = 2
# Transitive unmaintained-crate advisories with no available fix
ignore = [
    # proc-macro-error: unmaintained, transitive via genawaiter -> bao-tree -> iroh-blobs
    "RUSTSEC-2024-0370",
    # atomic-polyfill: unmaintained, platform-conditional transitive dep (not on linux x86_64)
    "RUSTSEC-2023-0089",
    # paste: unmaintained, transitive via alloy-primitives
    "RUSTSEC-2024-0436",
    # hickory-proto / hickory-net DNS DoS bugs (O(n²) name compression and
    # NSEC3 unbounded loop). Fixed in hickory-proto 0.26.1, but iroh 0.98
    # exact-pins =0.26.0-beta.4 — release a fix once upstream iroh bumps.
    # Reachable only through iroh's address-lookup path; not a CDN-data path.
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0120",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
