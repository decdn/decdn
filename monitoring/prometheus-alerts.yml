# deCDN reference Prometheus alerting rules
#
# Companion to adr/appendix-observability.md. Thresholds in the
# `decdn-slash-safety` group are copied verbatim from §2.1
# "Recommended alert thresholds"; the others are operator-onboarding
# defaults, not normative.
#
# Validate locally:
#   promtool check rules monitoring/prometheus-alerts.yml
#
# Wire into Prometheus via:
#   rule_files:
#     - /etc/prometheus/prometheus-alerts.yml
# (or copy the file under whatever filename your Prometheus deployment expects).

groups:
  # ---------------------------------------------------------------
  # Slash-safety — copied from appendix-observability §2.1.
  # A sustained alert here means the operator is at slash risk, with one
  # deliberate exception: DecdnProbeHoldViolations is grouped here because it
  # is a probe-hold capacity metric, but it signals lost revenue rather than
  # slash exposure (see its annotation and appendix-observability §Slash-Safety
  # Metrics). Carries no slash_risk label for that reason.
  # ---------------------------------------------------------------
  - name: decdn-slash-safety
    interval: 30s
    rules:
      - alert: DecdnProbeHoldViolations
        expr: rate(decdn_probe_hold_unavailable_total{reason="exhausted"}[5m]) > 0
        for: 5m
        labels:
          component: probe
          severity: critical
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#slashing-risk"
          summary: "Probe-hold budget exhausted on {{ $labels.instance }}"
          description: |
            decdn_probe_hold_unavailable_total{reason="exhausted"} has been
            incrementing for 5m on {{ $labels.instance }}. Each increment is a
            blob that IS present but could not be held because every probe-hold
            slot was live. Holds are best-effort, so the node still advertised
            has_blob: true and forwent only the hold — the blob is now visible
            to the LRU driver and may be evicted before the requester's pull
            arrives, costing a wasted round trip and a lost delivery. Not slash
            evidence: no offense pairs a probe with a later miss. Reduce load or
            raise max_probe_holds; investigate OOM. The reason filter is
            load-bearing: reason="disabled" (max_probe_holds=0) and
            reason="stake_lane_reserved" are deliberate operator decisions and
            must not fire this alert. Note max_probe_holds is
            restart-required — editing it and reloading logs "requires restart"
            and changes nothing. See
            adr/005-protocol.md#probe-triggered-eviction-hold.

      # There is no blacklist sync-lag or version-delta alert: the watcher
      # rebuilds the deny-set by full enumeration and keeps no version cursor
      # (adr/011-content-takedown.md § Node Behavior), so no such gauge exists to
      # alert on. DecdnBlacklistWatcherStalled below is the coverage: it fires on
      # staleness of the watcher's last successful tick, which IS exported.
      - alert: DecdnBlacklistWatcherStalled
        # Two arms. Positive liveness: the tick gauge is stamped every
        # successful poll tick, so its staleness catches a panicked, wedged, or
        # exited watcher that the error-triggered down-seconds gauge reads as a
        # healthy 0 (#1316/#1320). The `> 0` guard skips the pre-first-tick
        # sentinel (the gauge reads 0 until the first successful tick), so a
        # fresh boot doesn't self-fire. Failing ticks: down-seconds counts from
        # the first failed poll tick, so it also catches a watcher that never
        # ticked because every eth_getLogs fails (an RPC that rejects the range),
        # which the guarded tick arm cannot see. 180s ≈ several poll intervals.
        expr: ((decdn_blacklist_watcher_last_tick_timestamp_seconds > 0) and (time() - decdn_blacklist_watcher_last_tick_timestamp_seconds > 180)) or (decdn_blacklist_watcher_down_seconds > 180)
        for: 5m
        labels:
          component: blacklist
          severity: critical
          slash_risk: blacklist_violation
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#contentblacklist-compliance"
          summary: "Blacklist watcher not ticking on {{ $labels.instance }}"
          description: |
            No successful blacklist poll tick for several intervals — the
            watcher has panicked, wedged, or exited. The node may be serving
            content blacklisted after the failure, which is slashable. Restart
            the daemon and check the RPC provider. See adr/011-content-takedown.md.

      - alert: DecdnBlacklistEnforcementFailing
        expr: rate(decdn_blacklist_enforcement_failures_total[10m]) > 0
        for: 2m
        labels:
          component: blacklist
          severity: critical
          slash_risk: blacklist_violation
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#contentblacklist-compliance"
          summary: "Blacklist deny-set not fully enforced on {{ $labels.instance }}"
          description: |
            A re-scope could not re-verify or evict every known entry (disk or
            scope eth_call failure). A blacklisted blob may still be servable and
            slashable even while blacklist_watcher_down_seconds reads 0. Check
            disk health and the ContentBlacklist RPC. See adr/011-content-takedown.md.

      - alert: DecdnWatcherTaskPanicked
        # One rule covers all five chain-event watchers — slash, staker_set,
        # blacklist, settlement and fee_shares — via the metric-name match.
        #
        # The obvious spelling, `rate({__name__=~"..."}[10m]) > 0`, does not
        # evaluate: rate() drops __name__, so the five per-watcher series on a
        # node collapse to five identical label sets and Prometheus refuses the
        # vector. label_replace lifts the watcher out of the metric name while
        # the raw selector still has it, and the offset subtraction takes the
        # place of rate() so nothing ever strips the name mid-expression. A
        # counter reset reads negative, not positive, so a restart cannot fire
        # this.
        #
        # The extraction regex ends `_watcher_task_panicked_total` so `watcher`
        # reads `slash`, not `slash_watcher`, and the description does not say
        # "slash_watcher watcher". The SELECTOR stays broad on purpose: every
        # panic counter today is a watcher's, but a future one that is not would
        # still fire this rule, just with an empty `watcher` label. Firing with a
        # thin message beats not firing at all for a counter whose every non-zero
        # value is a bug.
        expr: >-
          (label_replace({__name__=~"decdn_.+_task_panicked_total"}, "watcher", "$1",
          "__name__", "decdn_(.+)_watcher_task_panicked_total") - label_replace({__name__=~"decdn_.+_task_panicked_total"}
          offset 10m, "watcher", "$1", "__name__", "decdn_(.+)_watcher_task_panicked_total")) > 0
        for: 0m
        labels:
          component: watcher
          severity: critical
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#slashing-risk"
          summary: "A chain-event watcher task panicked on {{ $labels.instance }}"
          description: |
            The {{ $labels.watcher }} watcher task unwound on a panic. Never
            expected under the anti-panic policy. Capture the error! log line
            naming the watcher and file a bug.

      # A latent-bug report, not a degradation (#1517). The engine recovers the
      # guard and clears the poison, so coalescing never stops and no restart is
      # needed — but the workspace anti-panic policy means no production path is
      # supposed to be able to poison this at all, so any nonzero value is a bug
      # worth filing.
      #
      # `increase(...[1h]) > 0`, not the bare `> 0` this used to carry: the
      # counter is monotonic and process-local, and the annotation tells the
      # operator not to restart, so a bare comparison latches for the life of
      # the process and can never resolve. A single occurrence still fires —
      # the window only decides when the alert clears.
      - alert: DecdnCacheInflightMutexPoisoned
        expr: increase(decdn_cache_inflight_mutex_poisoned_total[1h]) > 0
        for: 0m
        labels:
          component: cache
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#cache-coalescing-mutex-poisoned"
          summary: "Cache coalescing mutex poisoned on {{ $labels.instance }}"
          description: |
            A task panicked while holding the in-flight fill-coalescing map.
            Coalescing is preserved and no operator action is needed beyond
            reporting it — do NOT restart to "clear" it. File the panic with
            the surrounding ERROR log line (emitted once per process).
            See docs/runbook.md § Cache coalescing mutex poisoned.

      # The value, not increase(): the slash watcher's bring-up backfill counts
      # every still-appealable slash before the first scrape, so increase()
      # would miss a slash found at startup. A non-zero value means this process
      # has seen a slash; after a restart it re-counts only the slashes whose
      # appeal window is still open, so the alert clears once the last window
      # closes and the node restarts.
      - alert: DecdnSlashDetected
        expr: decdn_slashes_detected_total > 0
        for: 0m
        labels:
          component: slashing
          severity: critical
          slash_risk: "true"
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#slashing-risk"
          summary: "Operator slashed on {{ $labels.instance }}"
          description: |
            The slash watcher saw a SlashJudge.Slashed event against this
            operator. The bond lost stake. Read the slash reason from the
            watcher's log line and consider `decdn appeal slash` inside the
            30-day appeal window.

  # ---------------------------------------------------------------
  # Liveness / capacity — operator-onboarding defaults.
  # Tune `for:` and thresholds for your fleet size before paging.
  # ---------------------------------------------------------------
  - name: decdn-liveness
    interval: 30s
    rules:
      - alert: DecdnNodeDown
        expr: up{job=~".*decdn.*"} == 0
        for: 1m
        labels:
          component: node
          severity: critical
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#rpc-unreachable"
          summary: "Node {{ $labels.instance }} unreachable for 1m"
          description: |
            Prometheus has been unable to scrape this node for at least
            one minute (the standard `up` metric is 0). This catches the
            crash-and-stay-down case that decdn_node_uptime_seconds
            cannot — once the process is gone, no decdn_* metric is
            exported. Adjust the `job=~".*decdn.*"` selector to match
            your scrape-config job name(s).

      # `resets(...)`, not `decdn_node_uptime_seconds < 300`: the comparison
      # holds true for a full five minutes after every deploy, and a
      # crash-looping node re-enters it continuously instead of escalating.
      # `resets` counts the gauge going backwards, so one restart is one event.
      - alert: DecdnNodeRestarted
        expr: resets(decdn_node_uptime_seconds[15m]) > 0
        for: 0m
        labels:
          component: node
          severity: info
        annotations:
          summary: "{{ $labels.instance }} restarted recently"
          description: |
            decdn_node_uptime_seconds went backwards — the node process
            restarted. Correlate with deploy events.

      - alert: DecdnNoActiveStreams
        expr: sum without (direction) (decdn_streams_active) == 0
        for: 15m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "No active streams on {{ $labels.instance }} for 15m"
          description: |
            decdn_streams_active has been zero across all directions
            (inbound + outbound) for 15 minutes. Either traffic dried up,
            the node was de-prioritised by client selection, or it stopped
            accepting connections. The sum-without(direction) aggregation
            avoids false alerts when only one direction is idle.

      # Chain-event watcher liveness (#1316), two arms. The
      # *_last_tick_timestamp_seconds gauge advances only while the watcher
      # actually completes ticks, so staleness catches a panicked/wedged/exited
      # task the error-triggered down-seconds gauge reads as a healthy 0. The
      # `> 0` guard skips the pre-first-tick sentinel (gauge reads 0 until the
      # first success), so a fresh boot — and a node that never enables a
      # conditionally-spawned watcher — doesn't self-fire. The *_down_seconds arm
      # counts from the first failed poll tick, so it catches a watcher that
      # never ticked because every eth_getLogs fails; an unregistered watcher
      # never fails a tick, so it stays 0. 180s ≈ several poll intervals; tune to
      # your event_poll_interval. Blacklist has its own (slash-risk) rule in
      # decdn-slash-safety; settlement is in decdn-delivery.
      - alert: DecdnSlashWatcherStalled
        expr: ((decdn_slash_watcher_last_tick_timestamp_seconds > 0) and (time() - decdn_slash_watcher_last_tick_timestamp_seconds > 180)) or (decdn_slash_watcher_down_seconds > 180)
        for: 5m
        labels:
          component: watcher
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#slashing-risk"
          summary: "Slash watcher not ticking on {{ $labels.instance }}"
          description: |
            No successful slash-detection poll tick for several intervals — the
            watcher may have panicked, wedged, or exited, so a slash against this
            operator could go undetected. Restart and check the RPC provider.

      - alert: DecdnStakerSetWatcherStalled
        expr: ((decdn_staker_set_watcher_last_tick_timestamp_seconds > 0) and (time() - decdn_staker_set_watcher_last_tick_timestamp_seconds > 180)) or (decdn_staker_set_watcher_down_seconds > 180)
        for: 5m
        labels:
          component: watcher
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#active-staker-set-repair-not-running"
          summary: "Staker-set watcher not ticking on {{ $labels.instance }}"
          description: |
            The cached active-staker set / node-address bindings projection is no
            longer being refreshed and will drift from chain state. Correlate with
            decdn_staker_set_watcher_down_seconds and check the RPC provider.

      # The registry re-enumeration is the only systematic repair for a drifted
      # active-staker set. It reports success upward on a failed read (an error
      # would stall event pickup), so the counter is the only thing that moves
      # when it fails — and nothing at all moves when it is *skipped*, which is
      # what the staleness rule below catches.
      #
      # The window must be longer than the attempt spacing. Attempts are 15m
      # apart, so a 15m window sees a zero-rate gap whenever a poll or RPC delay
      # pushes two increments further apart than that — which resets `for` and
      # means a permanently failing resync never fires. `increase` over 1h always
      # spans several attempts. See adr/appendix-observability.md.
      - alert: DecdnCapacityBondRegistryResyncFailing
        expr: increase(decdn_capacity_bond_registry_resync_failures_total[1h]) > 0
        for: 15m
        labels:
          component: registry
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#active-staker-set-repair-not-running"
          summary: "Capacity-bond registry re-enumeration failing on {{ $labels.instance }}"
          description: |
            The repair for a drifted active-staker set is itself failing, so a
            membership change dropped by a failed nodeIdOf stays dropped. Check
            the RPC provider's eth_call path; correlate with
            decdn_staker_set_watcher_resolve_failures_total.

      - alert: DecdnCapacityBondRegistryResyncStale
        # The `> 0` guard covers only the window before bootstrap completes:
        # bootstrap is itself a successful enumeration and stamps the gauge, so a
        # node whose every later resync fails or is skipped still trips this.
        expr: (decdn_capacity_bond_registry_last_resync_timestamp_seconds > 0) and (time() - decdn_capacity_bond_registry_last_resync_timestamp_seconds > 1800)
        for: 15m
        labels:
          component: registry
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#active-staker-set-repair-not-running"
          summary: "Capacity-bond registry not re-enumerating on {{ $labels.instance }}"
          description: |
            No successful getRegisteredNodes re-enumeration in two intervals. The
            repair is skipped entirely while the watcher route is errored, which
            emits nothing — not even the failure counter. Correlate with
            decdn_staker_set_watcher_down_seconds and check the RPC provider.

      # The origin directory is a lazy on-demand cache, not a watcher, so it has
      # no last-tick gauge to stale out; alert on its getOrigins failure counter
      # instead. Each failure means a DHT provider-lookup miss fell back to
      # resolving no origins (fail-closed), so sustained failures degrade origin
      # discovery silently. Warning, not critical: normal DHT provider lookup is
      # the primary path and is unaffected. See adr/appendix-observability.md §3.
      - alert: DecdnOriginDirectoryLookupFailing
        expr: rate(decdn_origin_directory_get_origins_failures_total[5m]) > 0
        for: 15m
        labels:
          component: origin
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#origin-rescan-probes-faulting"
          summary: "Origin directory getOrigins lookups failing on {{ $labels.instance }}"
          description: |
            The lazy origin directory cannot read getOrigins from chain, so a DHT
            provider-lookup miss resolves no origins (fail-closed). Sustained
            failures degrade origin discovery silently. Check the RPC provider and
            the OriginAssignment contract address.

      # Only meaningful when observability.otlp_endpoint is set; the counter
      # stays 0 otherwise. Warning: lost traces do not affect delivery.
      - alert: DecdnOtlpExportFailing
        expr: increase(decdn_otlp_export_failures_total[15m]) > 0
        for: 15m
        labels:
          component: observability
          severity: warning
        annotations:
          summary: "OTLP span export failing on {{ $labels.instance }}"
          description: |
            The node's OTLP exporter kept failing span-export batches through
            the last 15 minutes, so traces are being lost. Check that the
            collector at observability.otlp_endpoint is up and speaks OTLP/gRPC
            (usually port 4317). The SDK also logs each failed batch at error
            level under the opentelemetry_sdk target. An idle node exports no
            batches, so a dead collector does not fire this until spans flow.
            Queue-full drops are not counted; watch for the SDK's
            BatchSpanProcessor.SpanDroppingStarted warning.

      - alert: DecdnFeeSharesWatcherStalled
        expr: ((decdn_fee_shares_watcher_last_tick_timestamp_seconds > 0) and (time() - decdn_fee_shares_watcher_last_tick_timestamp_seconds > 180)) or (decdn_fee_shares_watcher_down_seconds > 180)
        for: 5m
        labels:
          component: watcher
          severity: warning
        annotations:
          summary: "Fee-shares watcher not ticking on {{ $labels.instance }}"
          description: |
            No successful fee-shares poll tick for several intervals — the
            watcher may have panicked, wedged, or exited. The node keeps
            pricing its settlement share off the last split it read, which the
            chain may have moved. Restart and check the RPC provider.

      # getShares() is the safety-net re-read behind the SharesUpdated event
      # tail. Its failure keeps the current share and the tick still succeeds,
      # so the stall alert above cannot see it. The re-read runs on a slow
      # cadence (hours), hence the long window.
      - alert: DecdnFeeSharesPollFailing
        expr: increase(decdn_fee_shares_watcher_poll_failures_total[6h]) > 0
        for: 0m
        labels:
          component: watcher
          severity: warning
        annotations:
          summary: "Fee-shares getShares() re-read failing on {{ $labels.instance }}"
          description: |
            The authoritative FeeRouter.getShares() re-read failed. The node
            keeps the last share it read and relies on the event tail alone
            until a re-read lands. Check the RPC provider.

      - alert: DecdnRpcUnhealthy
        expr: decdn_rpc_healthy == 0
        for: 2m
        labels:
          component: chain
          severity: critical
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#rpc-unreachable"
          summary: "Chain RPC unreachable from {{ $labels.instance }}"
          description: |
            The RPC watchdog cannot reach blockchain.rpc_url. While it is down
            the node cannot read blacklist updates (slash exposure), follow
            pool events, or redeem vouchers. See docs/runbook.md § RPC
            unreachable.

      - alert: DecdnConfigReloadFailed
        expr: increase(decdn_config_reload_failures_total[15m]) > 0
        for: 0m
        labels:
          component: config
          severity: warning
        annotations:
          summary: "Config reload failed on {{ $labels.instance }}"
          description: |
            A SIGHUP or admin reload failed. Sections committed before the
            failure stay applied; the rest keep their previous values. The
            warn! line beside it names the cause. Fix the config file and
            reload again.

      - alert: DecdnReceiptLogWriteFailing
        expr: increase(decdn_receipt_write_failures_total[1h]) > 0
        for: 0m
        labels:
          component: receipts
          severity: warning
        annotations:
          summary: "Download-receipt log writes failing on {{ $labels.instance }}"
          description: |
            The receipt writer could not persist audit records. Settlement is
            unaffected, but the audit log has gaps. Check disk space and
            permissions under identity.data_dir.

      # NOTE: /health 503 detection requires an external prober (e.g.
      # blackbox_exporter) — it is not surfaced as a decdn_* metric. Add
      # an alert in your blackbox rules file along the lines of
      #   probe_http_status_code{job="decdn_health"} == 503
      # if you want to page on not_ready. See adr/appendix-observability.md §3.

  # ---------------------------------------------------------------
  # Delivery health — operator-tunable.
  # ---------------------------------------------------------------
  - name: decdn-delivery
    interval: 30s
    rules:
      # An absolute rate on the one refusal reason that means "the node is at
      # fault", not a ratio over decdn_streams_{failed,completed}_total: the
      # failed family counts every refusal, and every other
      # decdn_serve_stream_rejected_* value is a client-side or policy outcome
      # (unfunded channel, unknown channel, denied hash) that a healthy node
      # produces on purpose, so a failure ratio would page on normal traffic.
      - alert: DecdnServeInternalErrorRate
        expr: sum by (instance) (rate(decdn_serve_stream_rejected_internal_error_total[5m])) > 0
        for: 10m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "Serve path returning internal errors on {{ $labels.instance }}"
          description: |
            The node is refusing paid stream requests with an internal error
            rather than a policy reason. Sustained non-zero means a node-side
            fault — a degraded blob store, a wedged origin, or a signing
            failure — not a client problem. Check the node's error logs; the
            throttled `error!` names the specific failure.

      # ADR 041 serve-economics buy refusals. Alert only on the `amortized`
      # regime: it means the source's warming allowance is spent (or warming is
      # off) so the ceiling is the grief-proof floor and every candidate is
      # above it — this node's own sell rate or margin config is too tight,
      # which is the operator-actionable half. The `warming` regime is "the
      # market is above the market price", a condition no local change fixes, so
      # it is dashboard-only — alerting it would page for someone else's prices.
      # A raw rate, not a ratio: the refusal signs the client NotFound and never
      # reaches the wire, so there is no serve-attempt counter to divide by.
      - alert: DecdnServeEconomicsTooTight
        expr: sum by (instance) (rate(decdn_serve_economics_refused_amortized_total[10m])) > 0.1
        for: 15m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "Serve economics too tight to relay on {{ $labels.instance }}"
          description: |
            This node keeps declining cache-miss relays because every upstream
            quote is above its amortized buy floor — the sell rate or margin
            config cannot resell the bytes for a profit. The node serves its own
            content fine but relays nothing, silently (the refusal signs the
            client NotFound). Raise sell_rate_base or loosen serve-economics
            margin config, or confirm this node is meant to be origin-only.

      # ADR 041 / load-shed overload refusals. Alert on the two reasons a node
      # can act on — node concurrency and egress saturation — summed. The third
      # reason, client_at_capacity, is per-client fairness working as designed on
      # a healthy node, so it is dashboard- and log-only (same treatment as
      # decdn_serve_stream_rejected_signer_floor_at_cap_total); alerting it would
      # page for one client's own burst.
      - alert: DecdnLoadSheddingUnderPressure
        expr: |
          sum by (instance) (
            rate(decdn_load_shed_refused_node_at_capacity_total[5m])
            + rate(decdn_load_shed_refused_egress_saturated_total[5m])
          ) > 0.1
        for: 10m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "Shedding new serves under load on {{ $labels.instance }}"
          description: |
            The node is refusing new paid serves because it is at its concurrency
            high-water mark or its egress budget. In-flight streams stay fast, but
            new clients are turned away (NotFound, so they re-route). Check the
            load-shed panels: raise max_concurrent_serves_high for concurrency, or
            egress_budget_mbps / bandwidth for egress. Sustained shedding means
            this node needs more capacity or a lighter share of traffic.

      # ADR 041 per-source warming grief cap. A sustained rate of speculative
      # buys downgraded to the amortized floor means one or more upstream sources
      # are draining their allowance faster than serves refund it — either a
      # genuine dud source or a grief attempt. The cap is doing its job (the loss
      # is bounded per source), so this is informational, not urgent.
      - alert: DecdnWarmingGriefedDown
        expr: sum by (instance) (rate(decdn_warming_speculative_blocked_total[15m])) > 0.05
        for: 30m
        labels:
          component: delivery
          severity: info
        annotations:
          summary: "Warming allowance being griefed down on {{ $labels.instance }}"
          description: |
            Above-floor warming buys are being downgraded to the amortized floor
            because upstream sources have spent their per-source allowance. The
            grief cap bounds the loss, so this is not urgent, but a sustained rate
            with a rising decdn_warming_sources_blocked means warming is largely
            disabled in practice — investigate which sources are serving duds.

      # Removed in #1513: DecdnHashMismatchAppearing, which read
      # decdn_streams_failed_total{reason="hash_mismatch"}. That family carries
      # `direction` only, never a `reason`, so such a rule is permanently
      # silent. Delivery hash mismatch is genuinely
      # unmetered today — the cache returns CacheError::HashMismatch and the
      # node logs it, but nothing counts it. This is a real coverage gap, not a
      # naming fix; it is recorded in docs/runbook.md rather than papered over
      # with another rule that cannot fire.

      - alert: DecdnProbeHoldsSaturated
        expr: |
          (decdn_probe_hold_slots_used / clamp_min(decdn_probe_hold_slots_max, 1)) > 0.9
        for: 5m
        labels:
          component: probe
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#slashing-risk"
          summary: "Probe-hold slots >90% used on {{ $labels.instance }}"
          description: |
            Saturation means cached content is advertised without an eviction
            hold, so it can be evicted before the pull arrives — wasted round
            trips and lost deliveries. Raise max_probe_holds — on a small cache keep it
            proportional to cache size (recommended: no more than 25% of cache
            capacity); a production node serving many peers should scale the
            default up instead. max_probe_holds is restart-required.

      # Chain-event watcher liveness (#1316) for the payment-settlement watcher
      # — staleness of its last successful poll tick, or a failing poll that
      # never ticked (down-seconds). 180s ≈ several poll intervals; tune to your
      # event_poll_interval. The `> 0` guard skips the pre-first-tick sentinel
      # (gauge reads 0 until the first success).
      - alert: DecdnSettlementWatcherStalled
        expr: ((decdn_settlement_watcher_last_tick_timestamp_seconds > 0) and (time() - decdn_settlement_watcher_last_tick_timestamp_seconds > 180)) or (decdn_settlement_watcher_down_seconds > 180)
        for: 5m
        labels:
          component: settlement
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#refusing-paying-clients-insufficient-deposit"
          summary: "Settlement watcher not ticking on {{ $labels.instance }}"
          description: |
            No successful payment-settlement poll tick for several intervals —
            channel open/settle/close events are not being ingested, so
            voucher redemption and reconciliation stall. Restart and check the
            RPC provider.

      # #1520. Three deposit guards route through this one counter (the miss floor,
      # the window ceiling, the direct-serve ceiling), so it cannot say WHICH — the
      # node's throttled `warn!` names that. The per-signer floor sub-cap does NOT
      # route here: it has its own
      # `decdn_serve_stream_rejected_signer_floor_at_cap_total`, so this rule stays
      # a pool-solvency signal and its two causes below remain the whole story.
      # That sibling counter is deliberately NOT alerted: a signer at its share is
      # a per-counterparty condition on a solvent node, not a node-health fault, so
      # it is dashboard- and log-only (see docs/runbook.md cause 3). Alerting it
      # would page an operator for one client's abandoned streams.
      #
      # A raw rate, not a ratio, because the node exports no serve-ATTEMPT counter:
      # `decdn_serve_stream_rejected_*` is a per-reason family with no success
      # sibling, so there is nothing to divide by. (#1513 deleted the one rule
      # that pretended otherwise — see `DecdnServeInternalErrorRate` above.)
      # The threshold is therefore
      # absolute and deliberately loose: any sustained refusal rate is worth a look,
      # because before #1520 this counter had no alert, panel, or runbook entry at
      # all and a node could refuse every paying client in silence.
      - alert: DecdnRefusingPayingClients
        expr: sum by (instance) (rate(decdn_serve_stream_rejected_insufficient_deposit_total[10m])) > 0.1
        for: 15m
        labels:
          component: payments
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/decdn/blob/main/docs/runbook.md#refusing-paying-clients-insufficient-deposit"
          summary: "Sustained insufficient-deposit refusals on {{ $labels.instance }}"
          description: |
            This node is refusing delivery because the requesting channel's
            remaining deposit cannot cover the reserved cost, and has been for 15
            minutes. Two causes with opposite remedies, and this series cannot tell
            them apart — read the node's throttled `warn!` line, which carries the
            channel and the shortfall:
            (a) clients genuinely running dry, which needs no action; or
            (b) this node's chain watcher lagging an on-chain `ChannelToppedUp`, in
            which case funded clients are being turned away — check RPC health and
            `decdn_settlement_watcher_last_tick_timestamp_seconds`.
            Long `for:` because a burst of dry clients is normal.
            See adr/003-payments.md and docs/runbook.md.

      - alert: DecdnRedemptionFailing
        expr: increase(decdn_redemption_failures_total[30m]) > 2
        for: 30m
        labels:
          component: payments
          severity: warning
        annotations:
          summary: "Voucher redemptions failing on {{ $labels.instance }}"
          description: |
            redeemMany keeps failing: reverted, refused at send, no receipt, a
            timed-out receipt, or a lane-store read failure.
            The claims stay and retry, but unredeemed revenue accrues and a
            closing pool's grace window can run out. Read the redeemMany warn!
            lines (each carries the tx hash when one was issued) and check the
            RPC provider and the operator key's gas balance.

      - alert: DecdnWatermarkReconcileFailing
        expr: increase(decdn_redemption_reconcile_failures_total[30m]) > 2
        for: 30m
        labels:
          component: payments
          severity: warning
        annotations:
          summary: "Pre-redeem watermark reconciliation failing on {{ $labels.instance }}"
          description: |
            The getWatermarks batch read before each redeemMany keeps failing:
            an RPC error, a timeout, or a return whose length did not match the
            batch.
            The read is fail-open, so claims are still submitted and the
            contract's own no-op guard keeps them correct — the cost is gas
            spent on lanes the chain already settled, not lost revenue.
            Check the RPC endpoint's eth_call response-size and gas ceilings
            against the read batch size, and read the stage="reconcile" warn!
            lines for the underlying error.

      - alert: DecdnOnchainTxTimeouts
        expr: increase(decdn_onchain_tx_timeout_total[1h]) > 0
        for: 0m
        labels:
          component: payments
          severity: warning
        annotations:
          summary: "On-chain transaction receipts timing out on {{ $labels.instance }}"
          description: |
            A node transaction was issued but its receipt did not arrive in
            time. It can still mine; look it up by the tx hash in the warn!
            line. A repeat points at a congested chain or a low gas price.

      # The next four are latent-bug reports, not degradations: each non-zero
      # increase is a node-side fault worth filing. increase(...[1h]) rather
      # than a bare > 0, so the alert resolves an hour after the last event.
      - alert: DecdnServeNodeFault
        expr: increase(decdn_serve_stream_node_fault_total[1h]) > 0
        for: 0m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "Delivery abandoned on a node-side fault on {{ $labels.instance }}"
          description: |
            A cdn/client/v1 delivery ended on a fault this node caused (encode,
            alignment, store or framing). The client saw only a short stream.
            File the error! line beside it.

      - alert: DecdnFrameAccountingFault
        expr: increase(decdn_serve_frame_accounting_fault_total[1h]) > 0
        for: 0m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "Serve frame accounting fault on {{ $labels.instance }}"
          description: |
            A serve leg refused to frame a chunk because its own byte
            accounting did not add up. The delivery aborted cleanly; file it.

      - alert: DecdnWatcherPersistFailures
        expr: increase(decdn_watcher_persist_failures_total[1h]) > 0
        for: 0m
        labels:
          component: watcher
          severity: warning
        annotations:
          summary: "Chain watcher could not persist state on {{ $labels.instance }}"
          description: |
            A chain watcher failed to write its projection or lane state. Check
            disk health under identity.data_dir.

      - alert: DecdnLaneFlushFailures
        expr: increase(decdn_lane_flush_failures_total[1h]) > 0
        for: 15m
        labels:
          component: payments
          severity: warning
        annotations:
          summary: "Lane store cannot flush on {{ $labels.instance }}"
          description: |
            Background lane-store flushes keep failing; the dirty set retries
            each tick, but the frontier a crash would replay keeps growing.
            Check disk health and space under identity.data_dir.

      - alert: DecdnNodePullCorruption
        expr: increase(decdn_node_pull_corruption_total[1h]) > 0
        for: 0m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "Upstream node served corrupt bytes to {{ $labels.instance }}"
          description: |
            A node-to-node pull received bytes that failed bao verification.
            The node rejected them and scored the upstream; a repeat from one
            peer points at a faulty or dishonest node.

      - alert: DecdnPoolGraceCloseWithUnredeemed
        expr: increase(decdn_pool_grace_closes_total[1h]) > 0
        for: 0m
        labels:
          component: payments
          severity: warning
        annotations:
          summary: "A pool closing on {{ $labels.instance }} holds unredeemed vouchers"
          description: |
            A pool owner started a close while this node held unredeemed
            vouchers on it. The redeemer must land them before the grace window
            ends or the revenue is lost. Check that redeemMany is landing
            (decdn_onchain_tx_landed_total, DecdnRedemptionFailing) and that the
            operator key has gas.

      - alert: DecdnBuyerWalletUnfunded
        # Scoped on `> 0`, not on the series existing: every metric is registered
        # unconditionally, so a cache-only node exports
        # decdn_node_pull_attempts_total at 0 and an `>= 0` guard would match it
        # too — firing on exactly the nodes whose empty wallet is correct.
        # Having ATTEMPTED a pull is the observable marker that this node buys.
        #
        # The cost is a warm-up gap: a freshly started node does not alert until
        # its first miss. That is the safe direction, and an unfunded wallet is
        # reached through an attempt anyway — the pull is attempted, then the
        # openPool reverts — so the real condition still fires.
        #
        # Threshold is the 10 USDC default for
        # blockchain.buyer_working_deposit_micro_usdc; raise it alongside that
        # knob, which PromQL cannot read.
        expr: |
          decdn_buyer_wallet_usdc < 10000000
            and on(instance) (decdn_node_pull_attempts_total > 0)
        for: 30m
        labels:
          component: payments
          severity: warning
        annotations:
          summary: "Buyer wallet below one working deposit on {{ $labels.instance }}"
          description: |
            The node's own USDC wallet cannot cover
            blockchain.buyer_working_deposit_micro_usdc, so the next openPool
            reverts on the ERC-20 transfer and every cache miss goes to origin
            instead of to a peer. The node keeps serving normally, which is why
            nothing else here fires. Fund the operator address, or lower the
            working deposit. Pair with
            decdn_pool_open_failures_insufficient_deposit_total, which starts
            counting once the wallet is actually empty.

      - alert: DecdnNodePullNeverSucceeds
        # attempts without a single success over a long window. Not a rate
        # threshold: one success clears it, so this only fires on a leg that is
        # wholly broken rather than merely unlucky.
        expr: |
          increase(decdn_node_pull_attempts_total[6h]) > 10
            and increase(decdn_node_pull_success_total[6h]) == 0
        for: 30m
        labels:
          component: delivery
          severity: warning
        annotations:
          summary: "No node-to-node pull has succeeded on {{ $labels.instance }} in 6h"
          description: |
            The node keeps trying to backfill cache misses from peers and never
            completes one, so every miss falls through to origin and the fleet
            pays origin egress repeatedly for blobs it already holds. Check
            decdn_pool_open_failures_{insufficient_deposit,contract_revert,rpc_error}_total
            for the buyer leg, decdn_node_pull_no_providers_total for discovery,
            and decdn_buyer_wallet_usdc for funding.

      - alert: DecdnDhtRoutingTableEmpty
        expr: decdn_dht_routing_table_size == 0
        for: 30m
        labels:
          component: dht
          severity: warning
        annotations:
          summary: "DHT routing table empty on {{ $labels.instance }}"
          description: |
            The node knows no DHT peers after bootstrap and refresh, so it
            cannot discover providers or publish its content. Check network
            reachability and that the staker set lists live seeds. The gauge is
            set after bootstrap and on each bucket-refresh tick.
