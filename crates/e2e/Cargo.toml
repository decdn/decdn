[package]
name = "decdn-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cross-layer Rust↔contract end-to-end test fixtures for deCDN (issue #1028)"
publish = false

# This crate is test-infrastructure only: it ships reusable fixtures (chain /
# node / client / time-control / assertions) that compose a real anvil
# deployment, subprocess daemon(s), and the paid client path. The fixtures live
# in the library; the test targets are feature-gated journeys built on them —
# the smoke test that proves the fixtures compose, and the G-NODE-04 blacklist
# compliance journeys (#1031). See `crates/node/tests/anvil_settlement_e2e.rs`
# for the monolith this generalizes.
[lib]
doctest = false

[features]
default = []
# Opt-in gate for the live anvil-backed test targets (`tests/`). Mirrors
# `decdn-node`'s `anvil-e2e` feature: off by default so `cargo nextest run`
# stays fast and needs no `anvil`/`forge` binaries. The fixtures themselves
# always compile; only the tests that actually drive a chain are gated. Enables
# `decdn-incentive`'s `redb` store here rather than on the direct dependency: the
# only `RedbBuyerChannelStore` user is the gated `cli_fetch_topup` test, so
# default builds skip that crate's `buyer_channel_redb` module.
#
# What this gate buys is the *store type*, not the dependency. Since #1246 the
# shared buyer-table codec/ops (`buyer_channel_table`) compile in every build of
# this crate: `decdn-node` is a non-optional dep and enables
# `decdn-incentive/buyer-store-core`. `redb` was never actually gated out here
# either — it arrives transitively via `decdn-node`.
anvil-e2e = ["decdn-incentive/redb"]

[dependencies]
decdn-node = { workspace = true }
decdn-incentive = { workspace = true }
decdn-cache = { workspace = true }
decdn-common = { workspace = true }
decdn-client-pull = { workspace = true }
decdn-protocol = { workspace = true }
decdn-config-types = { workspace = true }
# Outboard construction for `seed_origin_blob_with_outboard`: seeds the sibling
# `{H}.obao4` so a ranged origin fetch reaches the real range tier instead of
# degrading to a whole-blob fill (#1372). `IROH_BLOCK_SIZE` comes from the leaf
# `decdn-bao-range` so the fixture can't diverge from the canonical block size.
decdn-bao-range = { workspace = true }
bao-tree = { workspace = true }
alloy = { workspace = true }
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
jsonrpsee = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
