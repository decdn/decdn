[package]
name = "decdn-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI entry point and runtime wiring for a deCDN node"

[[bin]]
name = "decdn"
path = "src/main.rs"

[features]
default = []
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
decdn-protocol = { workspace = true }
decdn-cache = { workspace = true }
decdn-incentive = { workspace = true }
decdn-reputation = { workspace = true }
decdn-gossip = { workspace = true }
decdn-common = { workspace = true }
alloy = { workspace = true }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-gossip = { workspace = true }
iroh-metrics = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
jsonrpsee = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
governor = { workspace = true }
arc-swap = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# `nix` provides a safe wrapper around `raise(2)` so the SIGHUP/SIGTERM
# integration tests can deliver real signals from inside the test process
# without violating the workspace `unsafe_code = "forbid"` lint that would
# otherwise force us to use `libc::raise` directly.
nix = { version = "0.31", default-features = false, features = ["signal"] }
wiremock = { workspace = true }

[lints]
workspace = true
