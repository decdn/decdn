[package]
name = "decdn-node"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI entry point and runtime wiring for a deCDN node"

[[bin]]
name = "decdn-node"
path = "src/main.rs"

[features]
default = []
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Opt-in gate for the live anvil-backed on-chain settlement e2e
# (`tests/anvil_settlement_e2e.rs`, issue #745). Off by default so `cargo
# nextest run` stays fast and needs no `anvil`/`forge` binaries. The e2e
# spawns `anvil` as a subprocess and shells out to `forge script` — no extra
# crate deps — and only compiles under this feature. Pulls `decdn-incentive`'s
# `test-util` for `BuyerChannelTable::insert_raw`, which backs this crate's
# `insert_raw_buyer_record` seam (the #763 reconciliation e2e seeds an
# undecodable row through it).
anvil-e2e = ["decdn-incentive/test-util"]

[dependencies]
decdn-protocol = { workspace = true }
decdn-cache = { workspace = true }
decdn-client-pull = { workspace = true }
# `NodeAdmitStore` (`src/node_origin/admit_store.rs`, #1621 Task 10) implements
# `decdn_bao_range::RangedStore` directly (delegating to `NodeRangedStore`), so
# the trait/types must be named here rather than borrowed through a re-export.
decdn-bao-range = { workspace = true }
# `RangedStore::present_ranges`/`missing_ranges` return `bao_tree::ChunkRanges`
# directly (the same signature `NodeRangedStore` uses), so `NodeAdmitStore`'s
# delegating impl names the type — not just a dev/test dependency any more.
bao-tree = { workspace = true }
decdn-incentive = { workspace = true, features = ["buyer-store-core"] }
decdn-reputation = { workspace = true }
decdn-gossip = { workspace = true }
decdn-common = { workspace = true }
alloy = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
# Incremental whole-blob BLAKE3 for the window-paced pull-through (#856): the
# fused pull-and-forward path hashes chunks as they stream rather than buffering
# the blob to call `Hash::new`. Same BLAKE3 iroh-blobs addresses with.
blake3 = { workspace = true }
iroh-gossip = { workspace = true }
iroh-metrics = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
socket2 = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
indexmap = { workspace = true }
jsonrpsee = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
governor = { workspace = true }
arc-swap = { workspace = true }
redb = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
# Enable the client-pull test helpers (`stream_fetch`, `PullDeadlines::whole_transfer`) for
# the loopback/e2e suites. Dev-only, so a normal `cargo build -p decdn-node` never sees them
# and a production caller cannot reach the zero-stall/uncapped deadline shape (#1145 review).
decdn-client-pull = { workspace = true, features = ["test-util"] }
# `insert_raw_buyer_record` (`#[cfg(any(test, feature = "anvil-e2e"))]`) delegates
# to `BuyerChannelTable::insert_raw`, which is `test-util`-gated so a corruption
# seeder stays out of the shipped API. A cross-crate `cfg(test)` doesn't
# propagate, so the lib's own test build needs the feature via a dev-dep — same
# shape as `decdn-client-pull` above.
decdn-incentive = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# `admit_store.rs`'s in-memory `BaoRangeReader` test double implements
# `iroh_io::AsyncStreamReader` directly over a `Bytes` cursor.
iroh-io = { workspace = true }
# Property-based tests for the DHT routing table (`src/dht/routing.rs`):
# xor_distance metric laws and the fixed-bucket / within-K invariants under
# random insert/remove sequences. Mirrors the `proptest` usage already in
# `decdn-protocol` (framing round-trip tests).
proptest = { workspace = true }
# `nix` provides a safe wrapper around `raise(2)` so the SIGHUP/SIGTERM
# integration tests can deliver real signals from inside the test process
# without violating the workspace `unsafe_code = "forbid"` lint that would
# otherwise force us to use `libc::raise` directly.
nix = { version = "0.31", default-features = false, features = ["signal"] }
wiremock = { workspace = true }
# `chain_events::test_support::hanging_provider` — a transport whose RPCs never
# resolve, so the `timed`-bounding tests drive each watcher's *production* read
# path against a stalled provider. See the workspace manifest for why alloy's
# `Asserter` can't cover this, and why the packet types come from a dev-dep
# rather than alloy's `json-rpc` feature.
tower = { workspace = true }
alloy-json-rpc = { workspace = true }
# `tests/origin_range_pull.rs` builds the `{H}.obao4` pre-order outboard a
# range-pull origin must publish, so the e2e test can verify the cold ranged
# cdn/client/v1 path (#823/#990). Matches the cache crate's outboard codec.
# (Promoted to a normal dependency above, #1621 Task 10 — kept documented here
# since this suite is still the reason it needs to be workspace-versioned.)
# `tests/client_loopback.rs` constructs a real `ChannelReceiptSink` via
# `receipt_log::spawn_receipt_writer` (which takes a `CancellationToken`) to
# prove the paid-delivery hot path never blocks on receipt-log I/O (#803).
# Integration-test crates don't inherit the lib's normal deps, so it is also a
# dev-dep here.
tokio-util = { workspace = true }

[lints]
workspace = true
