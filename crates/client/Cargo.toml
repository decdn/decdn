[package]
name = "decdn-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared client-side paid-pull machinery used by both the node (node-to-node miss pulls) and the CLI (client fetch / bundle pull): the cdn/client/v1 requester and the buyer PaymentPool open kernel"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
# Exposes the in-memory `stream_fetch*` wrappers — thin drivers of the one receive
# loop (`UpstreamPull`) that hand the decoded bytes back instead of streaming into a
# store — and the single-deadline `PullDeadlines::whole_transfer` shape they pass,
# which deliberately builds the zero-stall / uncapped state the production
# constructors reject. Gated so a production caller cannot even name them (#1145
# review); enabled by downstream test suites via `dev-dependencies`.
test-util = []

[dependencies]
decdn-protocol = { workspace = true }
decdn-incentive = { workspace = true }
# `endpoint` resolves relays + `[network.discovery]` from the shared config
# schema and reuses the identity/redaction helpers. `decdn-common` is
# iroh-blobs-free (config-vocabulary lives in the `decdn-config-types` leaf,
# #578), so depending on it here does not regress the CLI's iroh-blobs-free
# invariant — verify with `cargo tree -p decdn-cli -e normal -i iroh-blobs`.
decdn-common = { workspace = true }
# Iroh-blobs-free bao verified-range helpers (alignment / encoded-size) shared
# with the serve side, plus the bao codec for the receive-side verifying decoder
# (#915, ADR 038). Both are pure `bao-tree`, so the CLI stays iroh-blobs-free
# (#578) — verify with `cargo tree -p decdn-cli -e normal -i iroh-blobs`.
decdn-bao-range = { workspace = true }
# `tokio_fsm` is what exposes `io::fsm::ResponseDecoder`, the INCREMENTAL
# decoder the streaming/resumable fetch drives (#1120). Requested explicitly
# rather than relied on from workspace feature unification: `decdn-cli` must
# build without any iroh-blobs crate in the graph to turn the feature on for us.
bao-tree = { workspace = true, features = ["tokio_fsm"] }
iroh-io = { workspace = true }
# `try_join_all` drives one worker future per source concurrently on the caller's
# task (the multi-source scheduler, spec §5.3) — no `tokio::spawn`, so the
# `!Send` `ingest_stream` decode future is fine.
futures-util = { workspace = true }
alloy = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
iroh = { workspace = true }
# `discovery::select_candidates` shuffles the probe sample (#1988).
rand = { workspace = true }
# Peer store (one JSON file per peer under `<data_dir>/peers`) persistence for
# the ADR 012 bootstrap fallback.
serde = { workspace = true }
serde_json = { workspace = true }
# Unique temp names for the peer store's per-record write-and-rename: two
# `decdn` processes can share a client data dir, and a fixed temp name would
# let them interleave into one record file and rename the tear into place.
# Also used by `endpoint`'s relay-resolution tests for throwaway TOML config
# files.
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
decdn-bao-range = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
