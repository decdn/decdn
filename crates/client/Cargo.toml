[package]
name = "decdn-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The deCDN client SDK: fetch content-addressed blobs from deCDN nodes, pay per megabyte from a USDC payment pool, and verify every byte as it arrives"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
# Exposes the in-memory `stream_fetch*` wrappers — thin drivers of the one receive
# loop (`UpstreamPull`) that hand the decoded bytes back instead of streaming into a
# store — and the single-deadline `PullDeadlines::whole_transfer` shape they pass,
# which deliberately builds the zero-stall / uncapped state the production
# constructors reject. Gated so a production caller cannot even name them (#1145
# review); enabled by downstream test suites via `dev-dependencies`. Also turns
# on `decdn-bao-range/test-util`, where `ProvenSize::assume_for_tests` and the
# in-memory reader's `StashedFault` live.
test-util = ["decdn-bao-range/test-util"]
# Gates the slow `public_api` snapshot test out of the default
# `cargo nextest --workspace` (coverage) run. CI's dedicated `public-api` job
# opts in with `--features public-api-test`.
public-api-test = []

[dependencies]
decdn-protocol = { workspace = true }
decdn-incentive = { workspace = true }
# `endpoint` resolves relays + `[network.discovery]` from the shared config
# schema and reuses the identity/redaction helpers. `decdn-common` links no
# AWS SDK (config-vocabulary lives in the `decdn-config-types` leaf, #578).
decdn-common = { workspace = true }
# Bao verified-range helpers (alignment / encoded-size) shared with the serve
# side, plus the store contract a paid pull fills (#915, ADR 038).
decdn-bao-range = { workspace = true }
# `tokio_fsm` is what exposes `io::fsm::ResponseDecoder`, the INCREMENTAL
# decoder the streaming/resumable fetch drives (#1120). Requested explicitly
# rather than relied on from workspace feature unification.
bao-tree = { workspace = true, features = ["tokio_fsm"] }
iroh-io = { workspace = true }
# The download store (#2881): a download keeps its verified bytes, outboard and
# present ranges in an iroh-blobs file store beside its destination, and a
# resumed download reads them back from it.
iroh-blobs = { workspace = true }
# `FuturesUnordered` drives one worker future per lane concurrently on the
# caller's task (the acquire loop, ADR 039): no `tokio::spawn`, so the `!Send`
# `ingest_stream` decode future is fine.
futures-util = { workspace = true }
alloy = { workspace = true }
anyhow = { workspace = true }
# `rayon`: a finished download's whole-file hash runs on every core
# (`Hasher::update_rayon`).
blake3 = { workspace = true, features = ["rayon"] }
bytes = { workspace = true }
# A bundle pull lands every entry beneath the output directory's handle, so a
# symlink in an entry's parent chain cannot move the write outside it (#2439).
cap-std = { workspace = true }
# Two manifest paths that differ only in Unicode normalization name one file on
# macOS, so a manifest holding both is rejected (#2691).
icu_normalizer = { workspace = true }
iroh = { workspace = true }
# `discovery::select_candidates` shuffles the discovery sample (#1988).
rand = { workspace = true }
# Peer store (one JSON file per peer under `<data_dir>/peers`) persistence for
# the ADR 012 bootstrap fallback.
serde = { workspace = true }
serde_json = { workspace = true }
# Unique temp names for the peer store's per-record write-and-rename: two
# `decdn` processes can share a client data dir, and a fixed temp name would
# let them interleave into one record file and rename the tear into place.
# Also used by `endpoint`'s relay-resolution tests for throwaway TOML config
# files.
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# A mocked chain answers a revert with a JSON-RPC `ErrorPayload`, which `alloy`
# does not re-export (the funding recovery tests).
alloy-json-rpc = { workspace = true }
decdn-bao-range = { workspace = true, features = ["test-util"] }
# The examples keep the buyer's pool and lane records in the same redb store
# `decdn get` uses, and print their warnings through a subscriber. `test-util`
# brings `test_rpc::ScriptedRpc`, which the `buyer_pool` and funding tests use
# to park a receipt wait.
decdn-incentive = { workspace = true, features = ["redb", "test-util"] }
tracing-subscriber = { workspace = true }
# Public-API stability snapshot (#1150). Only exercised by the `public_api` test
# target below, which is gated behind `public-api-test`.
public-api = { workspace = true }
rustdoc-json = { workspace = true }
insta = { workspace = true }
# The pay-ahead property test: no byte range of one lane is paid for twice.
proptest = { workspace = true }

# The public-API snapshot test shells out to rustdoc and is slow, so it is
# compiled and run only when `public-api-test` is enabled (see CONTRIBUTING.md
# § Public API snapshot).
[[test]]
name = "public_api"
path = "tests/public_api.rs"
required-features = ["public-api-test"]

# The store tests open stores through the `test-util` constructors
# (`ClientRangedStore::on_disk`, `in_memory`).
[[test]]
name = "ranged_store_client"
path = "tests/ranged_store_client.rs"
required-features = ["test-util"]

[[test]]
name = "ranged_store_conformance"
path = "tests/ranged_store_conformance.rs"
required-features = ["test-util"]

[lints]
workspace = true
