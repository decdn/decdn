<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fund a payment channel</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; }
  #done { display: none; }
  #error { display: none; color: #b00020; }
</style>
</head>
<body>
<h1>Fund a payment channel</h1>
<p>Verify you are not a robot to fund a payment channel.</p>

<div class="cf-turnstile" data-sitekey="{{SITEKEY}}" data-callback="onTurnstileToken"></div>

<p id="done">You can return to your terminal.</p>
<p id="error">Something went wrong. Please refresh and try again.</p>

<script>
  const CLIENT = "{{CLIENT}}";
  const HASH = "{{HASH}}";

  function onTurnstileToken(token) {
    fetch("/fund", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ client: CLIENT, hash: HASH, turnstile_token: token }),
    })
      .then((resp) => {
        if (resp.ok) {
          document.getElementById("done").style.display = "block";
        } else {
          document.getElementById("error").style.display = "block";
        }
      })
      .catch(() => {
        document.getElementById("error").style.display = "block";
      });
  }
</script>
</body>
</html>
