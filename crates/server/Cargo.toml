[package]
name = "sponsord"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
anvil-e2e = []

[dependencies]
tokio.workspace = true
anyhow.workspace = true
alloy.workspace = true
decdn-client-pull.workspace = true
decdn-incentive.workspace = true
decdn-common.workspace = true
redb = "4"
reqwest = { version = "0.12", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
# Needed by the non-`#[cfg(test)]` `test_support` module (see its doc
# comment): integration tests under `tests/` link against the lib built
# without `cfg(test)`, so `test_support`'s fakes must compile in a normal
# build, and so must this.
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
decdn-e2e = { path = "../../../decdn/crates/e2e", features = ["anvil-e2e"] }
# Pinned to the same major as decdn's workspace (`decdn/Cargo.toml`) so
# `iroh::SecretKey` here is the identical type `ChainFixture::onboard_operator`
# expects — needed only to build the provider's node identity for the fixture.
iroh = "1"
