[package]
name = "sponsord-onramp"
description = "The public onramp in front of sponsord: a pluggable gate, and the installers that download through it"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Where `cargo binstall` finds this binary: the archive release.yml's
# `build-binaries` job attaches to the GitHub Release. Prebuilt binaries from
# anywhere else (cargo-quickinstall) are refused unless the user passes
# `--strategies`; a target with no archive compiles from source.
# .github/scripts/check_binstall_metadata.py holds these names to the release
# matrix.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sponsord-onramp-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[lints]
workspace = true

[dependencies]
sponsord-api = { workspace = true, features = ["axum", "client", "secret"] }
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
alloy-primitives.workspace = true
reqwest.workspace = true
# reqwest is `rustls-no-provider` workspace-wide; `main` installs ring.
rustls.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
axum.workspace = true

[features]
# `test_support`: fakes for the daemon and the gate, and a ready `AppState`.
test-support = []

[dev-dependencies]
# This crate's own integration tests use `test_support`.
sponsord-onramp = { path = ".", features = ["test-support"] }
serde_json.workspace = true
wiremock.workspace = true
tower = { workspace = true, features = ["util"] }
