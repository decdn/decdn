[package]
name = "sponsord-onramp"
description = "The public onramp in front of sponsord: a pluggable gate, and the installers that download through it"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
sponsord-api = { workspace = true, features = ["axum", "client", "secret"] }
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
alloy-primitives.workspace = true
reqwest.workspace = true
# reqwest is `rustls-no-provider` workspace-wide; `main` installs ring.
rustls.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
axum.workspace = true

[features]
# `test_support`: fakes for the daemon and the gate, and a ready `AppState`.
test-support = []

[dev-dependencies]
# This crate's own integration tests use `test_support`.
sponsord-onramp = { path = ".", features = ["test-support"] }
serde_json.workspace = true
wiremock.workspace = true
tower = { workspace = true, features = ["util"] }
