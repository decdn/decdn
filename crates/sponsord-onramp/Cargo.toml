[package]
name = "sponsord-onramp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sponsord-api = { workspace = true, features = ["axum", "client", "secret"] }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
alloy.workspace = true
redb = "4"
reqwest = { version = "0.12", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait = "0.1"
axum = "0.8"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
# Used by `test_support.rs` (pulled into the integration-test binaries via
# `#[path]`, not part of the shipped lib/bin) and by the store tests.
tempfile = "3"
sponsord.workspace = true
sponsord-core = { workspace = true, features = ["test-support"] }
decdn-incentive.workspace = true
