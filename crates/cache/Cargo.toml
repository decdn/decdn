[package]
name = "decdn-cache"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cache engine wrapping iroh-blobs with origin pull-through for deCDN"

[dependencies]
decdn-protocol = { workspace = true }
decdn-config-types = { workspace = true }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-metrics = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chacha20poly1305 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
# Streaming primitives for origin pull-through (issue #271). `futures-util`
# brings `Stream` + combinators; `tokio-util` brings `ReaderStream` /
# `StreamReader` used by FilesystemOrigin and the HTTP decompression
# pipeline; `async-compression` decompresses gzip/zstd in the stream
# pipeline. All MIT/Apache-2.0, allowed by deny.toml.
futures-util = { workspace = true }
tokio-util = { workspace = true }
async-compression = { workspace = true }
# Atomic swap of the pinned-hashes set on SIGHUP (#276). Matches the
# Arc<AtomicU64> pattern used for payment.rate_per_mb (commit 166ae41) — the
# pinned set is non-Copy so AtomicU64 can't carry it; ArcSwap is the
# standard fix and is MIT/Apache-2.0.
arc-swap = "1"
# Jitter for the origin retry/backoff loop (#285). Uses `rand::random::<f64>()`
# only; no per-call state, so no RNG instance is held.
rand = { workspace = true }
# AWS SDK pieces for the S3 origin (#437 PR2). See the workspace
# `[workspace.dependencies]` block for the rationale on each
# `default-features = false` choice and the hyper-1 + aws-lc-rs binding.
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-credential-types = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
# Test fixtures construct gzipped / zstd response bodies for the
# HttpOrigin decompression tests. The runtime decoders moved to
# `async-compression` in #271 PR3 — these crates remain only on the
# encoder side for tests.
flate2 = "1"
zstd = "0.13"
# Operation-level S3 mocks (#437 PR2). The `mock_client!` macro builds an
# `aws_sdk_s3::Client` whose dispatcher returns canned responses, so
# `S3Origin` can be exercised end-to-end without standing up MinIO.
aws-smithy-mocks = { workspace = true }
# Re-list `aws-sdk-s3` with the `test-util` feature — cargo unifies feature
# sets between deps and dev-deps, so this turns on the test-only constructors
# (notably `aws_sdk_s3::config::Builder::new()`-friendly helpers used by
# `mock_client!`) for the dev build only. Standard cargo idiom for differing
# prod/dev feature sets.
aws-sdk-s3 = { workspace = true, features = ["test-util"] }
# Wire-form pinning tests for `OriginKind` and any other operator-visible
# JSON serialised by this crate (#439).
serde_json = { workspace = true }

[lints]
workspace = true
