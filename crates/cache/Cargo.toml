[package]
name = "decdn-cache"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cache engine wrapping iroh-blobs with origin pull-through for deCDN"

[dependencies]
decdn-protocol = { workspace = true }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chacha20poly1305 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
# Decompression for HttpOrigin (#312). flate2 covers gzip; zstd covers zstd.
# Both are MIT/Apache-2.0, allowed by deny.toml.
flate2 = "1"
zstd = "0.13"
# Atomic swap of the pinned-hashes set on SIGHUP (#276). Matches the
# Arc<AtomicU64> pattern used for payment.rate_per_mb (commit 166ae41) — the
# pinned set is non-Copy so AtomicU64 can't carry it; ArcSwap is the
# standard fix and is MIT/Apache-2.0.
arc-swap = "1"

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
