[package]
name = "decdn-incentive"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Payment channels, bonding, and voucher management for deCDN"

[features]
# Shared buyer-channel redb table (`buyer_channel_table`, #1246): the on-disk
# record codec plus the table operations, over a caller-supplied
# `redb::Database`. The node's combined seller+buyer `channels.redb` store
# enables *only* this and keeps its own file + per-op transaction wiring (redb
# forbids two `Database` handles on one file), so both buyer stores share one
# definition of the on-disk format without the node adopting
# `RedbBuyerChannelStore`.
#
# NOTE: `dep:redb` must stay spelled here. An optional dependency has to be
# referenced as `dep:<name>` by some feature or Cargo rejects the manifest
# outright ("optional dependency `redb` is not included in any feature"), and
# the explicit `redb` feature below shadows the name so it cannot serve that
# role itself.
buyer-store-core = ["dep:redb", "dep:postcard"]
# Persistent buyer-only store (`buyer_channel_redb`): adds
# `RedbBuyerChannelStore` (its own `buyer-channels.redb` file + open guards) on
# top of the shared table. Off by default so the contracts/voucher logic doesn't
# link `redb`; the CLI (`decdn fetch`, #940) enables it for cross-invocation
# channel reuse. (Only `redb` is avoided — `postcard` arrives unconditionally
# via `decdn-protocol` no matter what is enabled here.)
redb = ["buyer-store-core"]
# Exposes `BuyerChannelTable::insert_raw`, which writes raw bytes past the
# encoder to seed an undecodable row. Gated so a corruption-seeding writer stays
# out of the shipped API, but NOT `#[cfg(test)]`: a cross-crate `cfg(test)` does
# not propagate, and `decdn-node`'s `insert_raw_buyer_record` seam (its #763
# reconciliation e2e) has to reach it. Enabled from downstream
# `[dev-dependencies]` — same pattern as `decdn-client-pull`'s `test-util`.
test-util = []

[dependencies]
decdn-common = { workspace = true }
decdn-protocol = { workspace = true }
iroh = { workspace = true }
alloy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rpassword = { workspace = true }
zeroize = { workspace = true }
redb = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
# Deserializing an `alloy` JSON-RPC `ErrorPayload` in `tx.rs`'s send-error
# classifier test — `ErrorPayload` is not re-exported through `alloy::transports`,
# so its wire shape is the only constructor available.
serde_json = { workspace = true }
# Cargo.lock parsing for the ed25519 dalek pin-parity test
# (tests/ed25519_pin_parity.rs).
toml = { workspace = true }
# Property-based tests for EIP-712 voucher round-trips (`src/voucher.rs`,
# `src/client_bridge.rs`): the full-U256 nonce/amount keyspace with boundary
# values (0, u64::MAX, U256::MAX) heavily over-sampled, exercising sign/recover
# and the wire bridge against silent truncation. Mirrors the `proptest` usage in
# the `node` DHT routing tests (#748).
proptest = { workspace = true }

[lints]
workspace = true
