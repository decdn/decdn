[package]
name = "decdn-incentive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Payment channels, bonding, and voucher management for deCDN"

[features]
# Shared buyer-channel redb table (`buyer_channel_table`, #1246): the on-disk
# record codec plus the table operations, parameterized over the caller's
# `redb::Database` + `TableDefinition`. The node's combined seller+buyer
# `channels.redb` store enables *only* this and keeps its own file, table const,
# and per-op transaction wiring (redb forbids two `Database` handles on one
# file), so both buyer stores share one definition of the on-disk format without
# the node adopting `RedbBuyerChannelStore`.
#
# NOTE: `dep:redb` must stay spelled here. It is what suppresses Cargo's
# implicit `redb` feature for the optional dependency of the same name; drop it
# and that implicit feature collides with the explicit `redb` feature below.
buyer-store-core = ["dep:redb", "dep:postcard"]
# Persistent buyer-only store (`buyer_channel_redb`): adds
# `RedbBuyerChannelStore` (its own `buyer-channels.redb` file + open guards) on
# top of the shared table. Off by default so the contracts/voucher logic doesn't
# pull redb/postcard; the CLI (`decdn fetch`, #940) enables it for
# cross-invocation channel reuse.
redb = ["buyer-store-core"]

[dependencies]
decdn-common = { workspace = true }
decdn-protocol = { workspace = true }
iroh = { workspace = true }
alloy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rpassword = { workspace = true }
zeroize = { workspace = true }
redb = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
# Cargo.lock parsing for the ed25519 dalek pin-parity test
# (tests/ed25519_pin_parity.rs).
toml = { workspace = true }
# Property-based tests for EIP-712 voucher round-trips (`src/voucher.rs`,
# `src/client_bridge.rs`): the full-U256 nonce/amount keyspace with boundary
# values (0, u64::MAX, U256::MAX) heavily over-sampled, exercising sign/recover
# and the wire bridge against silent truncation. Mirrors the `proptest` usage in
# the `node` DHT routing tests (#748).
proptest = { workspace = true }

[lints]
workspace = true
