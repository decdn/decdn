[package]
name = "decdn-incentive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Payment channels, bonding, and voucher management for deCDN"

[features]
# Persistent buyer-channel store (`buyer_channel_redb`). Off by default so the
# contracts/voucher logic doesn't pull redb/postcard; the CLI (`decdn fetch`,
# #940) enables it for cross-invocation channel reuse.
redb = ["dep:redb", "dep:postcard"]

[dependencies]
decdn-common = { workspace = true }
decdn-protocol = { workspace = true }
iroh = { workspace = true }
alloy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rpassword = { workspace = true }
zeroize = { workspace = true }
redb = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
# Property-based tests for EIP-712 voucher round-trips (`src/voucher.rs`,
# `src/client_bridge.rs`): the full-U256 nonce/amount keyspace with boundary
# values (0, u64::MAX, U256::MAX) heavily over-sampled, exercising sign/recover
# and the wire bridge against silent truncation. Mirrors the `proptest` usage in
# the `node` DHT routing tests (#748).
proptest = { workspace = true }

[lints]
workspace = true
