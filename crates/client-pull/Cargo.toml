[package]
name = "decdn-client-pull"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared client-side paid-pull machinery used by both the node (node-to-node miss pulls) and the CLI (client fetch / bundle pull): the cdn/client/v1 requester and the buyer PaymentChannel open kernel"

[features]
# Exposes the legacy single-deadline test helpers (`PullDeadlines::whole_transfer`,
# `stream_fetch`) that deliberately build the zero-stall / uncapped state the production
# constructors reject. Gated so a production caller cannot even name them (#1145 review);
# enabled by downstream test suites via `dev-dependencies`.
test-util = []

[dependencies]
decdn-protocol = { workspace = true }
decdn-incentive = { workspace = true }
# `endpoint` resolves relays + `[network.discovery]` from the shared config
# schema and reuses the identity/redaction helpers. `decdn-common` is
# iroh-blobs-free (config-vocabulary lives in the `decdn-config-types` leaf,
# #578), so depending on it here does not regress the CLI's iroh-blobs-free
# invariant — verify with `cargo tree -p decdn-cli -e normal -i iroh-blobs`.
decdn-common = { workspace = true }
# Iroh-blobs-free bao verified-range helpers (alignment / encoded-size) shared
# with the serve side, plus the bao codec for the receive-side verifying decoder
# (#915, ADR 038). Both are pure `bao-tree`, so the CLI stays iroh-blobs-free
# (#578) — verify with `cargo tree -p decdn-cli -e normal -i iroh-blobs`.
decdn-bao-range = { workspace = true }
bao-tree = { workspace = true }
alloy = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
iroh = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `endpoint`'s relay-resolution tests write throwaway TOML config files.
tempfile = { workspace = true }

[lints]
workspace = true
