[package]
name = "sponsord-e2e"
description = "Tests that run the sponsord daemon, onramp and installer together"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Never released: it carries the workspace version only because every member
# does, and has no changelog for the release to update.
[package.metadata.release]
release = false

[dev-dependencies]
sponsord.workspace = true
sponsord-api = { workspace = true, features = ["client"] }
sponsord-core = { workspace = true, features = ["test-support"] }
sponsord-onramp = { workspace = true, features = ["test-support"] }
alloy.workspace = true
axum.workspace = true
decdn-incentive.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
