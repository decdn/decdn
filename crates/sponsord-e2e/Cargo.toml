[package]
name = "sponsord-e2e"
description = "Tests that run the sponsord daemon, onramp and CLI together"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Never released: it carries the workspace version only because every member
# does, and has no changelog for the release to update.
[package.metadata.release]
release = false

[dev-dependencies]
decdn-sponsored.workspace = true
sponsord.workspace = true
sponsord-api = { workspace = true, features = ["client"] }
sponsord-core = { workspace = true, features = ["test-support"] }
sponsord-onramp = { workspace = true, features = ["test-support"] }
alloy.workspace = true
axum = "0.8"
decdn-incentive.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
# `tests/no_inline_test_modules.rs` parses every source file under `crates/`
# and matches them against the CodeQL `paths-ignore` globs.
globset = "0.4"
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
walkdir = "2"
