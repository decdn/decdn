[package]
name = "decdn-bao-range"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bao verified-range helpers for deCDN: chunk-group alignment, verified range encoding, and wire-size accounting, with no iroh-blobs dependency"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
bao-tree = { workspace = true }
bytes = { workspace = true }
positioned-io = { workspace = true }
thiserror = { workspace = true }
# The pull-side store contract (`ingest`): its futures return `anyhow`
# results, its reader is an `iroh_io::AsyncStreamReader`, and a streaming
# store wakes its reader through a `tokio::sync::Notify`. None of the three is
# the blob store.
anyhow = { workspace = true }
iroh-io = { workspace = true }
tokio = { workspace = true }

[features]
# Exposes the shared `RangedStore` conformance suite (`conformance::run_all`)
# for downstream test suites. Gated behind a feature rather than `#[cfg(test)]`
# because a cross-crate `cfg(test)` does not reach a dependency's test builds;
# enabled by downstream crates via `dev-dependencies`.
test-util = []

[lints]
workspace = true
