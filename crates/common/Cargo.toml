tracing = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
jsonrpsee = { workspace = true }
# Free-space probing (`disk.rs`): `statvfs` on Unix, `GetDiskFreeSpaceExW` on
# Windows, behind one safe API (the workspace forbids `unsafe`).
fs4 = "1.1"

[dev-dependencies]
tempfile = { workspace = true }
# `secret::SecretString` Serialize tests assert no-leak via JSON. The
# production-side runtime::reload uses serde_json on the node crate
# already; here we only need it for tests.
serde_json = { workspace = true }

[lints]
workspace = true
