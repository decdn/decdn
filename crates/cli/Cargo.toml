[package]
name = "decdn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "User-facing deCDN CLI (decdn binary): probe, fetch, pools, publishing, origin import, node admin"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "decdn"
path = "src/main.rs"

[dependencies]
decdn-protocol = { workspace = true }
decdn-common = { workspace = true }
# `config init --origin <URL>` validates and normalizes the origin base URL
# through the same `parse_origin_url` the daemon's resolver uses, so the
# generated `[cache.origin]` and the runtime agree by construction. A leaf
# crate already in this binary's tree via `decdn-common` — no new bloat and
# the iroh-blobs/AWS-free invariant (#578) holds. `url` (already in the tree
# via config-types) classifies the flag's spelling — http(s)/file/s3 — before
# the per-kind guard runs.
decdn-config-types = { workspace = true }
url = { workspace = true }
# `key-gen` (this crate) and the runtime loader in `decdn-node` both load
# the eth keystore via `decdn_incentive::eth_identity` (#406). Lives in
# `incentive` per `appendix-poc-production-seams.md` §Seam 1 — clients
# (voucher signers per ADR 003) and nodes share the keystore surface. The
# `redb` feature backs `decdn fetch`'s persistent buyer-channel store (#940),
# so a channel opens once and is reused (watermark resumed) across invocations.
decdn-incentive = { workspace = true, features = ["redb"] }
# `decdn fetch` (issue #391): the standalone client-side paid pull reuses the
# shared `cdn/client/v1` requester. `client-pull` depends only on `blake3` for
# content verification (NOT iroh-blobs), so the CLI's iroh-blobs-free invariant
# (#578) holds — verify with `cargo tree -p decdn-cli -e normal -i iroh-blobs`.
decdn-client-pull = { workspace = true }
# `decdn origin import` (#1904) seeds a filesystem cache origin: it writes each
# blob's sharded data object plus its `{hex}.obao4` pre-order bao outboard, which
# must match the daemon's own encoding at `IROH_BLOCK_SIZE`. The `bao-range` leaf
# crate owns that outboard encoder and the `.obao4` layout contract shared with
# the cache reader; it depends only on `bao-tree`, so the iroh-blobs-free
# invariant (#578) holds — already in this binary's tree via `client-pull`.
decdn-bao-range = { workspace = true }
iroh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
jsonrpsee = { workspace = true }
rand = { workspace = true }
# `decdn origin import --dry-run` (issue #391): directory walk + glob
# exclude + streaming BLAKE3. `blake3` is used directly for the bundle
# digest.
# Post-#578 the *entire* CLI is free of iroh-blobs / the AWS SDK: the
# config-vocabulary types `decdn-common` needs were extracted into the
# `decdn-config-types` leaf crate, so `cli → common → config-types` no
# longer drags in `decdn-cache` (see `appendix-binaries.md` §
# binary-size). Verify with
# `cargo tree -p decdn-cli -e normal -i iroh-blobs` (must be empty).
# `tempfile` is also a runtime dep here because writing a bundle manifest
# to disk (`origin import --bundle`) is atomic via `NamedTempFile::persist`
# — a unique
# O_CREAT|O_EXCL temp avoids the symlink-clobber risk of a predictable
# `<output>.partial` filename on a shared workspace.
walkdir = { workspace = true }
globset = { workspace = true }
blake3 = { workspace = true }
tempfile = { workspace = true }
# `decdn origin import --optimize` (content-defined chunking): splits a
# publisher file into `fastcdc::v2020` chunks so cross-file dedup can work at
# chunk granularity instead of whole-file.
fastcdc = { workspace = true }
# `decdn fetch` (#1118) renders a delivery progress bar to stderr. TTY-aware, so
# a piped/redirected fetch stays silent. Small dep tree (console, unicode-width),
# unrelated to the iroh-blobs/AWS-free invariant above.
indicatif = { workspace = true }
# Opt-in client-side logging (`--log-level` / `RUST_LOG`): the CLI installs no
# subscriber by default, so verbose fetch/incentive/iroh spans are diagnosable
# on demand without disturbing the terminal UI. The `fetch`/`bundle pull`
# commands emit their own status and warning spans through these macros, so the
# routing narration is silent by default and visible at the requested level.
# Already in this binary's tree via `decdn-node`'s daemon path; env-filter + fmt
# only.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `node top` (issue #275) scrapes the daemon's loopback /metrics HTTP
# endpoint. Workspace-pinned with rustls + no default features — same
# settings `decdn-node` uses, so the dep tree stays unified.
reqwest = { workspace = true }
# `node register` (ADR 019 § Step 2.3) submits `CapacityBond.registerNode`
# on-chain: it needs alloy's provider/contract/signer surface. `decdn fetch`
# (#391) also uses it to parse on-chain identifiers and build the EIP-712
# voucher/slash domains. alloy is already in this binary's tree via
# `decdn-incentive` (a normal dep), so this exposes the existing crate to CLI
# source without new bloat.
alloy = { workspace = true }
# `decdn fetch` auto-discovery (#936) probes its `SELECT_K` sample concurrently
# via `join_all`, which borrows one shared `&endpoint` instead of cloning it
# per probe. Combinators only — no iroh-blobs, so the #578 invariant holds.
futures-util = { workspace = true }
# `decdn whoami` holds the resolved keystore password in a `Zeroizing<String>`
# (the type `eth_identity::read_password` returns) so it is scrubbed on drop.
zeroize = { workspace = true }
[dev-dependencies]
decdn-incentive = { workspace = true, features = ["redb", "test-util"] }
# Integration tests in `tests/admin_rpc.rs` exercise the loopback admin
# RPC end-to-end against a real `AdminState` spawned from the daemon
# crate, so the daemon's surface is a dev-dependency here. `decdn-cache`
# is needed to construct the `CacheEngine` the admin server runs against.
# None of this leaks into the `decdn` binary's release dep tree.
decdn-node = { workspace = true }
decdn-cache = { workspace = true }
# `tests/key_gen_prompt_pty.rs` drives the real `decdn` binary through the
# interactive keystore-password prompt, which `rpassword` reads from
# `/dev/tty`. `rexpect` forks the child onto a pty and makes that pty its
# controlling terminal — see the workspace-manifest note for why we do not do
# the fork ourselves.
rexpect = { workspace = true }

[lints]
workspace = true
