[package]
name = "decdn-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "User-facing deCDN CLI (decdn binary): probe, node admin, key-gen, config"

[[bin]]
name = "decdn"
path = "src/main.rs"

[dependencies]
decdn-protocol = { workspace = true }
decdn-common = { workspace = true }
# `key-gen` (this crate) and the runtime loader in `decdn-node` both load
# the eth keystore via `decdn_incentive::eth_identity` (#406). Lives in
# `incentive` per `appendix-poc-production-seams.md` §Seam 1 — clients
# (voucher signers per ADR 003) and nodes share the keystore surface.
decdn-incentive = { workspace = true }
iroh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
jsonrpsee = { workspace = true }
rand = { workspace = true }
# `decdn bundle create` (issue #391): directory walk + glob exclude +
# streaming BLAKE3. `blake3` is used directly for the bundle digest.
# Post-#578 the *entire* CLI is free of iroh-blobs / the AWS SDK: the
# config-vocabulary types `decdn-common` needs were extracted into the
# `decdn-config-types` leaf crate, so `cli → common → config-types` no
# longer drags in `decdn-cache` (see `appendix-binaries.md` §
# binary-size). Verify with
# `cargo tree -p decdn-cli -e normal -i iroh-blobs` (must be empty).
# `tempfile` is also a runtime dep here because `bundle create` writes
# the manifest atomically via `NamedTempFile::persist` — a unique
# O_CREAT|O_EXCL temp avoids the symlink-clobber risk of a predictable
# `<output>.partial` filename on a shared workspace.
walkdir = { workspace = true }
globset = { workspace = true }
blake3 = { workspace = true }
tempfile = { workspace = true }
# `node top` (issue #275) scrapes the daemon's loopback /metrics HTTP
# endpoint. Workspace-pinned with rustls + no default features — same
# settings `decdn-node` uses, so the dep tree stays unified.
reqwest = { workspace = true }
# `node register` (ADR 019 § Step 2.3) submits `CapacityBond.registerNode`
# on-chain: it needs alloy's provider/contract/signer surface. alloy is
# already in this binary's tree via `decdn-incentive` (a normal dep), so
# this exposes the existing crate to CLI source without new bloat.
alloy = { workspace = true }

[dev-dependencies]
# Integration tests in `tests/admin_peers.rs` exercise the loopback admin
# RPC end-to-end against a real `AdminState` spawned from the daemon
# crate, so the daemon's surface is a dev-dependency here. `decdn-cache`
# and `decdn-gossip` are needed to construct the seeded `PeerTable` and
# `CacheEngine` the admin server runs against. None of this leaks into
# the `decdn` binary's release dep tree.
decdn-node = { workspace = true }
decdn-cache = { workspace = true }
decdn-gossip = { workspace = true }

[lints]
workspace = true
