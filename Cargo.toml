[workspace]
resolver = "2"
members = [
    "crates/node",
    "crates/protocol",
    "crates/cache",
    "crates/incentive",
    "crates/reputation",
    "crates/gossip",
]
exclude = ["contracts"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
decdn-protocol = { path = "crates/protocol" }
decdn-cache = { path = "crates/cache" }
decdn-incentive = { path = "crates/incentive" }
decdn-reputation = { path = "crates/reputation" }
decdn-gossip = { path = "crates/gossip" }

# Networking (iroh ecosystem, pinned per ADR 000)
iroh = "0.97"
iroh-blobs = { version = "0.99", features = ["fs-store"] }
iroh-gossip = { version = "0.97", features = ["net"] }
iroh-metrics = "0.38"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["serde"] }
chacha20poly1305 = "0.10"

# Blockchain / EVM
alloy = { version = "2", features = ["providers", "signers", "contract"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32"

# Error handling
anyhow = "1"
thiserror = "2"

# Config
toml = "1"
dirs = "6"

# Misc
bytes = "1"
rand = "0.10"
url = "2"

# HTTP client (used by cache-origin backend)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Test-only helpers
tempfile = "3"
wiremock = "0.6"
proptest = "1"

# Metrics server
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Admin JSON-RPC surface (ADR 025)
jsonrpsee = { version = "0.26", features = ["server", "http-client", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Anti-panic: no panicking in a CDN node
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Numeric safety (payment amounts, byte offsets)
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"

# Code quality
cognitive_complexity = "warn"
needless_pass_by_value = "warn"
missing_const_for_fn = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"

# Pedantic relaxations
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
