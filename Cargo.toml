[workspace]
# Resolver 3 — the MSRV-aware resolver. Its feature-unification rules are
# identical to resolver 2's; the only difference is that
# `resolver.incompatible-rust-versions` defaults to `fallback` instead of
# `allow`, so cargo prefers dependency versions whose declared `rust-version`
# is <= ours. Paired with `rust-version = "1.95.0"` below, that stops a future
# `cargo update` from silently pulling a dependency that raised its MSRV past
# the pinned toolchain. Nothing is excluded at 1.95.0 today.
resolver = "3"
members = [
    "crates/node",
    "crates/protocol",
    "crates/config-types",
    "crates/bao-range",
    "crates/cache",
    "crates/incentive",
    "crates/reputation",
    "crates/common",
    "crates/client-pull",
    "crates/cli",
    "crates/e2e",
]
exclude = ["contracts"]

[workspace.package]
# Every crate inherits this, and it is the one version the workspace has:
# `decdn --version` reports it, `cargo release` (shared-version) bumps it here
# and rewrites the matching `version` on the internal `[workspace.dependencies]`
# entries below in the same commit, and the tag it pushes is `v` + this.
#
# `0.0.0` means no release has been cut. It is never tagged: the first
# `cargo release minor --execute` makes it `0.1.0`, and the line moves only
# under cargo-release from then on. check_workspace_manifests.py refuses a
# member that restates the version and an internal alias below that disagrees
# with it, so a hand edit anywhere else fails before it ships.
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Three parts, not two: this string, `rust-toolchain.toml`'s channel and every
# `dtolnay/rust-toolchain@…` ref in the workflows are compared byte-for-byte by
# check_toolchain_pin.py, so they move together or the `packaging` job says
# which one did not.
rust-version = "1.95.0"
repository = "https://github.com/decdn/decdn"
homepage = "https://decdn.org"
keywords = ["cdn", "p2p", "content-delivery", "iroh", "blake3"]
categories = ["network-programming", "web-programming"]
# `readme` and `description` are deliberately NOT here — not because
# inheritance would break packaging (cargo copies a workspace-root readme into
# the .crate quite happily) but because these are public crates.io landing
# pages and each one needs to describe its own crate. Inheriting would put the
# same text on all eleven. check_workspace_manifests.py requires both per
# publishable crate.

[workspace.dependencies]
# Internal crates. The `version` is what makes these publishable — cargo rejects
# a path dependency with no version specifier, because a published crate has no
# path to follow. Locally the `path` still wins; the version only applies to the
# manifest cargo uploads.
decdn-protocol = { path = "crates/protocol", version = "0.0.0" }
decdn-config-types = { path = "crates/config-types", version = "0.0.0" }
decdn-bao-range = { path = "crates/bao-range", version = "0.0.0" }
decdn-cache = { path = "crates/cache", version = "0.0.0" }
decdn-incentive = { path = "crates/incentive", version = "0.0.0" }
decdn-reputation = { path = "crates/reputation", version = "0.0.0" }
decdn-common = { path = "crates/common", version = "0.0.0" }
decdn-client-pull = { path = "crates/client-pull", version = "0.0.0" }
decdn-node = { path = "crates/node", version = "0.0.0" }
# No `decdn-cli` entry: it is a bin crate and a workspace *member*, but nothing
# in the workspace depends on it, so it needs no `[workspace.dependencies]`
# alias. Add one back only alongside a real dependant.

# Networking (iroh ecosystem, pinned per ADR 000). The committed Cargo.lock
# is the true pin; these caret constraints just bound the major. Upgrades are
# deliberate — bump Cargo.lock and record the new baseline in ADR 000.
iroh = "1"
iroh-blobs = { version = "0.103", features = ["fs-store"] }
iroh-metrics = "1"
# `noq-proto` is iroh 1.x's QUIC protocol crate (its quinn-proto fork). The node
# depends on it directly for one reason: to name `congestion::Bbr3Config` and
# select BBR3 over the default Cubic on its QUIC endpoint. iroh re-exports the
# `ControllerFactory` trait but not the concrete controller configs, so the type
# has to come from here. It MUST resolve to the same version iroh pulls (one lock
# entry, one crate instance), or the `ControllerFactory` trait object built here
# will not match the one iroh's builder expects. Pinned via Cargo.lock with the
# rest of the iroh ecosystem (ADR 000); `default-features = false` mirrors iroh's
# own dependency on it.
noq-proto = { version = "1", default-features = false }
# bao verified-range codec (#823). Pinned to the version `iroh-blobs` 0.103
# carries transitively (0.16) so the on-disk outboard / interleaved-stream
# encoding the cache produces is byte-identical to what `import_bao_bytes`
# consumes — ADR 038 treats this codec as part of the protocol contract, so the
# pin is deliberate. `positioned-io` is bao-tree's `ReadAt` data-source trait.
bao-tree = "0.16"
positioned-io = "0.3"
# `AsyncStreamReader` — the reader trait `bao-tree`'s INCREMENTAL decoder
# (`io::fsm::ResponseDecoder`, behind its `tokio_fsm` feature) drives. Needed
# by name to implement the trait over a live paid pull, and bao-tree re-exports
# only `AsyncSliceReader`/`AsyncSliceWriter`, not this one. Pinned to what
# bao-tree 0.16 carries. Unrelated to `iroh-blobs` — depending on it does not
# regress the CLI's iroh-blobs-free invariant (#578).
iroh-io = { version = "0.6", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Sharded concurrent map: the client handler's lane registry (#1731) so
# independent lanes look up on different shards instead of one global mutex.
dashmap = "6"
crossbeam-queue = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
base64 = "0.23"

# Cryptography
ed25519-dalek = { version = "2", features = ["serde"] }
chacha20poly1305 = "0.11"

# Blockchain / EVM
alloy = { version = "2", features = ["providers", "signers", "signer-keystore", "contract"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
# `decdn fetch` delivery progress bar (#1118). TTY-aware by default (drawn to
# stderr, hidden when piped/CI), so it never pollutes scripted output.
indicatif = "0.18"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "internal-logs"] }
tracing-opentelemetry = "0.33"

# Error handling
anyhow = "1"
thiserror = "2"

# Config
toml = "1"
dirs = "7"

# Misc
bytes = "1"
indexmap = "2"
rand = "0.10"
rpassword = "7"
url = "2"
zeroize = "1"

# Streaming primitives for the cache origin pull-through (issue #271). `futures-util`
# gives us `Stream` / `stream::unfold` / `StreamExt` without the kitchen-sink
# `futures` umbrella crate (already transitively in the tree via reqwest);
# `tokio-util` provides `ReaderStream` / `StreamReader` for the
# AsyncRead↔Stream<Bytes> bridges used by FilesystemOrigin and the
# decompression pipeline. `async-compression` decompresses gzip/zstd in
# the stream pipeline (replacing the synchronous `flate2` / `zstd`
# round trip from PR-1's HttpOrigin).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }

# Bundle + origin-import manifest tooling (issue #391):
# walkdir for stable directory traversal, globset for `--exclude` patterns,
# blake3 direct so the publisher CLI doesn't have to pull iroh-blobs.
walkdir = "2"
globset = "0.4"
blake3 = "1"

# Content-defined chunking (`decdn origin import --optimize`): fastcdc's
# v2020 module implements the rolling-hash chunk-boundary algorithm and
# publishes its own min/avg/max structural bounds as constants, which
# `ChunkSizes::resolve` validates against directly.
fastcdc = "5"

# HTTP client (used by cache-origin backend)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }

# AWS SDK (used by the S3 cache-origin backend, #437 PR2). All four crates carry
# `default-features = false` so the workspace stays on one TLS implementation
# (rustls 0.23 + aws-lc-rs); the SDK's stock rustls 0.21 + ring path is
# fully suppressed by these flags. Cargo.lock confirms only one `rustls` and
# one `aws-lc-rs` major after the addition.
#
# The production binary `decdn-node` ships hyper-1 only — `cargo tree
# -p decdn-node --no-dev-dependencies` shows one `hyper` (1.x), one `h2`
# (0.4), one `socket2` (0.6). Two `http`/`http-body` versions still appear
# in production because `aws-smithy-types` carries an `http 0.2` shim type
# alongside its `http 1.x` API; that shim is dead at runtime but cargo
# can't unify the feature graph across the smithy types crate. No
# parallel TLS stack and no extra crypto provider in either case.
#
# In the **test/dev build** (`crates/cache` dev-deps include `aws-smithy-mocks`
# and `aws-sdk-s3 = { features = ["test-util"] }`), a hyper-0.14 +
# h2 0.3 + socket2 0.5 subtree does land — `test-util` enables
# `aws-smithy-runtime/legacy-test-util` which enables
# `aws-smithy-http-client/hyper-014`. Cargo unifies features across deps
# and dev-deps, so the dev-only feature still leaves the lockfile entries
# even in production builds; they just aren't linked. The fix path is
# upstream (a leaner mocks crate that doesn't require legacy hyper) or a
# future smithy-rs release that splits the test-util layer. Re-evaluate
# both.
#
# `aws-config` keeps the standard credential-chain pieces (env / profile /
# IMDS / SSO / credentials_process) so operators get the AWS-CLI-equivalent
# discovery for free; the `behavior-version-latest` feature is paired with
# an explicit `BehaviorVersion::latest()` at the call site so a future
# feature-flag edit dropping the implicit path cannot regress (older SDK
# versions panicked here; current versions surface a runtime error).
# Note: the `sso` feature enables an HTTP-using credential provider; if an
# operator's `~/.aws/config` profile is configured for SSO with an
# expired cached token, the *first* fetch through the cache may trigger
# an HTTP refresh against the SSO endpoint. Construction itself stays
# I/O-free (verified by `S3Origin::new`'s no-I/O construction tests).
aws-config = { version = "1.8", default-features = false, features = [
    "behavior-version-latest",
    "credentials-process",
    "sso",
    "rt-tokio",
] }
# Unpinned (#918): previously exact-pinned at `=1.129.0` (last release on
# sha2 ^0.10) because iroh-base 0.98 carried a `sha2 = "=0.11.0-rc.5"` pin —
# letting aws-sdk-s3 1.130 pull stable sha2 0.11 would have made a *third*
# sha2 entry. iroh 1.0 now uses stable sha2 0.11.0, so aws-sdk-s3 1.130
# unifies with iroh-base on sha2 0.11 (sha2 stays at two versions: 0.11.0
# here + iroh, 0.10.9 via alloy). Cost of lifting: aws 1.130 moves its whole
# RustCrypto stack to the 0.11 generation, adding `sha1` (0.11) and `hmac`
# (0.13) alongside the 0.10-gen copies alloy still pulls — two extra cargo
# deny `multiple-versions` warnings, accepted to drop the exact pin so S3 SDK
# patches (incl. security fixes) flow.
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "1.1", default-features = false, features = [
    "default-client",
    "rustls-aws-lc",
] }
aws-credential-types = "1"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"

# Test-only helpers
tempfile = "3"
wiremock = "0.6"
proptest = "1"
# `decdn key-gen`'s double-entry password prompt is only reachable through a
# controlling terminal: `rpassword` reads `/dev/tty`, not stdin, so redirecting
# a child's stdin cannot drive it. Handing a spawned process a pty as its
# controlling terminal takes a raw `fork` in the parent, and `fork` is `unsafe`
# — `unsafe_code = "forbid"` rules it out here, so it lives in this dependency
# instead, which forks, `setsid`s, and opens the slave to acquire the terminal.
# rexpect's default feature set is empty, so the optional `which` PATH lookup
# stays off: the tests spawn `CARGO_BIN_EXE_decdn`, already an absolute path.
rexpect = "0.7"
# `decdn-node`'s chain-watcher tests need a provider whose RPCs never resolve, to
# prove each sink-internal read is bounded by `chain_events::timed`. alloy's own
# `Asserter` cannot express that (it pops a queued response or errors — never
# pends), so the tests build a `tower::Service` transport returning `pending()`.
# alloy already depends on tower 0.5; this pins the same major so the `Service`
# impl satisfies alloy's `Transport` blanket bound.
tower = "0.5"
# The packet types that transport's `Service` impl is generic over. Taken as a
# dev-dep rather than by enabling alloy's `json-rpc` feature: the feature is
# workspace-wide (it would widen `decdn-cli`'s surface too, cf. #578), whereas
# this is test-only. alloy already pulls alloy-json-rpc via alloy-network, so
# cargo unifies this onto that same instance and no extra crate is compiled —
# which is also what keeps the `Service` impl's types identical to alloy's.
alloy-json-rpc = "2"
# Public-API stability snapshot (issue #304, `decdn-protocol` only). `public-api`
# renders the crate's exported surface from rustdoc JSON, which `rustdoc-json`
# generates with the workspace's pinned *stable* toolchain (no nightly — the
# test sets `RUSTC_BOOTSTRAP=1` to unlock the rustdoc-JSON flag; see
# crates/protocol/tests/public_api.rs); `insta` snapshots the rendered surface.
# Used only by the feature-gated `public_api` test target, which stays out of
# the default workspace run. The `public-api` minor (0.52 → rustdoc-types 0.57)
# must match the rustdoc-JSON `format_version` our stable toolchain emits.
public-api = "0.52"
rustdoc-json = "0.9"
insta = "1"
# Operation-level S3 mocks for the S3 origin tests (#437 PR2). The `mock!`
# / `mock_client!` macros take the SDK through its full middleware chain
# (signing, retry, body framing) but stub the network — exactly the
# granularity we need to validate `OriginPullError` classification without
# standing up MinIO.
aws-smithy-mocks = "0.3"

# Rate limiting (per-source connection rate limits in `node`)
governor = "0.10"

# Atomic Arc swap (used by `node` to swap the dispatch semaphore on reload)
arc-swap = "1.7"

# Metrics server
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Raw socket options for the loopback control-plane listeners (admin RPC +
# metrics): `SO_REUSEADDR` so the daemon rebinds its fixed ports immediately
# after a restart instead of failing on a `TIME_WAIT` remnant. Already in the
# `decdn-node` tree via `hyper-util`, so this pins no new crate.
socket2 = "0.6"

# Admin JSON-RPC surface (appendix-local-admin-http.md)
jsonrpsee = { version = "0.26", features = ["server", "http-client", "macros"] }

# Embedded persistent KV (used by `node` to fence voucher replay across
# restarts — issue #527 / ADR 003 §Off-chain voucher state persistence).
# Pure-Rust, ACID, single-file, fsync on commit via `Durability::Immediate`.
# 4.2 floor: `channel_store::flush` commits its batch in ascending key order, and
# the append fast path that makes that pay off arrives in 4.2. Below it the same
# sort is a pessimization — measured at 1.31x MORE leaf pages on 4.1 — so the
# floor is what keeps the sort a win rather than a regression.
redb = "4.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# Write `Foo<'_>`, not `Foo`, when the type has a lifetime: at a call site the
# elided form hides that the value borrows, which is exactly what a reader
# needs to see around the redb transaction and cache-eviction context types.
elided_lifetimes_in_paths = "warn"
# A `pub` item inside a private module is not part of any crate's API; say what
# it really is. Mostly this keeps the shared integration-test helper modules
# honest, where `pub` is reflex rather than intent.
unreachable_pub = "warn"
# Every public item carries a doc comment. The `alloy::sol!` bindings are the
# one exception and already opt out at their `mod sol_types` wrappers.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Anti-panic: no panicking in a CDN node
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Numeric safety (payment amounts, byte offsets). `deny`, not `warn`: CI clippy
# and the pre-commit hook both pass `-D warnings`, so these were already fatal
# there — `deny` makes a bare local `cargo clippy` agree, and stops a call site
# relaxing one back to `warn`. Widening casts stay legal; `as_conversions` is
# deliberately NOT enabled — it fires on every `as` cast, safe ones included:
# it counts casts, it does not judge them.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"

# No stray output or scaffolding. `dbg_macro` / `todo` / `unimplemented` have
# zero occurrences and stay that way. The print lints keep stdio out of every
# library crate and the daemon: the `decdn` CLI is a terminal UI and allows
# both at its crate root, and the handful of production `eprintln!` sites that
# run before `tracing` is initialized carry a per-site `#[expect]`.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Code quality
cognitive_complexity = "warn"
needless_pass_by_value = "warn"
missing_const_for_fn = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"

# Pedantic relaxations
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

# Keystore KDF at release speed in dev builds. `alloy`'s `signer-keystore`
# runs scrypt on every keystore encrypt and decrypt, and unoptimized scrypt
# costs ~0.5s per operation: measured on the `decdn-cli` suite, 3.79s -> 3.20s
# (-16%), with the `key_gen_e2e` tests themselves 16-22% faster. The
# `anvil-e2e` journeys pay it once per keygen. None of these crates is ever
# stepped through in a debugger, so the lost debuginfo costs nothing.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.release]
opt-level = 3
# Fat LTO + a single codegen unit. `codegen-units` defaulted to 16 here, which
# was the binding constraint — not the LTO mode. Measured on a 16-core clean
# build of both binaries: cgu=1 alone costs +5s (356s → 361s) and takes ~16% off
# both; fat LTO on top costs +118s total and takes `decdn-node` 47.4 → 35.6 MB
# and `decdn` 32.3 → 21.1 MB. CI never builds `--release` (see
# `.github/workflows/ci.yml`), so the extra time lands only on the release
# workflow's 10-way parallel matrix and the Docker image build.
lto = "fat"
codegen-units = 1
# NOT `panic = "abort"`: production code recovers from panics via unwinding —
# `chain_events::resumable_watcher` wraps hook dispatch in `catch_unwind` so a
# panicking hook cannot kill the daemon, `dht::chain_projection` does the same
# for lock poisoning, and the runtime / admin / buyer-channel layers branch on
# `JoinError::is_panic`. `abort` turns every one of those into a dead process.
#
# `strip = "debuginfo"`, not `"symbols"`: the symbol table stays in the shipped
# binary, so a `RUST_BACKTRACE` panic from an operator's node symbolizes to
# function names (`decdn_node::receipt_log::…::record`) instead of bare
# addresses. Measured cost on `decdn-node`: 35.6 MB → 41.3 MB, still well under
# the 47.4 MB we shipped before this profile change.
#
# `file:line` is deliberately NOT bought here — it needs `strip = "none"`, which
# takes `decdn-node` to 91.8 MB, and it cannot be moved to a sidecar: under
# split DWARF the line-number program stays in the executable's `.debug_line`,
# so a stripped binary plus its `.dwp` resolves nothing (verified: addr2line
# returns `:?` with the `.dwp` present). `debug` / `split-debuginfo` are
# therefore left off — a `.dwp` that cannot symbolize the shipped binary is
# 85 MB of build time for nothing. The route to `file:line` is an
# `objcopy --only-keep-debug` sidecar built in the release workflow.
strip = "debuginfo"
