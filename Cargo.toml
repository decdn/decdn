[workspace]
resolver = "2"
members = [
    "crates/node",
    "crates/protocol",
    "crates/cache",
    "crates/incentive",
    "crates/reputation",
]
exclude = ["contracts"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
decdn-protocol = { path = "crates/protocol" }
decdn-cache = { path = "crates/cache" }
decdn-incentive = { path = "crates/incentive" }
decdn-reputation = { path = "crates/reputation" }

# Networking (iroh ecosystem, pinned per ADR 000)
iroh = "0.97"
iroh-blobs = { version = "0.99", features = ["fs-store"] }
iroh-gossip = { version = "0.97", features = ["net"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["serde"] }
chacha20poly1305 = "0.10"

# Blockchain / EVM
alloy = { version = "1", features = ["providers", "signers", "contract"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
bytes = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
