# The label set for decdn/decdn. `.github/scripts/sync-labels.sh` reconciles
# the live repository to this file (dry run by default, `--apply` to change).
#
# Families, one color each:
#   kind:    what the issue is        (bug, feature, docs, security, chore, test, question)
#   area:    where it lives           (one per crate group; mirrors the issue-form component list)
#   prio:    when it gets done
#   status:  why it is not moving     (blocked, backlog, mainnet-blocking)
#   design:  the ADR process          (adr, missing-decision, consistency, economics)
#
# Flat names stay flat on purpose: `good first issue` and `help wanted` are
# GitHub discovery features keyed on the exact name; `duplicate`, `invalid`
# and `wontfix` are closure reasons; `dependencies`, `rust`, `github_actions`
# and `docker` are created by Dependabot, which would recreate them under
# the old name after a rename, so they are not area labels.
#
# `previously` names a live label this one replaces. The sync script renames
# it in place, which keeps the label on every issue and PR that carries it.
# A `[[retired]]` label is deleted when the script runs with `--apply`; any
# other live label that this file does not name is reported and left alone.

# ---- kind ------------------------------------------------------------------

[[label]]
name = "kind:bug"
color = "d73a4a"
description = "Something does not behave as documented"
previously = ["bug"]

[[label]]
name = "kind:feature"
color = "a2eeef"
description = "New capability or a change to current behavior"
previously = ["enhancement"]

[[label]]
name = "kind:docs"
color = "0075ca"
description = "README, docs/, runbook, rustdoc or ADR prose only"
previously = ["documentation"]

[[label]]
name = "kind:security"
color = "e11d48"
description = "Security impact; report a vulnerability to security@decdn.org, not here"
previously = ["security"]

[[label]]
name = "kind:chore"
color = "fef2c0"
description = "Cleanup, dependencies, tooling or release work; no user-visible change"
previously = ["cleanup"]

[[label]]
name = "kind:test"
color = "fef2c0"
description = "Test coverage, flakes, fixtures or the e2e harness"
previously = ["testing"]

[[label]]
name = "kind:question"
color = "d876e3"
description = "Needs an answer, not a change; Discussions is the better home"
previously = ["question"]

