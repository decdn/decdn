name: SDK contract

# The TypeScript and Python SDK contract suites against real gateways, on pull
# requests only. Each job runs its SDK's code (decdn/sdk-typescript at the
# commit `.github/sdk-typescript.sha` pins, decdn/sdk-python at the commit
# `.github/sdk-python.sha` pins), so it never runs in the default branch's
# context: a pull request's caches cannot reach the ones `main` restores. The
# pin moves only in a pull request, so a push or schedule run would test
# nothing new. Its own workflow, not a `ci.yml` job, because `ci.yml` also
# runs on push and dispatch; so it is not part of `CI success`, and it blocks
# a merge only as a required check in the branch ruleset.
on:
  pull_request:
    branches: [main]
    # What the run depends on: the gateway and fixtures (Rust), the contracts
    # the fixtures deploy, the pins, and this file.
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'contracts/**'
      - '.gitmodules'
      - '.config/nextest.toml'
      - '.github/sdk-typescript.sha'
      - '.github/sdk-python.sha'
      - '.github/workflows/sdk-contract.yml'

permissions:
  contents: read

concurrency:
  group: sdk-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The TypeScript SDK's contract suite against a real `decdn gateway`, public
  # and loopback (`crates/e2e/tests/gateway_sdk.rs`), so a drift between the
  # SDK's fake gateway and the binary fails here. The SDK is
  # decdn/sdk-typescript at the commit `.github/sdk-typescript.sha` pins: new
  # SDK code runs here only once a decdn PR moves the pin, and an SDK commit
  # never turns decdn's `main` red on its own. The Python SDK runs in its own
  # job below, at its own pin. A gateway change the SDK can observe lands its
  # sdk-typescript PR first, then moves the pin in the same decdn PR. The test
  # fails, never skips, without `node`, the checkout or `node_modules`, on a
  # skipped or todo test, and when the suite did not reach this gateway.
  #
  # ~10m observed; 30m clears a cold build plus two runs at the 600s heavy
  # tier, `--test-threads 2`.
  anvil-e2e-sdk:
    name: anvil e2e (sdk contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold -C debuginfo=line-tables-only -C split-debuginfo=unpacked"
    steps:
      # submodules: recursive — the in-test `forge build` needs the forge-std +
      # openzeppelin-contracts submodules under contracts/lib/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      # foundry-toolchain directly, not ./.github/actions/foundry-setup: that
      # action saves the shared solc cache, and the SDK's code runs here.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
          cache: false
      # The journeys' cache (same RUSTFLAGS and targets), restored and never
      # saved: the SDK's code runs in this job, so it writes no cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: anvil-e2e-journeys
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          fallback: none
          tool: cargo-nextest@0.9.149
      - name: Read the pinned TypeScript SDK commit
        id: sdk
        run: echo "sha=$(tr -d '[:space:]' < .github/sdk-typescript.sha)" >> "$GITHUB_OUTPUT"
      - name: Check out the TypeScript SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: decdn/sdk-typescript
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk-typescript
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk-typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the SDK's dependencies
        # No install scripts: the contract run needs none.
        run: pnpm -C sdk-typescript install --frozen-lockfile --ignore-scripts
      - name: Build contracts once (hoisted from the fixtures)
        working-directory: contracts
        run: forge build
      - name: Build daemon + CLI for the fixtures
        run: cargo build -p decdn-node -p decdn-cli
      - name: Run the SDK contract suite against real gateways
        env:
          DECDN_SDK_DIR: ${{ github.workspace }}/sdk-typescript
        run: >
          cargo nextest run -p decdn-e2e --features anvil-e2e,sdk-e2e
          --test gateway_sdk --test-threads 2 --no-tests=fail

  # The Python SDK's contract suite against a real `decdn gateway`, public and
  # loopback (`crates/e2e/tests/gateway_sdk_python.rs`). The SDK is
  # decdn/sdk-python at the commit `.github/sdk-python.sha` pins, with the same
  # pin rules as the TypeScript job. The test fails, never skips, without `uv`,
  # the checkout or its `.venv`, on a skipped or todo test, and when the suite
  # did not reach this gateway.
  #
  # Same budget as the TypeScript job (30m for a cold build), copied from it;
  # replace with the observed time after the first run.
  anvil-e2e-sdk-python:
    name: anvil e2e (sdk contract, python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold -C debuginfo=line-tables-only -C split-debuginfo=unpacked"
    steps:
      # submodules: recursive — the in-test `forge build` needs the forge-std +
      # openzeppelin-contracts submodules under contracts/lib/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      # foundry-toolchain directly, not ./.github/actions/foundry-setup: that
      # action saves the shared solc cache, and the SDK's code runs here.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
          cache: false
      # The journeys' cache (same RUSTFLAGS and targets), restored and never
      # saved: the SDK's code runs in this job, so it writes no cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: anvil-e2e-journeys
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          fallback: none
          tool: cargo-nextest@0.9.149
      - name: Read the pinned Python SDK commit
        id: sdk
        run: echo "sha=$(tr -d '[:space:]' < .github/sdk-python.sha)" >> "$GITHUB_OUTPUT"
      - name: Check out the Python SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: decdn/sdk-python
          ref: ${{ steps.sdk.outputs.sha }}
          path: sdk-python
          persist-credentials: false
      # No setup-python step: `uv sync` installs the interpreter the SDK's
      # `.python-version` names (3.11). No uv cache: the job runs third-party
      # code, so it saves none.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install the SDK's dependencies
        working-directory: sdk-python
        run: uv sync --frozen
      - name: Build contracts once (hoisted from the fixtures)
        working-directory: contracts
        run: forge build
      - name: Build daemon + CLI for the fixtures
        run: cargo build -p decdn-node -p decdn-cli
      - name: Run the SDK contract suite against real gateways
        env:
          DECDN_SDK_PYTHON_DIR: ${{ github.workspace }}/sdk-python
        run: >
          cargo nextest run -p decdn-e2e --features anvil-e2e,sdk-e2e
          --test gateway_sdk_python --test-threads 2 --no-tests=fail
