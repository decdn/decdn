name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --workspace --all-targets

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    # pull-requests: read is needed by dorny/paths-filter to call the
    # listFiles API on PR events; on push it falls back to git diff.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      adr: ${{ steps.filter.outputs.adr }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/coverage-diff.py'
              - '.github/scripts/tests/**'
            adr:
              - 'adr/**/*.md'
              - 'adr/Makefile'
              - '.github/workflows/ci.yml'

  # REQUIRED signal feeding ci-success. Runs the workspace test suite
  # *uninstrumented* — this is the fast blocking path. Coverage (LLVM
  # instrumentation + LCOV diff + sticky PR comment) was split out into the
  # separate, non-blocking `coverage` job below so the required path no
  # longer pays the cargo-llvm-cov instrumentation tax (≈ the bulk of the
  # old merged job's runtime; see PR #484 / split rationale).
  #
  # Behaviour note: the blocking test-failure signal is now the
  # uninstrumented run. A failure that *only* manifests under coverage
  # instrumentation (rare — instrumentation changes timing/codegen, not
  # logic) will surface as a red X on the non-blocking `coverage` job
  # rather than blocking the PR. This is the intended trade-off for the
  # faster required path.
  #
  # Doc/ADR-only PRs skip this job via the `changes` gate; alls-green is
  # configured with `allowed-skips` (see ci-success below) so the skip is
  # accepted as success.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
    # Build-flag env lives at the JOB level (not step level) so the
    # Swatinem/rust-cache step sees it: the action hashes CARGO_*/RUST_*
    # env into its cache key. shared-key MUST differ from the `coverage`
    # job's: both jobs set the same RUSTFLAGS env, but cargo-llvm-cov
    # additionally injects instrumentation, so the produced artifacts
    # differ while the env-derived key would not. Distinct shared-keys
    # ('test' vs 'coverage') keep the two partitions from clobbering each
    # other and silently restoring the wrong-flavoured target (the exact
    # fingerprint trap from PR #484's history).
    env:
      # mold for the final link of the test binaries; line-tables-only +
      # unpacked split-debuginfo keep .o files small and relinking fast.
      # No coverage instrumentation here — that is the whole point of this
      # job.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold -C debuginfo=line-tables-only -C split-debuginfo=unpacked"
      CARGO_INCREMENTAL: "0"
    steps:
      # Default (shallow) checkout: this job does no git-diff coverage
      # work, so fetch-depth: 0 is unnecessary here (kept only in
      # `coverage`, where coverage-diff.py needs full history).
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # REQUIRED step. Non-zero exit on any test failure fails this job
      # and (via ci-success.needs) blocks the PR. No continue-on-error.
      # --no-tests=pass: stub crates (incentive/reputation) currently have
      # no tests; without this nextest would exit non-zero on them.
      - name: Run tests
        run: cargo nextest run --workspace --no-tests=pass

  # NON-BLOCKING coverage job — intentionally excluded from
  # ci-success.needs (same pattern as coverage-tooling-tests). Carries the
  # instrumented run plus all coverage post-processing (LCOV baseline
  # upload/download, diff, sticky PR comment). A failure here paints a
  # red X in the checks list (visible) without blocking PRs; on push to
  # main it paints main CI red (visible) but blocks nothing — preserving
  # the prior "visible degradation beats silent" semantics. Every
  # post-processing step keeps its original continue-on-error so flaky
  # LCOV/diff/comment tooling never even reds this job.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    # Distinct shared-key from `test` (see that job's note). RUSTFLAGS at
    # job level so rust-cache's key reflects the build config; the
    # `coverage` partition's key uniquely covers the instrumented build
    # because cargo-llvm-cov's injected instrumentation differentiates the
    # artifacts even though this env matches `test`'s.
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold -C debuginfo=line-tables-only -C split-debuginfo=unpacked"
      CARGO_INCREMENTAL: "0"
    steps:
      # fetch-depth: 0 is required: coverage-diff.py runs
      # `git diff origin/<base>...HEAD` and needs full history.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Python is needed downstream by `Generate coverage diff` to invoke
      # coverage-diff.py. The helper's own pytest suite lives in the separate
      # non-blocking `coverage-tooling-tests` job so a regression in the
      # helper surfaces as a red X without blocking PRs.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # cargo llvm-cov nextest runs the workspace suite with LLVM
      # instrumentation. This job is non-blocking, so a failure here is a
      # visible red X (and red main on push) but does not block PRs — the
      # blocking test signal is the uninstrumented `test` job above.
      #
      # --no-clean: cargo-llvm-cov runs `cargo clean --package <each>` per
      # invocation by default, which would wipe the instrumented artifacts
      # rust-cache just restored. This flag suppresses that cleanup so the
      # cache restore is actually useful.
      - name: Run tests (with coverage instrumentation)
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info --no-tests=pass --no-clean

      # No continue-on-error: on push to main (post-merge) a failure paints
      # main CI red rather than blocking a PR. Silent degradation is worse
      # than a visible red on main — a persistent upload failure would
      # silently freeze the coverage baseline that all PR diffs are
      # computed against.
      - name: Upload coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 90

      - name: Download coverage baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ci.yml
          branch: main
          workflow_conclusion: success
          name: coverage-lcov
          path: baseline/
          if_no_artifact_found: warn

      # Read the existing sticky comment (if any) so coverage-diff.py can
      # extract the prior per-commit history block and append a new row.
      # Without this step the comment would still update in place but the
      # history would reset to a single row on every push.
      # On a transient API failure (5xx, rate limit) the catch falls back to
      # an empty file so coverage-diff.py treats it as "no prior" rather
      # than failing the job. The visible degraded mode is "history resets
      # this push" — same as a deleted comment.
      - name: Fetch prior coverage comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // Must match MARKER in .github/scripts/coverage-diff.py.
            const marker = '<!-- decdn-coverage-comment -->';
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              // Filter by author too: anyone who can comment on the PR could
              // post a body containing the marker and hijack the sticky-comment
              // selection. Bot author + marker is the unambiguous identifier.
              const existing = comments.find(c =>
                c.user?.login === 'github-actions[bot]'
                && c.body
                && c.body.includes(marker)
              );
              fs.writeFileSync('prior-comment.md', existing ? existing.body : '');
            } catch (e) {
              core.warning(`Failed to fetch prior coverage comment: ${e.message} — history will reset this push.`);
              fs.writeFileSync('prior-comment.md', '');
            }

      - name: Generate coverage diff
        id: gendiff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # The script writes the truncated comment to stdout (captured here for the
        # PR comment) and the full per-file table directly to $GITHUB_STEP_SUMMARY.
        # DECDN_HEAD_SHA must be the PR head, not GITHUB_SHA (which is the merge SHA).
        # Atomic write on success: stdout to .tmp, then rename. On failure,
        # write a marker-bearing fallback comment so the Post step updates the
        # sticky to a "diff failed" indicator rather than leaving stale data
        # from a prior push. The marker must match MARKER in coverage-diff.py.
        env:
          DECDN_COVERAGE_PRIOR_BODY: prior-comment.md
          DECDN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if python3 .github/scripts/coverage-diff.py lcov.info baseline/lcov.info \
               > coverage-comment.md.tmp; then
            mv coverage-comment.md.tmp coverage-comment.md
          else
            rc=$?
            rm -f coverage-comment.md.tmp
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            printf '%s\n' \
              '<!-- decdn-coverage-comment -->' \
              '## Coverage report' \
              '' \
              ":warning: Coverage diff generation failed for commit \`${DECDN_HEAD_SHA}\`." \
              "See the [workflow run logs](${run_url}) for details." \
              > coverage-comment.md
            exit $rc
          fi

      # always(): post the comment even when the `Run tests` step fails
      # (without it, success() would be false and this step would skip).
      # On a coverage-diff.py crash, Generate coverage diff writes a marker-
      # bearing fallback so this step still updates the sticky to a "diff
      # failed" indicator instead of leaving stale data. The hashFiles guard
      # only excludes the case where Generate coverage diff was itself skipped
      # (e.g. Run tests failed and the implicit success() gate skipped the
      # rest of the chain). Skip on fork PRs: GITHUB_TOKEN is read-only
      # there and createComment would 403.
      - name: Post coverage comment
        if: |
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('coverage-comment.md') != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            // Must match MARKER in .github/scripts/coverage-diff.py.
            const marker = '<!-- decdn-coverage-comment -->';
            // try/catch + core.warning: continue-on-error keeps API errors
            // (5xx, rate limit, permissions drift) from blocking the PR, but
            // a sustained outage would otherwise be invisible. The warning
            // adds a searchable entry to the run summary so a stopped-posting
            // regression is noticeable beyond just a yellow step.
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              // Filter by bot author + marker: a non-bot comment containing
              // the marker would otherwise get picked as `existing`, and the
              // updateComment call below would 403 (caller != author), leaving
              // the bot's actual comment unmaintained.
              const existing = comments.find(c =>
                c.user?.login === 'github-actions[bot]'
                && c.body
                && c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (e) {
              core.warning(`Failed to post coverage comment: ${e.message}`);
              throw e;
            }

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !.github/agents/**
            !.github/workflows/*.md
            !adr/_build/**
          config: ".markdownlint.yaml"

  adr-book-list:
    name: ADR book list
    runs-on: ubuntu-latest
    needs: changes
    # Runs only when the ADR book changes (adr/**/*.md or adr/Makefile);
    # skips otherwise (accepted via ci-success allowed-skips below).
    if: needs.changes.outputs.adr == 'true'
    steps:
      - uses: actions/checkout@v6
      # `make` is preinstalled on ubuntu-latest; the target is pure shell
      # (no pandoc/typst/mermaid) and runs sub-second.
      - run: make -C adr check-book-list

  # Pytest suite for .github/scripts/coverage-diff.py. Non-blocking by design
  # — excluded from ci-success.needs — so a regression in the helper surfaces
  # as a red X (visible in the checks list) without blocking PRs. Lives in its
  # own job so the signal stays distinct from yellow continue-on-error steps.
  coverage-tooling-tests:
    name: coverage tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test coverage-diff helper
        run: |
          python3 -m pip install 'pytest==8.*'
          python3 -m pytest .github/scripts/tests -q

  # Single gate for branch protection. Point required-checks at this one job
  # so adding/renaming jobs above doesn't require updating branch rules.
  # The non-blocking `coverage` and `coverage-tooling-tests` jobs are
  # intentionally omitted from `needs`: coverage post-processing (LCOV diff,
  # sticky PR comment) is best-effort and must never block PRs. The required
  # test signal is the uninstrumented `test` job.
  ci-success:
    name: CI success
    if: always()
    runs-on: ubuntu-latest
    needs: [fmt, clippy, changes, test, deny, doc, msrv, markdownlint, adr-book-list]
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # Rust jobs are gated on `needs.changes.outputs.rust` and
          # adr-book-list on `needs.changes.outputs.adr`; both skip when
          # their paths are untouched. alls-green treats `skipped` as
          # failure unless listed here. `changes` and `markdownlint` are
          # intentionally omitted — they always run, so a skip from either
          # signals a misconfiguration that should fail the gate.
          allowed-skips: fmt, clippy, test, deny, doc, msrv, adr-book-list
