name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No `edited`: a PR-body edit (e.g. CodeRabbit injecting its walkthrough)
    # must not restart this heavy matrix (#1005). `edited` never advances the
    # head SHA, so for a PR opened against `main` no commit loses its
    # `CI success` check. One exception: a PR retargeted onto `main` from another
    # base also arrives as `edited`, so its head SHA gets no run until the next
    # push — branch protection then holds it as pending (fail-safe, never a
    # false green). The PR-title lint (pr-title job) stays part of the single
    # `CI success` gate and accepts the resulting no-revalidate-on-title-only-
    # edit gap — see that job's NOTE.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          # Restore-only except on `main`: only pushes to `main` write the
          # shared cache. Other runs (PRs, branch dispatches) warm-start from
          # main's entry but don't each save a ~1 GiB copy that would evict the
          # warm baseline once GitHub's per-repo cache store (currently 10 GiB)
          # saturates.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
          # Restore-only except on `main`; only `main` writes it (see clippy job).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    # REQUIRED gate. `cargo llvm-cov nextest` in the `test` job does NOT execute
    # doctests, so the `compile_fail` guard at crates/node/src/receipt_log.rs
    # (and any future runnable doctest) would never run (#864). This job runs
    # them so a doctest regression blocks the PR.
    #
    # It lives in its own job — not appended to `test` — on purpose. A bare
    # `cargo test --doc` cannot reuse the coverage-instrumented artifacts the
    # `test` job builds (cargo-llvm-cov instruments the workspace via a rustc
    # wrapper; the plain doctest build has a different fingerprint), so sharing
    # that job's target/cache forced a full ~5.5 min dependency-graph rebuild on
    # the critical path. Here the build is plain/non-instrumented with its OWN
    # `shared-key: doctest` cache partition: after `main` warms it, a PR reuses
    # the cached deps and rebuilds only changed workspace crates, AND the whole
    # thing runs in parallel with `test` instead of extending it. Doctest
    # coverage is not the goal (it would need nightly) — execution is.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doctest
          # Restore-only except on `main`; only `main` writes it (see clippy job).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --doc --workspace

  # NOTE: there is intentionally no separate "MSRV check" job. The workspace
  # MSRV (`rust-version = "1.95"`) equals the toolchain pinned in
  # rust-toolchain.toml (1.95.0), which every Rust job here installs. A
  # `cargo check` on that same toolchain is a strict subset of the `clippy`
  # job's `cargo clippy --workspace --all-targets` (clippy is rustc + extra
  # lints), so it added runner-minutes for zero additional signal. Reintroduce
  # a dedicated job ONLY if the MSRV is ever lowered below the pinned dev
  # toolchain — then install that older floor explicitly and `cargo check`
  # against it.

  public-api:
    name: public API snapshot
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    # Guards `decdn-protocol`'s exported surface (issue #304). The
    # `public-api-test` feature-gated test renders the public API from rustdoc
    # JSON and `insta`-snapshots it; an unintended diff fails here and blocks
    # the PR. Runs on the same pinned stable toolchain as everything else (the
    # test sets RUSTC_BOOTSTRAP=1 to emit rustdoc JSON without nightly). Kept a
    # separate job (clean env, no coverage instrumentation / mold) so it never
    # perturbs the required `test` job.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
          # Restore-only except on `main`; only `main` writes it (see clippy job).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p decdn-protocol --features public-api-test

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    # pull-requests: read is needed by dorny/paths-filter to call the
    # listFiles API on PR events; on push it falls back to git diff.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      adr: ${{ steps.filter.outputs.adr }}
      solidity: ${{ steps.filter.outputs.solidity }}
      markdown: ${{ steps.filter.outputs.markdown }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              # The ed25519-vector generator is a standalone workspace; its lock
              # is the parity target for crates/incentive/tests/ed25519_pin_parity.rs
              # (run by the `test` job), so a lock-only bump must trigger rust.
              - 'contracts/test/ed25519-vectors/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.cargo/**'
              # insta snapshot baselines (e.g. the public-API surface snapshot,
              # issue #304). Without this, a PR that hand-edits only a committed
              # *.snap would have rust=false and skip the `public-api` job that
              # validates it — letting a stale/incorrect baseline merge.
              - '**/*.snap'
              - '.github/workflows/ci.yml'
              - '.github/scripts/coverage-diff.py'
              - '.github/scripts/tests/**'
            adr:
              - 'adr/**/*.md'
              - 'adr/Makefile'
              - '.github/workflows/ci.yml'
            solidity:
              - 'contracts/**'
              # Deployment manifests (contracts/deployments/<chainId>.json) are
              # recorded artifacts — no code, no tests. A manifest-only commit
              # (e.g. the Arbitrum Sepolia 421614.json for #1083) should not
              # trigger build/test/slither/aderyn/coverage/fork jobs. dorny
              # negation is last-match-wins, so this excludes them from the
              # 'contracts/**' match above. (Test-chain 31337*.json manifests
              # are gitignored and never committed.)
              - '!contracts/deployments/**'
              - '.gitmodules'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.github/scripts/post-gas-snapshot-comment.sh'
              - '.github/scripts/contracts-coverage-comment.sh'
            markdown:
              - '**/*.md'
              - '.markdownlint.yaml'
              - '.github/workflows/ci.yml'
            scripts:
              # Gates `coverage-tooling-tests` (the pytest suite for
              # coverage-diff.py). The helper itself + its test fixtures live
              # under .github/scripts/; nothing else exercises them, so a PR
              # that touches no scripts has nothing for that job to verify.
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  test:
    name: test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    # Merged test+coverage job: the `Run tests` step (instrumented nextest) is
    # the required signal feeding ci-success. Every coverage post-processing
    # step below it carries `continue-on-error: true` so flaky LCOV/diff/comment
    # tooling never blocks PRs — preserving the prior `coverage`-job semantics.
    # Doc-only PRs skip this job via the `changes` gate; alls-green is
    # configured with `allowed-skips` (see ci-success below) so the skip
    # is accepted as success.
    permissions:
      contents: read
      pull-requests: write
      actions: read
    # RUSTFLAGS lives at the JOB level (not step level) so the
    # Swatinem/rust-cache step that runs early in this job sees it. That
    # action hashes CARGO_*/RUST_* env vars into its cache key, so this
    # placement gives the `coverage` partition a key that uniquely reflects
    # the build configuration: cache misses cleanly when the flags change,
    # the post-job step then saves the freshly-built target. Step-level
    # scoping was the wrong choice — Swatinem didn't see the env, restored
    # main's old-flag target, cargo invalidated everything via per-artifact
    # fingerprint and rebuilt from scratch, and the post-step skipped the
    # save with "Cache up-to-date" because the (unchanged) key already
    # existed. The new build was thrown away every run; see PR #484 history.
    # Other jobs (clippy/doc) are in separate job blocks and do not
    # inherit this env, so their caches stay warm.
    env:
      # Three link/debug knobs:
      #   - link-arg=-fuse-ld=mold: route the final link of the test
      #     binaries through mold instead of the system ld.
      #   - debuginfo=line-tables-only: emit only the .debug_line DWARF
      #     section, which is what cargo-llvm-cov reads to map counters to
      #     source lines (SF/DA records in lcov.info). Strips subprogram
      #     DIEs and type/variable info. NOT equivalent to `-C debuginfo=1`
      #     (= "limited", which keeps subprogram DIEs); line-tables-only is
      #     strictly tighter.
      #   - split-debuginfo=unpacked: side-file debug info; smaller .o
      #     files, faster relinking. Orthogonal to coverage.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold -C debuginfo=line-tables-only -C split-debuginfo=unpacked"
      # Incremental compilation files bloat the cache for zero gain in CI
      # (no second compile in the same run); rust-cache's README also
      # recommends disabling it.
      CARGO_INCREMENTAL: "0"
    steps:
      # fetch-depth: 0 is required: coverage-diff.py runs
      # `git diff origin/<base>...HEAD` and needs full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      # mold is a drop-in replacement for ld that noticeably shortens the
      # link phase of the workspace's instrumented test binaries. Scoped to
      # the test job because that's where the test binaries get linked —
      # other jobs do link small artifacts (build scripts, proc-macro
      # dylibs) but the savings would be marginal and wouldn't pay back the
      # apt-get cost.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          # Restore-only except on `main`; only `main` writes it (see clippy
          # job). This is the largest partition (~1.2 GiB instrumented target),
          # so gating its save is what most relieves the saturated cache store.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Python is needed downstream by `Generate coverage diff` to invoke
      # coverage-diff.py. The helper's own pytest suite lives in the separate
      # non-blocking `coverage-tooling-tests` job so a regression in the
      # helper surfaces as a red X without blocking PRs.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # REQUIRED step. cargo llvm-cov nextest runs the workspace test suite
      # with LLVM instrumentation; non-zero exit on any test failure fails
      # this job and (via ci-success.needs) blocks the PR. No continue-on-error.
      # sccache is not wired here (matching the prior coverage job); Swatinem
      # /rust-cache with shared-key: coverage covers caching of instrumented
      # build artifacts on its own. Build-flag env (RUSTFLAGS,
      # CARGO_INCREMENTAL) lives at the job level above so rust-cache's
      # cache key reflects them.
      #
      # --no-clean: cargo-llvm-cov runs `cargo clean --package <each>` per
      # invocation by default, which would wipe the instrumented artifacts
      # rust-cache just restored. This flag suppresses that cleanup so the
      # cache restore is actually useful.
      - name: Run tests (with coverage instrumentation)
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info --no-tests=pass --no-clean

      # Doctests are NOT run here. `cargo llvm-cov nextest` does not execute
      # them, and a bare `cargo test --doc` appended to this job cannot reuse
      # the coverage-instrumented artifacts (different rustc fingerprint), so it
      # recompiled the whole dependency graph — ~5.5 min, on the critical path.
      # They now live in the dedicated `doctest` job below, which builds
      # non-instrumented against its own warm cache partition and runs in
      # parallel, off this job's critical path. See that job for the #864
      # rationale.

      # No continue-on-error: this only runs on push to main (post-merge), so
      # a failure paints main CI red rather than blocking a PR. Silent
      # degradation is worse than a visible red on main — a persistent upload
      # failure would silently freeze the coverage baseline that all PR diffs
      # are computed against.
      - name: Upload coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 90

      - name: Download coverage baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ci.yml
          branch: main
          workflow_conclusion: success
          name: coverage-lcov
          path: baseline/
          if_no_artifact_found: warn

      # Read the existing sticky comment (if any) so coverage-diff.py can
      # extract the prior per-commit history block and append a new row.
      # Without this step the comment would still update in place but the
      # history would reset to a single row on every push.
      # On a transient API failure (5xx, rate limit) the catch falls back to
      # an empty file so coverage-diff.py treats it as "no prior" rather
      # than failing the job. The visible degraded mode is "history resets
      # this push" — same as a deleted comment.
      - name: Fetch prior coverage comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // Must match MARKER in .github/scripts/coverage-diff.py.
            const marker = '<!-- decdn-coverage-comment -->';
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              // Filter by author too: anyone who can comment on the PR could
              // post a body containing the marker and hijack the sticky-comment
              // selection. Bot author + marker is the unambiguous identifier.
              const existing = comments.find(c =>
                c.user?.login === 'github-actions[bot]'
                && c.body
                && c.body.includes(marker)
              );
              fs.writeFileSync('prior-comment.md', existing ? existing.body : '');
            } catch (e) {
              core.warning(`Failed to fetch prior coverage comment: ${e.message} — history will reset this push.`);
              fs.writeFileSync('prior-comment.md', '');
            }

      - name: Generate coverage diff
        id: gendiff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # The script writes the truncated comment to stdout (captured here for the
        # PR comment) and the full per-file table directly to $GITHUB_STEP_SUMMARY.
        # DECDN_HEAD_SHA must be the PR head, not GITHUB_SHA (which is the merge SHA).
        # Atomic write on success: stdout to .tmp, then rename. On failure,
        # write a marker-bearing fallback comment so the Post step updates the
        # sticky to a "diff failed" indicator rather than leaving stale data
        # from a prior push. The marker must match MARKER in coverage-diff.py.
        env:
          DECDN_COVERAGE_PRIOR_BODY: prior-comment.md
          DECDN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if python3 .github/scripts/coverage-diff.py lcov.info baseline/lcov.info \
               > coverage-comment.md.tmp; then
            mv coverage-comment.md.tmp coverage-comment.md
          else
            rc=$?
            rm -f coverage-comment.md.tmp
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            printf '%s\n' \
              '<!-- decdn-coverage-comment -->' \
              '## Coverage report' \
              '' \
              ":warning: Coverage diff generation failed for commit \`${DECDN_HEAD_SHA}\`." \
              "See the [workflow run logs](${run_url}) for details." \
              > coverage-comment.md
            exit $rc
          fi

      # always(): post the comment even when the required `Run tests` step fails
      # (without it, success() would be false and this step would skip on red PRs).
      # On a coverage-diff.py crash, Generate coverage diff writes a marker-
      # bearing fallback so this step still updates the sticky to a "diff
      # failed" indicator instead of leaving stale data. The hashFiles guard
      # only excludes the case where Generate coverage diff was itself skipped
      # (e.g. Run tests failed and the implicit success() gate skipped the
      # rest of the chain — in that case the failed-tests signal on the
      # required job is the unambiguous indicator). Skip on fork PRs:
      # GITHUB_TOKEN is read-only there and createComment would 403.
      - name: Post coverage comment
        if: |
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('coverage-comment.md') != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            // Must match MARKER in .github/scripts/coverage-diff.py.
            const marker = '<!-- decdn-coverage-comment -->';
            // try/catch + core.warning: continue-on-error keeps API errors
            // (5xx, rate limit, permissions drift) from blocking the PR, but
            // a sustained outage would otherwise be invisible. The warning
            // adds a searchable entry to the run summary so a stopped-posting
            // regression is noticeable beyond just a yellow step.
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              // Filter by bot author + marker: a non-bot comment containing
              // the marker would otherwise get picked as `existing`, and the
              // updateComment call below would 403 (caller != author), leaving
              // the bot's actual comment unmaintained.
              const existing = comments.find(c =>
                c.user?.login === 'github-actions[bot]'
                && c.body
                && c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (e) {
              core.warning(`Failed to post coverage comment: ${e.message}`);
              throw e;
            }

  # Live anvil-backed on-chain settlement e2e (issue #745). Gated behind the
  # `anvil-e2e` cargo feature so the default `test` job stays fast and needs no
  # Foundry; this job is the only one that compiles + runs it. Needs BOTH
  # toolchains: the Rust test spawns `anvil` and shells out to `forge`
  # (DeployProtocol.s.sol + the mintable-USDC mock), then drives the
  # `PaymentChannelService` settlement path against the live chain. Runs when
  # either Rust or Solidity paths changed; accepted via ci-success allowed-skips
  # otherwise.
  anvil-e2e:
    name: anvil e2e
    runs-on: ubuntu-latest
    # Bound the job so a stalled in-test `forge script --broadcast` (issue #785)
    # fails red quickly instead of squatting the runner until GitHub's 6-hour
    # default — or masquerading as "cancelled" when a later push pre-empts it.
    # Sized ABOVE the sum of the sequential steps' worst-case in-test
    # `OVERALL_TIMEOUT` ceilings, so a genuinely hung test hits its per-test
    # timeout's clear message first rather than this opaque job-level kill (the
    # #785 masking this bound exists to avoid): settlement 13m, then the
    # cross-layer journeys at --test-threads 2 — 5 tests (smoke 13m + three
    # G-NODE-04 at 10m + slash_appeal at 20m) whose worst 2-thread schedule is
    # 43m (one thread draws smoke + all three G-NODE-04 while the other runs
    # slash_appeal) — plus workspace compiles and the per-fixture in-test forge
    # deploys.
    timeout-minutes: 75
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.solidity == 'true' ||
      github.event_name != 'pull_request'
    steps:
      # submodules: recursive — the in-test `forge build` needs the forge-std +
      # openzeppelin-contracts submodules under contracts/lib/.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Reclaim ~20 GB of preinstalled toolchains this job never uses. The
      # GitHub-hosted runner ships ~14 GB free on /; this job compiles the full
      # workspace, shells out to an in-test `forge build`, AND — on main only
      # (save-if below) — repacks target/ for the Rust cache. That combination
      # overflows the default free space, so the post-job cache-save fails with
      # ENOSPC and reds the job even though the e2e test itself passed. Freeing
      # the unused SDKs up front gives the build and the save headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.95.0
      # Installs the pinned Foundry (anvil + forge on PATH) and warms the solc
      # cache. cache-profile: none — the test drives its own `forge build`.
      - uses: ./.github/actions/foundry-setup
        with:
          cache-profile: none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: anvil-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run on-chain settlement e2e
        run: cargo nextest run -p decdn-node --features anvil-e2e --test anvil_settlement_e2e
      # The cross-layer `decdn-e2e` fixtures spawn the built `decdn-node`
      # binary, and the slash-appeal journey additionally shells out to the
      # user CLI `decdn` (package `decdn-cli`), so both must exist on disk
      # before the journeys run.
      - name: Build daemon + CLI for cross-layer fixtures
        run: cargo build -p decdn-node -p decdn-cli
      # Cross-layer journeys (smoke + G-NODE-04 blacklist compliance, #1031 +
      # G-NODE-05 slash appeal, #1032).
      # --test-threads 2: each journey runs its own anvil + forge deploy +
      # daemon(s); more at once oversubscribes the 4-core runner and turns
      # poll-based assertions flaky, so cap concurrency at two.
      - name: Run cross-layer e2e journeys
        run: cargo nextest run -p decdn-e2e --features anvil-e2e --test-threads 2

  # ----- Solidity contracts ----------------------------------------------
  # The contracts pipeline mirrors the Rust split (one concern per job).
  # All jobs gate on `needs.changes.outputs.solidity` and are accepted
  # via ci-success allowed-skips when no contracts/ paths changed.
  # Foundry is pinned to a concrete release tag (v1.7.1) for reproducibility.

  solidity-fmt:
    name: solidity fmt
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solidity == 'true' || github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1.9.0
        with:
          version: v1.7.1
      - run: forge fmt --check

  # Ed25519 differential-vector freshness guard (issue #1008). The on-chain
  # Ed25519Verifier must stay at least as strict as the ed25519-dalek
  # verify_strict the node runs off-chain (#669); committed test vectors pin
  # that parity. This job catches a stale vector: the generator or its pin
  # changed without re-pasting. The complementary *version-parity* guard — the
  # generator's isolated dalek pin must match the version decdn-incentive
  # resolves — is a Rust test (crates/incentive/tests/ed25519_pin_parity.rs) run
  # by the `test` job, not here.
  ed25519-vectors:
    name: ed25519 vectors
    runs-on: ubuntu-latest
    needs: changes
    # Drift is triggered by a Rust dependency bump (the node's dalek, via
    # Cargo.lock / a workspace Cargo.toml — `rust` filter) or by a change to the
    # generator or the consuming contracts (both under contracts/ — `solidity`
    # filter). Gate on both so either re-runs the check.
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.solidity == 'true' ||
      github.event_name != 'pull_request'
    steps:
      # This job only checks out to regenerate + diff vectors locally; it never
      # pushes, and releases are not automated from CI (no auto-release), so the
      # GITHUB_TOKEN need not persist in .git/config. Dropping it satisfies
      # zizmor's `artipacked` check and keeps the token off disk for later steps.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # The generator is a standalone workspace, isolated from the root one.
          workspaces: contracts/test/ed25519-vectors
          shared-key: ed25519-vectors
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # forge fmt normalises the regenerated Solidity; no solc/build needed, so
      # the bare toolchain (not ./.github/actions/foundry-setup) is enough.
      - uses: foundry-rs/foundry-toolchain@v1.9.0
        with:
          version: v1.7.1
      # Freshness: regenerating must reproduce the committed vectors.
      - name: Regenerate vectors
        run: cargo run --locked --manifest-path contracts/test/ed25519-vectors/Cargo.toml -- --write
      - name: Format regenerated vectors
        working-directory: contracts
        run: forge fmt test/Ed25519Verifier.t.sol test/CapacityBondRegionE2E.t.sol
      - name: Fail if vectors are stale
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- \
            contracts/test/Ed25519Verifier.t.sol \
            contracts/test/CapacityBondRegionE2E.t.sol; then
            echo "::error::Ed25519 differential vectors are stale vs a fresh dalek run. Regenerate with 'cargo run -- --write' in contracts/test/ed25519-vectors, run 'forge fmt', and commit the result."
            exit 1
          fi

  solidity-build-test:
    name: solidity build+test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solidity == 'true' || github.event_name != 'pull_request'
    # pull-requests: write is for the gas-snapshot sticky comment (PR events
    # only; fork PRs skip it — read-only token). The gas snapshot is folded
    # into this job rather than living in a separate `solidity-gas-snapshot`
    # job: `forge snapshot` runs the full test suite to measure gas, so a
    # standalone job re-ran the entire ci-profile fuzz/invariant suite
    # (1024 fuzz runs; 256 invariant runs at depth 50) a second time. Running
    # `forge snapshot` here as the single test invocation gives both the
    # pass/fail gate and the gas diff from one execution.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: contracts
    env:
      # foundry.toml profile.ci raises fuzz to 1024 runs and invariant depth to
      # 50, with traces (verbosity=3) for failed cases.
      FOUNDRY_PROFILE: ci
    steps:
      # submodules: recursive is required — forge-std and openzeppelin-contracts
      # are git submodules under contracts/lib/, and OZ pulls ds-test transitively.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/foundry-setup
        with:
          cache-profile: ci
      - run: forge --version
      - run: forge build --sizes --deny warnings
      # Single test execution: `forge snapshot --snap` runs the whole suite
      # (same pass/fail gate as `forge test`) AND records gas to a temp file in
      # one pass — no second run of the ci-profile fuzz/invariant suite. We then
      # FAIL the job if the committed baseline is stale, so a contract change
      # that moves gas can't merge until the author regenerates and commits it
      # (the job is path-filtered to `contracts/**`, so it only runs when
      # contracts actually change).
      #
      # The comparison is scoped to DETERMINISTIC entries: lines containing
      # `runs:` (fuzz mean/median, invariant call counts) are stripped from both
      # sides first. Foundry's fuzz μ/~ gas is NOT reproducible across machines
      # even at a fixed seed — the committed values come from a contributor's
      # box and never match a fresh CI run — so gating on them would fail every
      # PR. The ~620 non-fuzz entries ARE byte-stable across machines at the
      # pinned forge + solc version, and every contract has deterministic unit
      # tests, so a real gas movement still trips the gate. `grep -v` output is
      # newline-terminated on both sides, so this is also immune to the
      # trailing-newline difference between forge's writer and editors/hooks.
      # The deterministic diff is captured for the sticky PR comment (posted
      # even on failure, below). `set -euo pipefail` makes a test failure
      # (non-zero `forge snapshot`) abort the job too; re-run locally with -vvvv
      # for full call traces.
      - name: Test + gas snapshot
        id: gas
        run: |
          set -euo pipefail
          if [[ ! -f .gas-snapshot ]]; then
            echo "::error::contracts/.gas-snapshot baseline missing; regenerate via 'FOUNDRY_PROFILE=ci forge snapshot --snap .gas-snapshot'"
            exit 1
          fi
          forge snapshot --snap "${RUNNER_TEMP:-/tmp}/new.gas-snapshot"
          grep -v 'runs:' .gas-snapshot > "${RUNNER_TEMP:-/tmp}/base.det"
          grep -v 'runs:' "${RUNNER_TEMP:-/tmp}/new.gas-snapshot" > "${RUNNER_TEMP:-/tmp}/new.det"
          if ! diff -u "${RUNNER_TEMP:-/tmp}/base.det" "${RUNNER_TEMP:-/tmp}/new.det" > /tmp/gas-diff.txt; then
            echo "::error::contracts/.gas-snapshot is stale vs the contracts in this PR (deterministic gas changed). Regenerate with 'FOUNDRY_PROFILE=ci forge snapshot --snap .gas-snapshot' and commit the result."
            cat /tmp/gas-diff.txt
            exit 1
          fi
      # Structural enforcement that `TestnetFaucet` never leaks into the
      # production audit surface (issue #636, #452). The contract lives at
      # `testnet/TestnetFaucet.sol` and is wired only from
      # `script/TestnetFaucet.s.sol` + the test suite — any reference from
      # `src/` or from any other `script/*.s.sol` fails CI.
      - name: Verify TestnetFaucet stays in testnet boundary
        run: |
          set -euo pipefail
          # Explicit dir-existence check so a future refactor that renames /
          # removes `src/` or `script/` fails the gate loudly instead of
          # silently passing — without it, `grep`'s missing-dir error is
          # swallowed by `2>/dev/null` and `|| true` and the gate degrades
          # to a no-op against the new layout.
          for d in src script; do
            if [[ ! -d "$d" ]]; then
              echo "::error::expected directory contracts/$d to exist for the TestnetFaucet boundary check"
              exit 1
            fi
          done
          # Note: this intentionally matches comment mentions too. If a
          # production file ever needs to *name* TestnetFaucet (e.g., in a
          # doc reference), the right move is to update this gate
          # deliberately, not to soften it.
          leak=$(grep -rnw 'TestnetFaucet' src/ script/ \
                   | grep -v '^script/TestnetFaucet\.s\.sol:' || true)
          if [[ -n "$leak" ]]; then
            echo "::error::TestnetFaucet must not appear outside contracts/testnet/ or contracts/script/TestnetFaucet.s.sol"
            echo "$leak"
            exit 1
          fi
      # Post (or update) the sticky gas-snapshot diff comment. PR-only; skipped
      # on fork PRs (read-only GITHUB_TOKEN would 403). continue-on-error so a
      # transient GitHub API hiccup in this best-effort tooling never blocks the
      # required gate — mirrors the coverage-comment steps in the `test` job.
      # `if: always() && steps.gas.outcome in (success, failure)`: post the
      # comment WHETHER OR NOT the snapshot gate passed — a stale-gas failure is
      # exactly when the author needs to see which entries drifted (the gate
      # step wrote the unified diff to /tmp/gas-diff.txt before exiting). The
      # `outcome` guard scopes it to runs where the snapshot step actually
      # executed, so a `forge build` failure (snapshot skipped, no diff file)
      # posts nothing. A clean run leaves an empty diff and the script renders
      # "No gas changes vs base." continue-on-error only forgives a failure of
      # THIS step (the API call), not of the prior gate.
      - name: Post gas snapshot comment
        if: >-
          always()
          && (steps.gas.outcome == 'success' || steps.gas.outcome == 'failure')
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../.github/scripts/post-gas-snapshot-comment.sh /tmp/gas-diff.txt

  solidity-fork-test:
    name: solidity fork test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solidity == 'true' || github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: fork
      # Live Balancer V3 RPC endpoints. Both are absent on fork PRs (secrets are
      # withheld) and in forks that never configured them — the run step below
      # no-ops when neither is set, and each fork suite additionally self-skips on
      # its own missing RPC, so this job never blocks a PR for a missing secret.
      #   ARBITRUM_RPC_URL — read/validation suite (BuybackBurnerBalancerV3.fork);
      #     verifies our IBalancerV3* ABIs against live Arbitrum One bytecode. Pins
      #     a historical block, so it needs an ARCHIVE endpoint.
      #   SEPOLIA_RPC_URL — swap+burn suite (BuybackBurnerBalancerV3.swapburn.fork,
      #     issue #995); creates+seeds its own pool and runs a real executeBuyback.
      #     Forks at LATEST, so a plain public (non-archive) endpoint suffices.
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      # submodules: recursive — forge-std + openzeppelin-contracts are submodules.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1.9.0
        with:
          version: v1.7.1
      # Runs both fork suites; each self-skips unless its own RPC is set, so a run
      # with only one secret configured exercises just that suite.
      - name: Fork tests (no-op when no fork RPC is set)
        if: env.ARBITRUM_RPC_URL != '' || env.SEPOLIA_RPC_URL != ''
        run: forge test --match-path 'test/*.fork.t.sol' -vv

  solidity-coverage:
    name: solidity coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solidity == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      # dawidd6/action-download-artifact calls the workflow_runs API to
      # find the latest successful main run; without actions: read it
      # 403s and the step (continue-on-error) silently produces no
      # baseline — every PR would render "no baseline available".
      actions: read
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: coverage
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/foundry-setup
        with:
          cache-profile: coverage
      # The coverage profile disables optimizer + via_ir for accurate source
      # mapping. If forge coverage hits "stack too deep" as more contracts
      # land, add --ir-minimum here.
      - name: forge coverage
        run: forge coverage --report lcov --report summary

      # Push to main: publish the LCOV as a baseline artifact for PRs to
      # diff against. Mirrors the Rust coverage flow (test job).
      - name: Upload coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: contracts-coverage-lcov
          path: contracts/lcov.info
          retention-days: 90

      # PR: download the baseline so the comment script can render a delta.
      # `if_no_artifact_found: warn` keeps the job green on a first-ever
      # PR or after an artifact has expired.
      - name: Download coverage baseline
        id: dl_baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # SHA-pinned (v21); rebind would require a deliberate ref change.
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151
        with:
          workflow: ci.yml
          branch: main
          workflow_conclusion: success
          name: contracts-coverage-lcov
          # action-download-artifact resolves `path:` relative to
          # GITHUB_WORKSPACE, not the job-default working-directory,
          # so this lands the file at contracts/baseline/lcov.info.
          path: contracts/baseline/
          if_no_artifact_found: warn

      # Record WHY the baseline is absent so the comment script can
      # distinguish "first PR / artifact expired" from "download failed
      # with the artifact available" — otherwise an artifact-API outage
      # looks identical to a legitimate first PR.
      - name: Tag baseline status
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p baseline
          if [[ -s baseline/lcov.info ]]; then
            rm -f baseline/.absent-reason
          elif [[ "${{ steps.dl_baseline.outcome }}" == "success" ]]; then
            printf 'not-found\n' > baseline/.absent-reason
          else
            printf 'download-failed\n' > baseline/.absent-reason
          fi

      # Post (or update) the sticky PR comment with total line coverage and
      # delta vs main. Mirrors the existing coverage-diff.py sticky-comment
      # pattern but contracts-scoped (distinct marker, distinct script).
      # Skips on fork PRs — GITHUB_TOKEN is read-only there.
      - name: Post coverage comment
        if: |
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # CWD is contracts/ via the job-level defaults.run.working-directory.
        # lcov.info lives here (from forge coverage); baseline/lcov.info was
        # written by the prior step (action-download-artifact uses
        # GITHUB_WORKSPACE-relative paths, so its `path: contracts/baseline/`
        # lands the file at <ws>/contracts/baseline/lcov.info, which is
        # ./baseline/lcov.info from here).
        run: |
          base="baseline/lcov.info"
          if [[ ! -s "$base" ]]; then base=""; fi
          ../.github/scripts/contracts-coverage-comment.sh lcov.info "$base" baseline/.absent-reason

  solidity-solhint:
    name: solidity solhint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solidity == 'true' || github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json
      # npm ci (not npm install) enforces the committed lock file so the
      # transitive dependency graph stays pinned, not just solhint itself.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  solidity-slither:
    name: solidity slither
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solidity == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      # GitHub Advanced Security is NOT enabled on decdn/decdn (private
      # repo, no GHAS license), so the SARIF upload step below is
      # commented out. The slither-action's `fail-on: medium` is still
      # the authoritative CI gate (findings ≥ medium fail the job and
      # surface in the run log). Re-enable the upload step + add back
      # `security-events: write` and `actions: read` permissions if
      # GHAS is ever turned on or the repo flips public.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # cache-profile omitted (none): crytic-compile drives its own `forge
      # build`, so we cache only the solc binaries it downloads, not artifacts.
      - uses: ./.github/actions/foundry-setup
      - name: Run Slither
        id: slither
        # SHA-pinned (v0.4.2). slither-config carries fail_on: medium too;
        # `fail-on` on the action input is the authoritative gate.
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          sarif: results.sarif
          fail-on: medium
      # SARIF upload disabled until GHAS is enabled on this repo (see
      # job-level permissions comment above). Restore by uncommenting
      # the step below and adding `security-events: write` + `actions:
      # read` back to `permissions:`. The slither step still produces
      # results.sarif on disk; only the upload-to-code-scanning is
      # gated.
      # - name: Upload SARIF
      #   if: always() && steps.slither.outputs.sarif != ''
      #   uses: github/codeql-action/upload-sarif@v4.35.5
      #   with:
      #     sarif_file: ${{ steps.slither.outputs.sarif }}
      #     category: slither

  solidity-aderyn:
    name: solidity aderyn
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solidity == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # cache-profile omitted (none): aderyn-ci manages its own build, so we
      # cache only the solc binaries, not artifacts.
      - uses: ./.github/actions/foundry-setup
      # The official Cyfrin/aderyn-ci action installs aderyn, runs it, and
      # gates the CI step via fail-on. No SARIF surface (which we don't
      # need anyway — code scanning requires GHAS on private repos), and
      # the action handles its own toolchain lifecycle.
      - name: Aderyn check
        # SHA-pinned (v0.0.10). The action emits a `working-directory`
        # deprecation warning suggesting `root` in aderyn.toml; both work
        # today and the warning is benign — the action still respects
        # the input.
        uses: Cyfrin/aderyn-ci@6c7e313326652c60f82f804b7f3641650334baaf
        with:
          working-directory: contracts
          fail-on: high

  # NOTE: the former standalone `solidity-gas-snapshot` job was folded into
  # `solidity-build-test` (see its "Test + gas snapshot" step). It re-ran the
  # full ci-profile fuzz/invariant suite a second time purely to measure gas;
  # `forge snapshot` already runs that suite, so one invocation now serves both
  # the test gate and the gas diff. Removed from ci-success needs/allowed-skips
  # accordingly.

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    # Conventional-commit lint on the PR title. Part of the single `CI success`
    # gate (ci-success.needs + allowed-skips below), so a non-conformant title
    # blocks merge without a second required status check. PR-only — skipped on
    # push to main and workflow_dispatch and accepted via allowed-skips. Reads
    # PR metadata only (no PR code is checked out), so plain `pull_request` with
    # a read-only token is safe — the action just hits the GitHub API.
    #
    # NOTE (#1005): this workflow intentionally does NOT trigger on `edited`
    # (see `on.pull_request.types` above), so a PR-body edit can't restart the
    # heavy matrix. Consequence for this check: the title is validated on open
    # and on every push (synchronize), but a title edited to a non-conformant
    # value with no subsequent push is not re-checked before merge. Any later
    # push (or reopen) re-validates. Coupling `edited` back in to close that gap
    # would re-introduce the duplicate-run / stale-green problem #1005 fixed.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    needs: changes
    # Gated on the `markdown` filter (any **/*.md or the lint config). On a
    # PR that touches no Markdown there is nothing to lint, so the job skips
    # and is accepted via ci-success allowed-skips. Still runs unconditionally
    # on push/dispatch. The `changes` job remains the always-run canary that a
    # skip here can no longer mask.
    if: needs.changes.outputs.markdown == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !.github/agents/**
            !.github/workflows/*.md
            !adr/_build/**
          config: ".markdownlint.yaml"

  adr-book-list:
    name: ADR book check
    runs-on: ubuntu-latest
    needs: changes
    # Runs only when the ADR book changes (adr/**/*.md or adr/Makefile);
    # skips otherwise (accepted via ci-success allowed-skips below).
    # Job id stays `adr-book-list` — referenced by ci-success needs/allowed-skips.
    if: needs.changes.outputs.adr == 'true'
    steps:
      - uses: actions/checkout@v7
      # `make` is preinstalled on ubuntu-latest; every target is pure shell
      # (awk/sed/grep, no pandoc/typst/mermaid) and runs sub-second. Separate
      # steps so a failure points at the specific guard in the checks UI.
      - run: make -C adr check-book-list
      - run: make -C adr check-bare-refs
      - run: make -C adr check-md-anchors
      - run: make -C adr check-no-section-numbers

  # Pytest suite for .github/scripts/coverage-diff.py. Non-blocking by design
  # — excluded from ci-success.needs — so a regression in the helper surfaces
  # as a red X (visible in the checks list) without blocking PRs. Lives in its
  # own job so the signal stays distinct from yellow continue-on-error steps
  # in the required `test` job.
  coverage-tooling-tests:
    name: coverage tooling tests
    runs-on: ubuntu-latest
    needs: changes
    # Gated on the `scripts` filter: this only exercises .github/scripts/, so a
    # PR that touches none has nothing to verify here. Not in ci-success.needs
    # (non-blocking by design), so a skip needs no allowed-skips entry.
    if: needs.changes.outputs.scripts == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test coverage-diff helper
        run: |
          python3 -m pip install 'pytest==8.*'
          python3 -m pytest .github/scripts/tests -q

  # Single gate for branch protection. Point required-checks at this one job
  # so adding/renaming jobs above doesn't require updating branch rules.
  # The `test` job carries coverage post-processing (LCOV diff, sticky PR
  # comment via .github/scripts/coverage-diff.py) as best-effort steps; those
  # steps' `continue-on-error: true` keeps coverage tooling non-blocking even
  # though the job itself is required.
  ci-success:
    name: CI success
    if: always()
    runs-on: ubuntu-latest
    needs: [fmt, clippy, changes, test, doctest, deny, doc, public-api, markdownlint, adr-book-list,
            pr-title, anvil-e2e,
            solidity-fmt, solidity-build-test, solidity-coverage,
            solidity-solhint, solidity-slither, solidity-aderyn, ed25519-vectors]
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # Rust jobs are gated on `needs.changes.outputs.rust`,
          # adr-book-list on `needs.changes.outputs.adr`, markdownlint on
          # `needs.changes.outputs.markdown`, and the solidity-* jobs on
          # `needs.changes.outputs.solidity`; each skips when its paths are
          # untouched. alls-green treats `skipped` as failure unless listed
          # here. `changes` is intentionally omitted — it always runs, so a
          # skip from it signals a misconfiguration that should fail the gate.
          allowed-skips: fmt, clippy, test, doctest, deny, doc, public-api, adr-book-list,
                         pr-title, markdownlint, anvil-e2e,
                         solidity-fmt, solidity-build-test, solidity-coverage,
                         solidity-solhint, solidity-slither, solidity-aderyn, ed25519-vectors
