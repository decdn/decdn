name: Release

# Versions are cut locally, never here. A maintainer runs `cargo release
# <level> --execute`, which bumps the workspace and makes a GPG-signed commit
# and tag with their own key (see RELEASING.md). Pushing that tag is what
# starts this workflow. CHANGELOG.md is maintained by hand; git-cliff is used
# below only to generate the GitHub release notes.
#
# This workflow builds and stages; it does not sign and it does not publish.
# The GitHub Release is created as a *draft* and both container image manifests
# are pushed untagged, so no NAME a user would pull resolves to anything before a
# maintainer has signed it with .github/scripts/sign-release.sh. (A manifest
# is still fetchable by its digest — untagged is not unreachable — but no tag
# points at unsigned bytes, and the digest is not advertised anywhere a user
# would look.) There is no signing key in Actions secrets.
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  # The run in progress is never cancelled: every tag shares this group, so
  # cancelling would let a second tag push abandon a release half-staged.
  # GitHub still keeps at most one pending run per group, so a third push
  # drops the run waiting behind the first before it starts. Re-run that
  # workflow once the group is free; the draft step and both asset uploads
  # are idempotent, so a run cancelled by hand mid-flight recovers the same way.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  # The fast gate. Everything else needs it; nothing in it compiles.
  tag:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Full fetch, not depth 1: a shallow checkout of a tag ref stores the tag
      # as a lightweight ref, and `git verify-tag` below needs the annotated tag
      # object that carries the signature. Without it the check fails closed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The tag is the only input, and it is attacker-controllable: the `v[0-9]*`
      # trigger glob matches things like `v0$(whoami)`. The version flows into
      # archive filenames and image tags in later jobs, so pin it to strict
      # semver here and let everything downstream trust these outputs.
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not a semver release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # A release is only built for a tag signed by a maintainer key published
      # on `main`. The keyring is read from origin/main, NOT from the tagged
      # tree: reading it from the tag would let whoever pushes the tag supply
      # both the key and the check, so the tag would only prove it was signed
      # by a key it vouches for itself.
      #
      # DEFENCE IN DEPTH, NOT A BOUNDARY — until the repository is public.
      # For a `push` event GitHub runs the workflow definition from the pushed
      # ref, so a tag can carry a release.yml with this step deleted, and that
      # workflow still receives contents:write and packages:write. Reading KEYS
      # from main does not help while main itself is unprotected.
      #
      # Both holes close with the same switch: branch and tag protection are
      # unavailable on the current plan (the API returns 403 "Upgrade to GitHub
      # Pro or make this repository public") and become available when this
      # repository is open-sourced. Configure them AT that point — see
      # RELEASING.md § Before open-sourcing. Until then the enforceable
      # guarantee is the maintainer signature itself, which consumers verify
      # off-platform against a pinned fingerprint.
      #
      # `git verify-tag` exits 0 on a good-but-untrusted signature, so no trust
      # database setup is needed — importing the keyring is enough.
      - name: Verify tag signature
        shell: bash
        env:
          # Isolated keyring, not the runner's default. Importing KEYS into the
          # default home would let `git verify-tag` succeed on any key that
          # already happened to be there, so the "only keys in origin/main:KEYS
          # are trusted" guarantee would depend on the runner starting clean
          # rather than on anything this step controls.
          GNUPGHOME: ${{ runner.temp }}/keys-gnupg
        run: |
          set -o pipefail
          # No --depth: the checkout is a full clone, and a shallow fetch would
          # turn it into a shallow one.
          git fetch --no-tags origin main
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          git show origin/main:KEYS > "$RUNNER_TEMP/KEYS" || {
            echo "::error::cannot read KEYS from origin/main"; exit 1; }
          gpg --import "$RUNNER_TEMP/KEYS" || {
            echo "::error::KEYS on origin/main is not a valid OpenPGP keyring"; exit 1; }
          if ! git verify-tag "$GITHUB_REF_NAME"; then
            echo "::error::$GITHUB_REF_NAME is not signed by a key in KEYS on main." \
                 "Releases must be cut locally with a signed tag — see RELEASING.md."
            exit 1
          fi

      # `git verify-tag` above checks the tag as this job fetched it, and every
      # later job builds `github.sha`, the commit the push event named. A tag
      # deleted and re-pushed while this run is queued must fail the release
      # rather than have one commit signature-checked and another built.
      # `actions/checkout` already refuses a tag that no longer matches
      # `github.sha`; asserting it here keeps the guarantee in this workflow
      # rather than in the action's internals.
      - name: Check tag points at the triggering commit
        shell: bash
        run: |
          TAG_SHA=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME now points at $TAG_SHA, but this run" \
                 "was triggered for $GITHUB_SHA. Was the tag re-pushed?"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.99.0

      # The version bump happens locally and is unpoliced by CI, so confirm the
      # tag matches the manifests it claims to describe. Catches a hand-typed
      # tag or a tag pushed without `cargo release`. Checks every crate, not
      # just one: `shared-version` is supposed to move all eleven in lockstep,
      # and a partially-applied bump is exactly what this is here to catch.
      # `shell: bash` is deliberate: the default shell for a `run:` block is
      # `bash -e` with NO pipefail, so a `cargo metadata` failure here would be
      # masked by jq exiting 0 on empty input and reported as a bogus version
      # mismatch. `shell: bash` runs with `-eo pipefail`.
      - name: Check tag matches crate versions
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MISMATCHED=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg v "$VERSION" \
              '.packages[] | select(.version != $v) | "\(.name)=\(.version)"')
          if [ -n "$MISMATCHED" ]; then
            echo "::error::tag says $VERSION but these crates disagree: $MISMATCHED"
            echo "Cut releases with \`cargo release\` so all eleven stay in step."
            exit 1
          fi
          echo "All crates are at $VERSION."

  # Runs in parallel with build-binaries; both need only `tag`. Nothing reaches
  # the release or the registry until this job passes: it creates the draft as
  # its last step, and upload-assets and docker both need it. The build legs'
  # workflow artifacts exist before verification finishes, but they are run
  # artifacts, not release assets.
  verify:
    name: Verify release
    needs: tag
    runs-on: ubuntu-latest
    # Mirrors ci.yml's workflow-level env. rust-cache hashes every
    # `CARGO*`/`RUST*` variable into its restore key, so the `clippy` partition
    # restored below only hits when this env matches the env at ci.yml's clippy
    # rust-cache step. Change the two together.
    env:
      RUST_BACKTRACE: 1
    steps:
      # Full history and tags: the semver baseline below lists the prior
      # release tags, and cargo-semver-checks checks out the chosen tag's
      # commit. A shallow checkout has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse the `clippy` partition rather than a `release` one: the
          # pre-release verification below runs the same
          # `cargo clippy --workspace --all-targets` as ci.yml's clippy job, so
          # the artifacts match. A `release` partition would never be populated
          # — tag pushes are not on a branch, so this job cannot save, and no
          # job in ci.yml writes that key.
          shared-key: clippy
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@v2.87.26
        with:
          tool: git-cliff,cargo-nextest

      - name: Pre-release verification
        run: |
          cargo fmt --all --check
          CARGO_BUILD_WARNINGS=deny cargo clippy --workspace --all-targets
          cargo nextest run --workspace --no-tests=pass

      # publish-crates.sh uploads these to crates.io after the release is
      # signed, and a crates.io version can never be replaced. Packaging must
      # therefore be proven BEFORE the draft exists, not discovered mid-publish.
      #
      # The verify build is the point: it compiles each crate from its packaged
      # .crate, which is the only thing that catches a file referenced from
      # outside the package (an `include_str!` reaching the workspace root
      # builds fine in-tree and fails for every `cargo install` user).
      - name: Verify every crate packages and builds standalone
        run: cargo publish --workspace --dry-run --locked

      # Baseline = the highest v* tag that does not point at HEAD, rather than
      # the crates.io registry baseline. Publishing is a manual post-signing
      # step (publish-crates.sh) that can be skipped or fail partway, so the
      # registry is not a reliable record of the previous release — and the tag
      # baseline needs no registry round-trip and works before the first
      # publish. The first release has no prior tag, so semver-checks is
      # skipped then (nothing to compare against).
      - name: Determine semver baseline
        id: baseline
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # Highest v* tag that does NOT point at HEAD. The checkout is the
          # tagged commit, so the release tag itself always points at HEAD;
          # skipping tags on HEAD is what makes this resolve to the *previous*
          # release rather than comparing the revision against itself.
          HEAD_SHA=$(git rev-parse HEAD)
          PREV=""
          # A separate assignment, not `for t in $(...)`: `-e` aborts on a
          # failed assignment but ignores a failed substitution in a `for`
          # list, which would leave PREV empty and skip semver-checks exactly
          # as if this were the first release.
          TAGS=$(git tag --list 'v[0-9]*' --sort=-v:refname)
          for t in $TAGS; do
            # The glob is far looser than the version format below assumes, so
            # apply the same strict semver filter used on the triggering tag.
            # An odd tag like `v1.2` or `v0-wip` would otherwise become the
            # baseline and feed garbage to the major/minor comparison.
            [[ "${t#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || continue
            # Capture rather than inlining: `-e` is suspended inside an `if`
            # condition, so a rev-list failure on a dangling tag would yield an
            # empty string, compare unequal, and silently become the baseline.
            sha=$(git rev-list -n1 "$t") || {
              echo "::error::cannot resolve tag $t"; exit 1; }
            if [ "$sha" != "$HEAD_SHA" ]; then
              PREV="$t"
              break
            fi
          done
          if [ -z "$PREV" ]; then
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            echo "breaking=false" >> "$GITHUB_OUTPUT"
            echo "No prior release tag; skipping semver-checks."
            exit 0
          fi
          echo "rev=$PREV" >> "$GITHUB_OUTPUT"
          echo "has_baseline=true" >> "$GITHUB_OUTPUT"

          # A major bump is expected to break; so is a minor bump while the
          # major is 0, which cargo treats as the breaking component for 0.x.
          # Running semver-checks across either is noise, so skip it there.
          PREV_VERSION="${PREV#v}"
          CUR_MAJOR="${VERSION%%.*}"
          PREV_MAJOR="${PREV_VERSION%%.*}"
          CUR_MINOR=$(echo "$VERSION" | cut -d. -f2)
          PREV_MINOR=$(echo "$PREV_VERSION" | cut -d. -f2)
          if [ "$CUR_MAJOR" != "$PREV_MAJOR" ] ||
             { [ "$CUR_MAJOR" = "0" ] && [ "$CUR_MINOR" != "$PREV_MINOR" ]; }; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            echo "$PREV_VERSION -> $VERSION is a breaking bump; skipping semver-checks."
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo semver-checks
        if: ${{ steps.baseline.outputs.has_baseline == 'true' && steps.baseline.outputs.breaking == 'false' }}
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features
          baseline-rev: ${{ steps.baseline.outputs.rev }}

      # Created as a draft. Draft assets require authentication to download, so
      # the archives are not publicly reachable until sign-release.sh publishes
      # them. Idempotent, so "Re-run all jobs" refreshes the existing draft
      # rather than failing — but it refuses to touch an already-published
      # release. "Re-run failed jobs" reaches this step only when this job, or
      # `tag` before it, failed or was cancelled.
      - name: Create draft GitHub Release
        shell: bash
        run: |
          # GitHub caps release bodies at 125000 chars. The first release has
          # no prior tag to bound `--latest`, so cliff emits the whole history
          # and overflows; truncate (and flag it) only when we actually exceed
          # the limit, leaving normal releases untouched.
          git cliff --latest --strip header > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::git-cliff produced empty release notes for $TAG." \
                 "Check that the commits since the last tag are conventional."
            exit 1
          fi
          if [ "$(wc -c < /tmp/release-notes.md)" -gt 125000 ]; then
            head -c 120000 /tmp/release-notes.md > /tmp/release-notes.trunc.md
            printf '\n\n_Changelog truncated. See the full commit history for details._\n' \
              >> /tmp/release-notes.trunc.md
            mv /tmp/release-notes.trunc.md /tmp/release-notes.md
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/is-draft 2>/dev/null; then
            if [ "$(cat /tmp/is-draft)" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to overwrite it"
              exit 1
            fi
            echo "Draft already exists; refreshing its notes."
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Two binaries: the `decdn-node` daemon and the `decdn` user CLI. Each
      # ships as its own archive so users grab only what they need. The
      # container images reuse the Linux archives: `decdn` carries the CLI,
      # `decdn-node` the daemon plus the CLI.
      #
      # One job per target, not per binary: the two packages share most of
      # their dependency graph, and building both in one `target/` compiles
      # the shared part once. `builds` lists `package:binary` pairs; each binary
      # ships as `<binary>-<version>-<target>.<archive>`.
      matrix:
        include:
          # Both Linux targets go through `cross`, never a native build. A
          # native build links against the runner's glibc — ubuntu-latest is
          # 24.04, glibc 2.39 — which is NEWER than debian:bookworm-slim (2.36),
          # so the binary would not run in our own container, nor on Debian 12
          # or RHEL 9. `cross` images pin an old glibc, at or below the 2.31
          # floor ADR 000 sets, independently of whatever ubuntu-latest points
          # at next.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            builds: decdn-node:decdn-node decdn-cli:decdn
            archive: tar.gz
            cross: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            builds: decdn-node:decdn-node decdn-cli:decdn
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            builds: decdn-node:decdn-node decdn-cli:decdn
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            builds: decdn-node:decdn-node decdn-cli:decdn
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            builds: decdn-node:decdn-node decdn-cli:decdn
            archive: zip
          # The CLI only: Windows on ARM64 is for the walletless on-ramp, which
          # installs `decdn`. Cross-compiled on the x64 runner with the MSVC
          # ARM64 toolchain.
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            builds: decdn-cli:decdn
            archive: zip
    steps:
      # `github.sha`, not the tag name: the `tag` job proved this commit is the
      # one the tag pointed at, and the tag can move after that check.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2.87.26
        with:
          tool: cross

      # One `build` per package, not a single `--package a --package b`: one
      # invocation unifies features across every package it selects, so the
      # daemon could link features only the CLI enables. Separate invocations
      # resolve each package's features exactly as `cargo build -p <pkg>` alone
      # would, and still reuse every dependency whose feature set matches.
      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: |
          for build in $BUILDS; do
            cross build --release --locked --package "${build%%:*}" --target "$TARGET"
          done
        env:
          BUILDS: ${{ matrix.builds }}
          TARGET: ${{ matrix.target }}

      # `shell: bash` is required on the Windows runners, whose default shell
      # is pwsh: the loop and `${build%%:*}` are bash syntax, and pwsh reads
      # `$BUILDS`/`$TARGET` as PowerShell variables, not the env vars below.
      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          for build in $BUILDS; do
            cargo build --release --locked --package "${build%%:*}" --target "$TARGET"
          done
        env:
          BUILDS: ${{ matrix.builds }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TARGET: ${{ matrix.target }}

      # Enforce the glibc 2.31 floor (Debian 11, Ubuntu 20.04, RHEL 8) that
      # ADR 000 sets, rather than trusting `cross: true` to stay in the
      # matrix, so the condition keys on the target, not on `cross`. A
      # natively-built binary can reference symbols up to GLIBC_2.39 (the
      # runner's) and fails at exec on any older distribution with
      # "version `GLIBC_2.3x' not found" — debian:bookworm-slim (2.36), our
      # images' base, included. Checked here, before the archive exists, so a
      # binary above the floor never reaches upload-assets or either image.
      - name: Check glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          MAX_ALLOWED=2.31
          for build in $BUILDS; do
            f="target/$TARGET/release/${build#*:}"
            [ -f "$f" ] || { echo "::error::$f was not built"; exit 1; }
            # `|| true` on the grep alone: under pipefail a no-match would
            # abort before the empty check below can name the file, while an
            # objdump failure still fails the step.
            need=$(objdump -T "$f" \
              | { grep -o 'GLIBC_[0-9.]*' || true; } \
              | sed 's/GLIBC_//' | sort -V | tail -1)
            [ -n "$need" ] || { echo "::error::$f has no GLIBC symbol versions"; exit 1; }
            echo "$f requires glibc >= $need"
            if [ "$(printf '%s\n%s\n' "$need" "$MAX_ALLOWED" | sort -V | tail -1)" \
                 != "$MAX_ALLOWED" ]; then
              echo "::error::$f needs glibc $need, above the $MAX_ALLOWED floor." \
                   "Is this target still built with \`cross\`?"
              exit 1
            fi
          done
        env:
          BUILDS: ${{ matrix.builds }}
          TARGET: ${{ matrix.target }}

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          for build in $BUILDS; do
            bin="${build#*:}"
            tar czf "${bin}-${VERSION}-${TARGET}.tar.gz" -C "target/$TARGET/release" "$bin"
          done
        env:
          BUILDS: ${{ matrix.builds }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.tag.outputs.version }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          foreach ($build in $env:BUILDS -split ' ') {
            $bin = ($build -split ':')[1]
            Compress-Archive -Path "target/$env:TARGET/release/$bin.exe" `
              -DestinationPath "$bin-$env:VERSION-$env:TARGET.zip"
          }
        env:
          BUILDS: ${{ matrix.builds }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.tag.outputs.version }}

      # Fails the leg that is short an archive, rather than leaving it to the
      # count in upload-assets: the upload glob below matches as long as one
      # archive exists. Also rejects an empty or malformed `builds` entry,
      # which the bash loops above skip without error.
      - name: Check archives
        shell: bash
        run: |
          [ -n "$BUILDS" ] || { echo "::error::matrix.builds is empty for $TARGET"; exit 1; }
          for build in $BUILDS; do
            bin="${build#*:}"
            [ "$bin" != "$build" ] || {
              echo "::error::builds entry '$build' is not package:binary"; exit 1; }
            f="${bin}-${VERSION}-${TARGET}.${ARCHIVE}"
            [ -s "$f" ] || { echo "::error::$TARGET did not produce $f"; exit 1; }
          done
        env:
          ARCHIVE: ${{ matrix.archive }}
          BUILDS: ${{ matrix.builds }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.tag.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: '*-${{ needs.tag.outputs.version }}-${{ matrix.target }}.*'
          # Default is `warn`, which leaves a leg green when it produced
          # nothing. The check above already guarantees every archive; this
          # guards against the glob drifting from the archive names.
          if-no-files-found: error

  upload-assets:
    name: Upload release assets
    # Needs verify for ordering as well as gating: that job creates the draft
    # this one uploads to.
    needs: [tag, verify, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # SHA256SUMS ships unsigned from here. `sign-release.sh` re-checks it
      # against the uploaded bytes and signs it with a maintainer key before
      # the draft is published — one signature covering every archive.
      #
      # The count assertion is load-bearing. `sha256sum` with zero file
      # arguments reads STDIN rather than failing, so a `shopt -s nullglob`
      # glob that matched nothing would produce a valid-looking manifest with
      # a single line naming the file `-` (the hash of empty stdin). That
      # manifest would pass `sha256sum --check` with `-: OK`, and a
      # maintainer would sign a release containing no binaries at all.
      - name: Generate checksum manifest
        working-directory: artifacts
        shell: bash
        env:
          EXPECTED_ARCHIVES: "11"
        run: |
          archives=( ./*.tar.gz ./*.zip )
          for a in "${archives[@]}"; do
            [ -e "$a" ] || {
              echo "::error::archive glob did not match any file: $a"; exit 1; }
          done
          if [ "${#archives[@]}" -ne "$EXPECTED_ARCHIVES" ]; then
            echo "::error::expected $EXPECTED_ARCHIVES archives, found ${#archives[@]}:" \
                 "${archives[*]}"
            exit 1
          fi
          # Bare names, not ./-prefixed: consumers run `sha256sum --check` from
          # the directory they downloaded into, and sign-release.sh matches
          # manifest entries against plain filenames.
          sha256sum -- "${archives[@]#./}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to draft release
        run: gh release upload "$TAG" --clobber artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}

  docker:
    name: Docker image (${{ matrix.target }})
    # Needs build-binaries: each image is assembled from the Linux archives that
    # job produces, so every binary inside it is byte-identical to the one the
    # signed SHA256SUMS covers. Needs verify: that job creates the draft this
    # one uploads to, and no image is pushed, not even untagged, for a release
    # that failed verification. Needs upload-assets: no image is pushed and
    # nothing is attached to the draft unless all eleven archives and
    # SHA256SUMS reached it first, so a failed run never leaves a draft holding
    # an SBOM and digest for archives it does not have.
    needs: [tag, verify, build-binaries, upload-assets]
    runs-on: ubuntu-latest
    permissions:
      # `write`, not `read`: this job uploads the SBOM and the image digest to
      # the draft release, and a job-level permissions block fully overrides
      # the workflow-level grant rather than adding to it.
      contents: write
      packages: write
    strategy:
      # One leg per image, each a stage of the one Dockerfile. A failed leg
      # does not cancel the other; sign-release.sh refuses a draft that lacks
      # either image's digest, so a half-built release cannot be signed.
      # Each image has the same repository path on Docker Hub, which
      # sign-release.sh mirrors its signed digest to.
      fail-fast: false
      matrix:
        include:
          # `-node` because this image's entrypoint is the daemon. It also
          # carries the `decdn` CLI, for `docker exec` admin.
          - target: decdn-node
            binaries: decdn-node decdn
            image: ${{ github.repository }}-node
          # The CLI image takes the repository's own name, as the binary does.
          - target: decdn
            binaries: decdn
            image: ${{ github.repository }}
    steps:
      # `github.sha`, not the tag name — see build-binaries.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # The arm64 platform runs the Dockerfile's apt-get layer under
      # emulation. The binaries arrive prebuilt, so that is seconds of package
      # installs, not a compile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Each Linux artifact carries both archives; the unpack step below names
      # the ones this image needs and ignores the rest.
      - name: Download Linux archives
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*-unknown-linux-gnu
          path: archives
          merge-multiple: true

      # dist/<arch>/ is keyed on buildx's TARGETARCH (amd64/arm64) rather than
      # the Rust target triple, so the Dockerfile's COPY needs no branching.
      - name: Unpack archives into dist/
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          BINARIES: ${{ matrix.binaries }}
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          read -ra bins <<< "$BINARIES"
          # A misspelt matrix key leaves this empty, and the loop below, with
          # its executable check, would then run zero times.
          (( ${#bins[@]} > 0 )) || {
            echo "::error::matrix.binaries is empty"; exit 1; }
          for b in "${bins[@]}"; do
            tar xzf "archives/${b}-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              -C dist/amd64
            tar xzf "archives/${b}-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
              -C dist/arm64
            for a in amd64 arm64; do
              [ -x "dist/$a/$b" ] || {
                echo "::error::dist/$a/$b missing or not executable"; exit 1; }
              sha256sum "dist/$a/$b"
            done
          done

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only `labels` is consumed — `push-by-digest` below creates no tag, so
      # metadata-action's tag output is unused. `images` is still required for
      # it to compute the OCI source/revision labels.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=unused

      # Pushed WITHOUT a tag. `push-by-digest=true` uploads the manifest and
      # leaves it untagged, so nothing is pullable by name until
      # sign-release.sh promotes `latest`, `<version>` and `<major>.<minor>`
      # from the signed digest. A tag published before the digest is signed
      # would be an unvouched-for image anyone could pull.
      #
      # An untagged push into the release package, rather than a tagged push
      # into a staging one: GHCR keys a package version by digest and treats
      # tags as metadata on it, so a staging tag would end up on the same
      # version as `latest` after promotion and deleting it to tidy up would
      # delete the released image.
      #
      # No layer cache. The base stage's `apt-get upgrade` must run on every
      # release to pick up current security fixes, and a cached layer would
      # replay a stale one for as long as the base digest is unchanged. The
      # other layers copy this release's fresh binaries and never hit a cache.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true

      # Scanned by digest in the release package — the untagged manifest is
      # already there, it just has no tag pointing at it yet.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.target }}-${{ needs.tag.outputs.version }}-sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      # GPG has no native OCI-image signature format, so the image is attested
      # out of band: <stage>-image-digest.txt records the exact
      # ghcr.io/...@sha256:... reference, and sign-release.sh signs that file
      # locally. An empty build output fails here rather than at signing time.
      - name: Record image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::build produced no image digest (got '$DIGEST')"; exit 1; }
          echo "${IMAGE}@${DIGEST}" > "${TARGET}-image-digest.txt"

      - name: Upload SBOM and digest to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload "$TAG" --clobber \
            "${TARGET}-${VERSION}-sbom.spdx.json" \
            "${TARGET}-image-digest.txt"
