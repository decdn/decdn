name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Release level"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (no publish, no push)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  # cancel-in-progress: false — tag push / docker push / release-asset upload
  # are not idempotent; cancelling mid-flight can leave the release half-published.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Real releases sign the version-bump commit and the tag with the
      # org-owned decdn.org GPG key (identity: decdn <security@decdn.org>).
      # The (passphrase-less) private key lives only in the
      # RELEASE_GPG_PRIVATE_KEY Actions secret; no personal maintainer key is
      # used. See SECURITY.md for verification.
      - name: Import release GPG key
        if: ${{ !inputs.dry_run }}
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: decdn
          git_committer_email: security@decdn.org

      # Set the author identity explicitly too. The import step above sets the
      # committer, but `cargo release --execute` makes the version-bump commit
      # and git needs an author identity or it fails with "Please tell me who
      # you are".
      - name: Configure git identity (release)
        if: ${{ !inputs.dry_run }}
        run: |
          git config --global user.name "decdn"
          git config --global user.email "security@decdn.org"

      # Dry runs never create a commit or tag, so they need no key — just a
      # placeholder identity so any incidental git operation has one.
      - name: Configure git (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          git config user.name "decdn"
          git config user.email "security@decdn.org"

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          # Releases are dispatched from main, so only main writes this
          # partition; a dry-run dispatched from a branch stays restore-only
          # and won't burn a cache slot in the shared 10 GiB store.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@v2.85.7
        with:
          tool: cargo-release,git-cliff,cargo-nextest

      - name: Pre-release verification
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo nextest run --workspace --no-tests=pass

      # These crates are never published (publish = false), so semver-checks
      # has no crates.io baseline. Diff against the previous release tag
      # instead. The first release has no prior tag, so semver-checks is
      # skipped then (nothing to compare against).
      - name: Determine semver baseline
        id: baseline
        run: |
          # Highest v* tag that does NOT point at HEAD. Skipping tags on HEAD
          # keeps reruns (dispatched on a commit a release tag already points
          # at) baselining against the previous release instead of comparing
          # the revision against itself, which would be a silent no-op.
          HEAD_SHA=$(git rev-parse HEAD)
          PREV=""
          for t in $(git tag --list 'v[0-9]*' --sort=-v:refname); do
            if [ "$(git rev-list -n1 "$t")" != "$HEAD_SHA" ]; then
              PREV="$t"
              break
            fi
          done
          if [ -n "$PREV" ]; then
            echo "rev=$PREV" >> "$GITHUB_OUTPUT"
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            echo "No prior release tag; skipping semver-checks."
          fi

      # Semver-checks on patch/minor against the previous tag. Skipped for
      # major (breaking changes expected) and on the first release (no baseline).
      - name: cargo semver-checks
        if: ${{ inputs.level != 'major' && steps.baseline.outputs.has_baseline == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features
          baseline-rev: ${{ steps.baseline.outputs.rev }}

      # inputs.level is a constrained choice enum (patch/minor/major), not free-text
      - name: Validate release (dry run)
        if: inputs.dry_run
        run: cargo release "$LEVEL" --workspace --no-confirm --no-publish --no-push --no-tag
        env:
          LEVEL: ${{ inputs.level }}

      - name: Execute release
        if: ${{ !inputs.dry_run }}
        run: cargo release "$LEVEL" --workspace --no-confirm --no-publish --execute
        env:
          LEVEL: ${{ inputs.level }}

      - name: Get new version
        if: ${{ !inputs.dry_run }}
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "decdn-node") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          # GitHub caps release bodies at 125000 chars. The first release has
          # no prior tag to bound `--latest`, so cliff emits the whole history
          # and overflows; truncate (and flag it) only when we actually exceed
          # the limit, leaving normal releases untouched.
          git cliff --latest --strip header > /tmp/release-notes.md
          if [ "$(wc -c < /tmp/release-notes.md)" -gt 125000 ]; then
            head -c 120000 /tmp/release-notes.md > /tmp/release-notes.trunc.md
            printf '\n\n_Changelog truncated. See the full commit history for details._\n' \
              >> /tmp/release-notes.trunc.md
            mv /tmp/release-notes.trunc.md /tmp/release-notes.md
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}

  build-binaries:
    name: Build ${{ matrix.archive_name }} ${{ matrix.target }}
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Two binaries per target post-#421 split: the `decdn-node` daemon
      # and the `decdn` user CLI. Both ship as separate tarballs so
      # users grab only what they need; the container image is daemon-
      # only.
      matrix:
        include:
          # decdn-node (daemon) — five targets.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            package: decdn-node
            binary: decdn-node
            archive_name: decdn-node
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            package: decdn-node
            binary: decdn-node
            archive_name: decdn-node
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            package: decdn-node
            binary: decdn-node
            archive_name: decdn-node
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            package: decdn-node
            binary: decdn-node
            archive_name: decdn-node
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            package: decdn-node
            binary: decdn-node.exe
            archive_name: decdn-node
            archive: zip
          # decdn (user CLI) — same five targets.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            package: decdn-cli
            binary: decdn
            archive_name: decdn
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            package: decdn-cli
            binary: decdn
            archive_name: decdn
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            package: decdn-cli
            binary: decdn
            archive_name: decdn
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            package: decdn-cli
            binary: decdn
            archive_name: decdn
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            package: decdn-cli
            binary: decdn.exe
            archive_name: decdn
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2.85.7
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --package "$PACKAGE" --target "$TARGET"
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --package "$PACKAGE" --target "$TARGET"
        env:
          PACKAGE: ${{ matrix.package }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TARGET: ${{ matrix.target }}

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd "target/$TARGET/release"
          tar czf "../../../${ARCHIVE_NAME}-${VERSION}-${TARGET}.tar.gz" "$BINARY"
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release.outputs.version }}
          BINARY: ${{ matrix.binary }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/$env:TARGET/release/$env:BINARY" `
            -DestinationPath "$env:ARCHIVE_NAME-$env:VERSION-$env:TARGET.zip"
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release.outputs.version }}
          BINARY: ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive_name }}-${{ matrix.target }}
          path: ${{ matrix.archive_name }}-${{ needs.release.outputs.version }}-${{ matrix.target }}.*

  upload-assets:
    name: Upload release assets
    needs: [release, build-binaries]
    if: ${{ !inputs.dry_run }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Import release GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}

      # A signed SHA256SUMS covers all archives at once; per-archive detached
      # .asc signatures let a downloader verify a single file without the
      # manifest. Both are signed by the decdn.org release key.
      - name: Sign binaries and checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          for f in ./*.tar.gz ./*.zip; do
            gpg --batch --yes --pinentry-mode loopback \
              --local-user security@decdn.org --armor --detach-sign "$f"
          done
          gpg --batch --yes --pinentry-mode loopback \
            --local-user security@decdn.org --armor --detach-sign SHA256SUMS

      - name: Upload to GitHub Release
        run: gh release upload "$TAG" artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}

  docker:
    name: Docker image
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: useblacksmith/build-push-action@v2.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: decdn-${{ needs.release.outputs.version }}-sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Import release GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}

      # GPG has no native OCI-image signature format, so we sign the pinned
      # image digest out of band: image-digest.txt records the exact
      # ghcr.io/...@sha256:... reference, and its detached .asc lets a puller
      # confirm the digest came from the decdn.org key. cosign will later
      # replace this with an in-registry signature.
      - name: Sign SBOM and image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "${IMAGE}@${DIGEST}" > image-digest.txt
          gpg --batch --yes --pinentry-mode loopback \
            --local-user security@decdn.org --armor --detach-sign image-digest.txt
          gpg --batch --yes --pinentry-mode loopback \
            --local-user security@decdn.org --armor \
            --detach-sign "decdn-${VERSION}-sbom.spdx.json"

      - name: Upload SBOM and signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "decdn-${VERSION}-sbom.spdx.json" \
            "decdn-${VERSION}-sbom.spdx.json.asc" \
            image-digest.txt \
            image-digest.txt.asc
