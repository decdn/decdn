name: Security

on:
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/security.yml"

permissions:
  contents: read

# Coalesce rapid updates to the same ref so stale Trivy runs don't pile up.
# This workflow has no `push` trigger; the event that actually stacks is a PR
# being re-pushed (successive `synchronize`, e.g. fixup commits to a Cargo.lock
# bump), where github.ref is refs/pull/<n>/merge — those collapse to the
# latest. PR refs never collide with the weekly schedule or manual dispatch
# (both key on refs/heads/main); note a dispatch and a scheduled run on main
# DO share a group, so a manual run can supersede a scheduled one.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    name: Trivy image scan (${{ matrix.image }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/${{ github.repository }}-node
          - ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR only, deliberately. sign-release.sh mirrors the same manifests to
      # Docker Hub with `imagetools create`, which copies them verbatim, so both
      # registries serve byte-identical bytes under one digest — scanning the
      # mirror would re-scan the image already covered here.
      #
      # Skip gracefully if no :latest image has been published yet
      # (pre-first-release, or tags cleaned up). Only a registry "not found"
      # counts as that: an auth failure or a registry outage fails the job,
      # rather than skipping the scan every week without anyone noticing.
      - name: Check image exists
        id: image
        env:
          IMAGE: ${{ matrix.image }}:latest
        run: |
          set -uo pipefail
          if err=$(docker manifest inspect "$IMAGE" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest unknown|not found' <<< "$err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image $IMAGE not found; skipping scan."
          else
            echo "::error::cannot inspect $IMAGE: $err"
            exit 1
          fi

      - name: Run Trivy image scan
        if: steps.image.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
