version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Pin the title convention instead of leaving it to Dependabot's inference
    # from commit history. The `pr-title` job in ci.yml conventional-commit
    # lints the PR title and is part of the required `CI success` gate, so an
    # unprefixed title is unmergeable. Inference produced "chore(deps): ..."
    # for months, then silently regressed to a bare "bump x from a to b" and
    # blocked every open Dependabot PR (#1239, #1240, #1241). `chore` + scope
    # reproduces the historical titles verbatim; nothing infers it now.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The opentelemetry crates share traits across their boundaries and must
      # bump together. This group precedes `rust-dependencies` so it claims them
      # first, and omits `update-types` so the major-for-0.x 0.32 -> 0.33 bump is
      # not filtered back out into per-crate PRs.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # iroh ecosystem is pinned per ADR 001; upgrades require manual coordination
      - dependency-name: "iroh*"

  # Bumps the Dockerfile's pinned base-image digest. This only works because
  # the FROM line carries an explicit `@sha256:` — Dependabot updates a tag only
  # when it can parse a version out of it, and `bookworm-slim` gives it nothing,
  # so with a bare tag this ecosystem would open no PRs at all.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same rationale as the cargo ecosystem above.
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same rationale as the cargo ecosystem above.
    commit-message:
      prefix: chore
      include: scope
    # No dtolnay/rust-toolchain ignore: MSRV and the stable lint pin are both
    # 1.95.0 (see Cargo.toml workspace.package.rust-version and the @1.95.0
    # refs in ci.yml / release.yml). Dependabot bumps only the action refs, and
    # that is fine: .github/scripts/check-toolchain-pin.sh fails the `packaging`
    # job until rust-toolchain.toml and Cargo.toml's rust-version move in the
    # same PR, so the bump cannot land half-applied. Re-add a version-specific
    # ignore here if MSRV later drops below the stable pin.
