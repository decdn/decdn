version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Pin the title convention instead of leaving it to Dependabot's inference
    # from commit history. The `pr-title` job in ci.yml conventional-commit
    # lints the PR title and is part of the required `CI success` gate, so an
    # unprefixed title is unmergeable. Inference produced "chore(deps): ..."
    # for months, then silently regressed to a bare "bump x from a to b" and
    # blocked every open Dependabot PR (#1239, #1240, #1241). `chore` + scope
    # reproduces the historical titles verbatim; nothing infers it now.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The opentelemetry crates share traits across their boundaries and must
      # bump together. This group precedes `rust-dependencies` so it claims them
      # first, and omits `update-types` so the major-for-0.x 0.32 -> 0.33 bump is
      # not filtered back out into per-crate PRs.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # iroh ecosystem is pinned per ADR 001; upgrades require manual coordination
      - dependency-name: "iroh*"
      # iroh's QUIC crates (noq, noq-proto, noq-udp) share iroh's pin: ADR 000
      # records their baseline, and noq-proto 1.4 closes client pulls mid-leg
      # ("too many gaps in stream buffer", #2585) until upstream ports the fix.
      # .github/scripts/check_iroh_hold.py holds the exact versions in CI.
      - dependency-name: "noq*"

  # Bumps the Dockerfile's pinned base-image digest. This only works because
  # the FROM line carries an explicit `@sha256:` — Dependabot updates a tag only
  # when it can parse a version out of it, and `trixie-slim` gives it nothing,
  # so with a bare tag this ecosystem would open no PRs at all.
  - package-ecosystem: docker
    directories:
      - /
      # The source-build image behind deploy/sponsord/compose.yaml. Its
      # `rust:X.Y.Z-trixie` tag has a parseable version, so Dependabot opens
      # a PR for each new Rust; check_toolchain_pin.py holds that PR red until
      # rust-toolchain.toml, `rust-version` and the workflows' `toolchain:`
      # inputs move with it.
      # Its undigested `debian:trixie-slim` line gets no PRs, as above.
      - /deploy/sponsord
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same rationale as the cargo ecosystem above.
    commit-message:
      prefix: chore
      include: scope

  # `/` covers .github/workflows only; the composite actions are separate
  # directories. Where a ref is a commit SHA with a `# vX.Y.Z` comment,
  # Dependabot moves both together.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same rationale as the cargo ecosystem above.
    commit-message:
      prefix: chore
      include: scope
    # Every workflow pins dtolnay/rust-toolchain by commit SHA and names the
    # Rust version in its `toolchain:` input, which Dependabot does not read, so
    # this ecosystem never moves the toolchain. A Rust release reaches the repo
    # through the docker ecosystem's `rust:X.Y.Z` bump of deploy/sponsord, and
    # .github/scripts/check-toolchain-pin.sh holds that PR red until
    # rust-toolchain.toml, Cargo.toml's rust-version and every `toolchain:`
    # input move with it. This ecosystem can still move the dtolnay SHA to a
    # newer `master` commit; the `toolchain:` input, not the ref, sets the
    # version that step installs.
