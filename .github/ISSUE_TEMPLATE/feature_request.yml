name: Feature request
description: Propose a new capability or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and who does it affect (node operator, client, publisher, token holder)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: design-scope
    attributes:
      label: Design scope
      description: A change to the protocol, the economics, or the on-chain contract surface needs a new or updated ADR in [`adr/`](https://github.com/decdn/decdn/tree/main/adr).
      options:
        - label: This proposal changes the protocol, the economics, or the contract surface.
