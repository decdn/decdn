name: Bug report
description: decdn-node, the decdn CLI, the client SDK, sponsord or the contracts do not behave as documented.
type: Bug
labels: ["kind:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Email security@decdn.org instead (see [SECURITY.md](https://github.com/decdn/decdn/blob/main/SECURITY.md)).

        Something you saw on the public testnet rather than reproduced? Use the **Testnet observation** form instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Matches the `area:` label a maintainer adds.
      options:
        - node (decdn-node daemon)
        - cli (decdn binary)
        - client (decdn-client SDK)
        - cache (engine, origin pull-through, GC)
        - payments (pools, vouchers, redeem, staking)
        - contracts (Solidity)
        - sponsord (daemon, onramp, decdn.sh / decdn.ps1 installers)
        - protocol (wire format, ALPNs, discovery, probe)
        - docs / ADRs
        - CI / tooling / release
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`decdn --version` or `decdn-node --version`, the Docker image tag, or the commit SHA you built from (`git rev-parse --short HEAD`)."
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Arbitrum Sepolia testnet
        - local anvil
        - no chain (loopback or unit test)
        - other / not applicable
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 x86_64, macOS 15 arm64, Docker image tag
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands and config. Remove private keys, keystore passwords, RPC URLs that carry API keys, and origin credentials. `decdn config validate --config <path>` prints the config with `rpc_url` and `otlp_endpoint` redacted.
      placeholder: |
        1. decdn-node run --config ...
        2. decdn get decdn:... -o ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, with the same secrets removed. For more detail, set `RUST_LOG=info,decdn_node=debug` on `decdn-node`, or pass `-vv` to `decdn`.
      render: shell
