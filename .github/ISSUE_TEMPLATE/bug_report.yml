name: Bug report
description: Something in decdn-node, the decdn CLI, the client SDK, or the contracts does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Email security@decdn.org instead (see [SECURITY.md](https://github.com/decdn/decdn/blob/main/SECURITY.md)).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - node (decdn-node daemon)
        - cli (decdn binary)
        - client (decdn-client SDK)
        - cache
        - incentive (pools, vouchers, staking)
        - reputation
        - protocol (wire format, ALPNs)
        - contracts (Solidity)
        - docs / ADRs
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `decdn --version`, or the commit SHA you built from.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 x86_64, macOS 15 arm64, Docker image tag
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands and config. Remove private keys and keystore passwords.
      placeholder: |
        1. decdn node start --config ...
        2. decdn fetch ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Set `RUST_LOG=debug` for more detail.
      render: shell
