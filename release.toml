shared-version = true
tag-name = "v{{version}}"
# The hook regenerates CHANGELOG.md with git-cliff, with the version being cut
# as the newest section, and the release commit carries it: cargo-release
# commits with `git commit -a`, which stages every modified tracked file, so
# the regenerated file needs no `git add`. cargo-release runs the hook once per
# package with that package's directory as cwd, so the command reaches the
# script through $WORKSPACE_ROOT (cargo-release exports it) and the script
# writes under it by absolute path; every run writes the same file (the newest
# heading's date is the clock at the run, and the runs are seconds apart), so
# one run per released package leaves one file. The hook also runs during a
# preview (no --execute) with DRY_RUN=true: it renders and checks the changelog
# but writes nothing, so the preview catches a missing tool or a broken
# cliff.toml. The same cliff.toml renders the GitHub release notes in
# .github/workflows/release.yml. The inner quotes keep a workspace path with a
# space in it whole.
pre-release-hook = ["bash", "-c", "\"$WORKSPACE_ROOT/scripts/release-changelog.sh\""]
pre-release-commit-message = "chore(release): v{{version}}"
push = true
push-remote = "origin"
# Not a "we never publish" flag — the workspace does go to crates.io, via
# scripts/publish-crates.sh. It must not happen HERE: this step runs
# before CI has built anything and before a human has verified anything, and a
# crates.io version is immutable, so an upload at this point could never be
# taken back if the release then failed. See RELEASING.md.
publish = false
sign-commit = true
sign-tag = true
dependent-version = "upgrade"
