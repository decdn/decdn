shared-version = true
tag-name = "v{{version}}"
# The hook regenerates CHANGELOG.md with git-cliff, with the version being cut
# as the newest section, and the release commit (`git commit -a`) carries it.
# cargo-release runs the hook once per package with that package's directory
# as cwd, so the command names the script by absolute path and the script
# writes by absolute path under $WORKSPACE_ROOT; every run writes the same
# bytes, so fifteen runs leave one file. The hook also runs during a preview
# (no --execute) with DRY_RUN=true, and then writes nothing. The same
# cliff.toml renders the GitHub release notes in .github/workflows/release.yml.
pre-release-hook = ["bash", "-c", "\"$WORKSPACE_ROOT/scripts/release-changelog.sh\""]
pre-release-commit-message = "chore(release): v{{version}}"
push = true
push-remote = "origin"
# Not a "we never publish" flag — the workspace does go to crates.io, via
# scripts/publish-crates.sh. It must not happen HERE: this step runs
# before CI has built anything and before a human has verified anything, and a
# crates.io version is immutable, so an upload at this point could never be
# taken back if the release then failed. See RELEASING.md.
publish = false
sign-commit = true
sign-tag = true
dependent-version = "upgrade"
