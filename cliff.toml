[changelog]
# This config drives the GitHub release notes generated by
# `git cliff --latest` in .github/workflows/release.yml. It does NOT generate
# the repo's CHANGELOG.md, which is maintained by hand — the header below is
# stripped by `--strip header` and only appears if cliff is run manually.
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{%- macro remote_url() -%}
  https://github.com/decdn/decdn
{%- endmacro -%}
{%- macro line(commit) -%}
  - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
    {{ commit.message | split(pat="\n") | first | upper_first }} \
    ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endmacro -%}

{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
  ## [Unreleased]
{% endif -%}

{#- Breaking changes first, in their own section, and nowhere else: a release
    that breaks the wire or the config is read for that before anything. A
    commit is breaking via `!` in its subject or a `BREAKING CHANGE:` footer.
    Each entry shows the subject; when a footer carries different text, that
    text follows as a nested bullet. -#}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
  ### Breaking
  {% for commit in breaking %}
    {{ self::line(commit=commit) }}
    {%- if commit.breaking_description and commit.breaking_description != commit.message %}
      {{ "  - " }}{{ commit.breaking_description | replace(from="\n", to=" ") | trim }}
    {%- endif %}
  {%- endfor %}
{% endif -%}

{% for group, commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
  ### {{ group | striptags | trim | upper_first }}
  {% for commit in commits %}
    {{ self::line(commit=commit) }}
  {%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# A subject that does not parse as conventional is dropped from the notes.
# This is the first filter, and nothing below rescues a commit it drops — the
# `pr-title` CI gate is what keeps subjects conventional.
filter_unconventional = true
split_commits = false
# A commit marked breaking (`!` or a `BREAKING CHANGE:` footer) is kept even
# when a `skip = true` parser below matches it. Pre-launch, wire- and
# config-breaking changes are the commits an operator most needs to see, and a
# `chore(deps)!:` must not vanish with the routine bumps.
protect_breaking_commits = true
filter_commits = false
# Release tags only. `v[0-9].*` rather than `v*`, so a working tag whose topic
# starts with a `v` (`versioning-guards-prerebase`) never bounds `--latest`.
tag_pattern = "v[0-9].*"
# Newest first within a group, matching how the hand-written CHANGELOG.md
# orders entries.
sort_commits = "newest"

# The two `skip` rules come before `^chore`, which would otherwise match first
# and file them under Miscellaneous.
commit_parsers = [
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^ci", group = "<!-- 6 -->CI/CD" },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { message = "^build", group = "<!-- 7 -->Miscellaneous" },
  { message = "^Merge", skip = true },
]
