# deCDN CLIENT configuration — Arbitrum Sepolia testnet (chain 421614)
#
# The minimal setup for FETCHING content — `decdn fetch <hash>`. A client is a
# standalone buyer: it dials a provider node over iroh, opens a USDC payment
# channel to pay per MB, and verifies BLAKE3 hashes. It does NOT run a
# `decdn-node` daemon, hold a CapacityBond, serve blobs, or need a cache/origin.
# (For the operator/serving side, see arbitrum-sepolia.toml — a much larger config.)
#
# Every field here is also a `decdn fetch` flag, so a client can run with no
# config file at all. This file just captures the Arbitrum Sepolia coordinates.
# Values marked MUST-EDIT are yours to fill in.

[identity]
# MUST-EDIT — data directory. Holds the buyer payment-channel store (voucher
# watermarks) and, by default, the ETH keystore.
data_dir = '/var/lib/decdn-client'

[blockchain]
# MUST-EDIT — Arbitrum Sepolia JSON-RPC endpoint (public default shown).
rpc_url = "https://sepolia-rollup.arbitrum.io/rpc"
# MUST-EDIT — Ethereum keystore JSON. Must hold USDC to pay for delivery plus a
# little ETH for gas (opening / settling the payment channel).
eth_keystore = '/etc/decdn/eth-keystore.json'

# EIP-712 chainId — Arbitrum Sepolia.
chain_id = 421614

# Required for fetch. The settlement contract, and the SlashJudge whose EIP-712
# domain the client uses to verify the provider's slash-signed delivery responses.
payment_channel_address = "0x62B911B7CdEA5eedFB7dC0E2343440516fB8cb43"
slash_judge_address     = "0xa9feAb7c1a82e32a2A52c40aD545C0111eC3A2b4"

# Needed only for provider AUTO-DISCOVERY (`decdn fetch <hash>` with no
# --node-id): the client reads the active operator set from CapacityBond to pick
# a region-near holder. Omit if you always pass --node-id + --provider-address.
capacity_bond_address = "0x2F08aE39B0127C92d56F9E5eAd20692b217dDc58"

# Buyer channel economics (optional; ADR 003 defaults shown).
# buyer_initial_deposit_micro_usdc = 500000     # deposit when OPENING a channel (first-contact lock); default 0.5 USDC
# buyer_working_deposit_micro_usdc = 10000000    # refill target on reuse or mid-transfer shortfall; 0 disables top-up; default 10 USDC
# buyer_max_approve = true              # one-time max USDC approval to PaymentChannel
