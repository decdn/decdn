# deCDN node configuration — Arbitrum Sepolia testnet (chain 421614)
#
# Copy this file, replace every value marked MUST-EDIT, then run:
#   decdn-node run --config arbitrum-sepolia.toml
#
# The [blockchain] contract addresses are the on-chain v0.1.0 genesis deployment
# recorded in contracts/deployments/421614.json. Values marked MUST-EDIT are
# operator-specific and have no safe default — the node will not do what you want
# until you set them. Everything else is a sensible testnet default you can tune.

[identity]
# MUST-EDIT — node data directory: holds the Ed25519 node key and the blob store.
data_dir = '/var/lib/decdn'
# ISO 3166-1 alpha-2 region you operate in. Sets the region scope for blacklist
# compliance (enforced set is global ∪ this region). Opt in explicitly: leaving
# it unset means global-only scope. Uncomment and set YOUR region — the "US"
# below is a placeholder, not a default.
# region = "US"

[network]
# QUIC bind port for paid delivery (cdn/client/v1) and probing (cdn/probe/v1).
bind_port = 4433
# iroh relay URLs for NAT traversal. Omit to use the default n0-hosted discovery.
# relay_urls = ["https://your-relay.example"]

[blockchain]
# MUST-EDIT — Arbitrum Sepolia JSON-RPC endpoint. The public endpoint below works
# for light use; run your own or use a provider for production reliability.
rpc_url = "https://sepolia-rollup.arbitrum.io/rpc"
# MUST-EDIT — path to the operator's Ethereum keystore JSON (pays gas, signs
# settlement + slash responses).
eth_keystore = '/etc/decdn/eth-keystore.json'

# EIP-712 chainId bound into slash-signature domain separators — Arbitrum Sepolia.
chain_id = 421614

# --- Contract addresses (v0.1.0 genesis deploy; see deployments/421614.json) ---

# Required. Settlement gateway, operator bond, and the slash-signature verifying
# contract. A wrong/missing slash_judge_address silently produces signatures no
# verifier accepts, so resolution fails fast if it is absent.
payment_channel_address = "0x62B911B7CdEA5eedFB7dC0E2343440516fB8cb43"
capacity_bond_address   = "0x2F08aE39B0127C92d56F9E5eAd20692b217dDc58"
slash_judge_address     = "0xa9feAb7c1a82e32a2A52c40aD545C0111eC3A2b4"

# Optional — chain-backed origin directory backing the pull-through gate and
# FIND_VALUE fallback (ADR 022). Set BOTH or NEITHER; unset => the directory is
# empty (deny-all) and the pull-through gate finds no authorized origins.
origin_assignment_address  = "0x632F49B3447810eF20eee884fF6e7EAB5560b19e"
publisher_registry_address = "0xa9D014d24924E7A5BCaB9E49A68119B1e92EBCD7"

# Optional — blacklist compliance watcher (ADR 011/031). When set, the node
# evicts held blobs whose hash is blacklisted in your scope. Unset => no watcher
# (serving a blacklisted hash past its compliance window is then slashable with
# no local protection).
content_blacklist_address = "0x7e903dd1674EDe0596629205E55e5fe1B670dBD3"

# Optional — target for `decdn appeal slash` (ADR 028). Consumed by the CLI only;
# the daemon accepts but ignores this key (node.toml is shared by both binaries).
slash_appeal_address = "0x4CA50D80bFcBA877eAC4cFa36FF95D7f803c6590"

[cache]
# MUST-EDIT — blob cache directory and size budget (MB).
cache_dir     = '/var/cache/decdn'
cache_size_mb = 10240

# MUST-EDIT — origin backend the node pulls through on a cache miss. Pick ONE
# kind: "http", "fs", or "s3". An HTTP origin is shown; for fs/s3 see the schema
# docs in crates/common/src/config/types.rs (OriginConfig).
[cache.origin]
kind = "http"
url  = "https://your-origin.example/"
