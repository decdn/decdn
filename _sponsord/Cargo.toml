[workspace]
resolver = "2"
members = [
    "crates/decdn-sponsored",
    "crates/sponsord",
    "crates/sponsord-api",
    "crates/sponsord-core",
    "crates/sponsord-onramp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/decdn/sponsord"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
alloy = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
# deCDN itself, from its public repository. `Cargo.lock` pins the commit;
# `cargo update -p decdn-incentive` moves it. To build against a local
# checkout instead, see CONTRIBUTING.md.
decdn-client = { git = "https://github.com/decdn/decdn", branch = "main" }
decdn-incentive = { git = "https://github.com/decdn/decdn", branch = "main" }
decdn-e2e = { git = "https://github.com/decdn/decdn", branch = "main" }
# This workspace's own crates.
sponsord = { path = "crates/sponsord" }
sponsord-api = { path = "crates/sponsord-api" }
sponsord-core = { path = "crates/sponsord-core" }
