name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The deCDN crates are git dependencies pinned by `Cargo.lock`, so a plain
# checkout builds.
jobs:
  linux:
    name: linux (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # `decdn-sponsored` is the end-user CLI, installed by `decdn.sh` on macOS and
  # Linux and by `decdn.ps1` on Windows x64 and ARM64. The servers (`sponsord`,
  # `sponsord-onramp`) run only on Linux, so these legs cover the client crate
  # alone.
  client:
    name: client (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            test: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          # Cross-compiled on the x64 runner, so it is linted, not run.
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            test: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      # From inside the checkout, so the target lands on the toolchain that
      # `rust-toolchain.toml` pins rather than on the action's own.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy -p decdn-sponsored --all-targets --target ${{ matrix.target }} -- -D warnings
      - if: matrix.test
        run: cargo test -p decdn-sponsored --target ${{ matrix.target }}
