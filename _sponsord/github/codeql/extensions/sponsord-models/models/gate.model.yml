# rust/xss cannot see that `ClientQuery.client` is a parsed alloy `Address`
# (axum's `Query` rejects anything else with a 400), so the address it hands
# to `Gate::page` is always `0x` + 40 hex characters. Covers every `Gate`
# impl, including the test-support fake.
extensions:
  - addsTo:
      pack: codeql/rust-all
      extensible: barrierModel
    data:
      - ["<_ as sponsord_onramp::gate::Gate>::page", "Argument[0]", "html-injection", "manual"]
