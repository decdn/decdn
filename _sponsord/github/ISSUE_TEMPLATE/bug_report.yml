name: Bug report
description: Something in sponsord, sponsord-onramp or the installers does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Email security@decdn.org instead (see [SECURITY.md](https://github.com/decdn/sponsord/blob/main/SECURITY.md)).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - sponsord (signing daemon)
        - sponsord-onramp (frontend)
        - installers (decdn.sh / decdn.ps1)
        - sponsord-core (library)
        - docs / release
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, Docker image tag, `decdn --version`, or the commit SHA you built from (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 x86_64, macOS 15 arm64, Windows 11 ARM64, Docker image tag
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands and configuration. Remove API tokens, keystore passwords, Turnstile secrets and RPC URLs that carry API keys.
      placeholder: |
        1. curl -fsSL https://<onramp>/decdn.sh | sh -s -- get 'decdn:.../'
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, with the same secrets removed.
      render: shell
