repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: ["--dot"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-doc
        name: cargo doc
        entry: env RUSTDOCFLAGS=-D\ warnings cargo doc --workspace --no-deps --document-private-items
        language: system
        types: [rust]
        pass_filenames: false

      # Findings print (`verbose`) and never block the commit. A missing
      # cargo-deny install or a run that checked nothing blocks it. The CI
      # `deny` job runs the same script. See cargo_deny_warn.py.
      - id: cargo-deny
        name: cargo deny (findings warn)
        entry: .github/scripts/cargo-deny-warn.sh
        verbose: true
        language: system
        pass_filenames: false

      # Fails if a numbered ADR or appendix on disk is missing from the
      # hand-maintained reading-order list in adr/Makefile (which would
      # silently drop it from adrs-book.pdf). `files:` scopes the hook to
      # ADR-book changes only, so it never runs on unrelated commits.
      - id: adr-book-list
        name: adr book list in sync
        entry: make -C adr check-book-list
        language: system
        files: ^adr/(.*\.md|Makefile)$
        pass_filenames: false

      # Mirrors the adr-book-check CI job: every ADR cross-reference must be a
      # markdown link, every cross-ADR *.md link must carry a #heading anchor
      # that resolves to a heading in the target file, and § spacing must follow
      # §3 / § Word. Same `files:` scope as above, plus the awk guard helpers the
      # Makefile drives (editing one must re-run it).
      - id: adr-ref-hygiene
        name: adr reference hygiene (links, anchors, section spacing)
        entry: make -C adr check-refs
        language: system
        files: ^adr/(.*\.md|Makefile|_build/.*\.awk)$
        pass_filenames: false

      # --- crates.io packaging -----------------------------------------
      # An `include_str!` reaching outside its crate builds fine in-tree and
      # fails for every `cargo install` user, because a published .crate holds
      # only its own directory. release.yml proves this properly with
      # `cargo publish --workspace --dry-run`; this is the cheap early signal.
      - id: package-embeds
        name: crate embeds stay inside their package
        entry: .github/scripts/check-package-embeds.sh
        language: system
        files: '^crates/.*\.(rs|toml)$'
        pass_filenames: false

      # The CLI embeds a deployment manifest, but `include_str!` cannot escape
      # the package, so crates/cli/deployments/ mirrors contracts/deployments/.
      # Drift means `decdn config init` bakes stale contract addresses.
      - id: deployment-manifest-mirror
        name: deployment manifest mirror in sync
        entry: .github/scripts/check-deployment-mirror.sh
        language: system
        files: '^(contracts|crates/cli)/deployments/.*\.json$'
        pass_filenames: false

      # --- workspace shape ---------------------------------------------
      # The Rust version lives in rust-toolchain.toml, Cargo.toml's
      # rust-version and every dtolnay/rust-toolchain@… ref in the workflows,
      # each read by a different tool. Dependabot bumps only the action refs,
      # so without this CI quietly compiles on a different compiler from every
      # developer. The `packaging` CI job is authoritative.
      - id: toolchain-pin
        name: rust version agrees across toolchain, manifest and workflows
        entry: .github/scripts/check-toolchain-pin.sh
        language: system
        files: '^(rust-toolchain\.toml|Cargo\.toml|\.github/(workflows|actions)/.*\.ya?ml|\.github/scripts/check[-_]toolchain[-_]pin\.(py|sh))$'
        pass_filenames: false

      # A member that restates `version` ships its own number; one without
      # `[lints] workspace = true` runs under default lint levels. Neither
      # warns. Editing the guard re-runs it, as adr-ref-hygiene does for its
      # awk helpers. The `packaging` CI job is authoritative.
      - id: workspace-manifests
        name: every member inherits the workspace version and lints
        entry: .github/scripts/check-workspace-manifests.sh
        language: system
        files: '^(Cargo\.toml|crates/[^/]+/Cargo\.toml|\.github/scripts/check[-_]workspace[-_]manifests\.(py|sh))$'
        pass_filenames: false

      # Cargo enforces acyclicity only. The dependency flow in CLAUDE.md
      # § Crate Structure (three leaves, cli/e2e as sinks, an iroh-blobs-free
      # CLI) is held by the table in check_crate_edges.py. Needs cargo. The
      # `packaging` CI job is authoritative.
      - id: crate-edges
        name: crate dependency direction matches CLAUDE.md
        entry: .github/scripts/check-crate-edges.sh
        language: system
        files: '^(Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|\.github/scripts/check[-_]crate[-_]edges\.(py|sh))$'
        pass_filenames: false

      # --- Solidity ----------------------------------------------------
      # commit-stage (every commit, fast):

      - id: forge-fmt
        name: forge fmt --check
        language: system
        entry: bash -c 'cd contracts && forge fmt --check'
        files: '^contracts/.*\.sol$'
        pass_filenames: false

      - id: solhint
        name: solhint
        language: node
        # pre-commit manages its own node sandbox via additional_dependencies,
        # so this hook works even when contracts/node_modules is missing — no
        # `npm install` step required at hook time.
        entry: solhint
        args:
          - '--config'
          - 'contracts/.solhint.json'
          - 'contracts/src/**/*.sol'
        additional_dependencies:
          - 'solhint@6.2.1'
        files: '^contracts/src/.*\.sol$'
        pass_filenames: false

      # pre-push-stage (only on `git push`, medium cost):

      - id: forge-build
        name: forge build --deny warnings
        language: system
        stages: [pre-push]
        entry: bash -c 'cd contracts && forge build --deny warnings'
        files: '^contracts/.*\.sol$'
        pass_filenames: false

      - id: forge-test
        name: forge test
        language: system
        stages: [pre-push]
        entry: bash -c 'cd contracts && forge test'
        files: '^contracts/.*\.sol$'
        pass_filenames: false

      # manual-stage (explicit invocation: pre-commit run --hook-stage manual <id>):

      - id: slither
        name: slither
        language: system
        # Needs `pip install slither-analyzer` locally. CI is authoritative.
        stages: [manual]
        entry: bash -c 'cd contracts && slither . --config-file slither.config.json'
        files: '^contracts/.*\.sol$'
        pass_filenames: false

      - id: aderyn
        name: aderyn
        language: system
        # Needs `aderyn` on PATH (cyfrinup or curl installer). CI is authoritative.
        stages: [manual]
        entry: bash -c 'cd contracts && aderyn .'
        files: '^contracts/.*\.sol$'
        pass_filenames: false
