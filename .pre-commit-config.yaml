repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: ["--dot"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-doc
        name: cargo doc
        entry: env RUSTDOCFLAGS=-D\ warnings cargo doc --workspace --no-deps --document-private-items
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        pass_filenames: false

      # Fails if a numbered ADR or appendix on disk is missing from the
      # hand-maintained reading-order list in adr/Makefile (which would
      # silently drop it from adrs-book.pdf). `files:` scopes the hook to
      # ADR-book changes only, so it never runs on unrelated commits.
      - id: adr-book-list
        name: adr book list in sync
        entry: make -C adr check-book-list
        language: system
        files: ^adr/(.*\.md|Makefile)$
        pass_filenames: false
