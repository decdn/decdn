# cargo-nextest configuration.
#
# The backstop below bounds any wedged test. `iroh`'s `Endpoint::close().await`
# can deadlock under heavy CPU contention (a lost wakeup that parks every runtime
# thread), and a test that hangs in teardown has no timeout of its own — so it
# runs until the CI job itself times out, burning a whole runner for hours. A cap
# turns that into a bounded, reported failure within minutes.
#
# The cap sits well above the slowest legitimate test — the ~168s outer pull
# deadline (`selection::outer_pull_deadline` at defaults) — and far below the
# multi-hour wedge it replaces.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The anvil-backed e2e journeys boot anvil, deploy the full protocol, and drive
# daemon subprocesses, so they are legitimately slower than an in-process unit
# test. Give the package more headroom before the same backstop applies.
[[profile.default.overrides]]
filter = 'package(decdn-e2e)'
slow-timeout = { period = "120s", terminate-after = 5 }

# The two anvil-backed `decdn-node` targets boot anvil, shell out to `forge`, and
# drive real node code against a live chain, so they are legitimately slower than
# the rest of that package and are excluded from its tighter cap below. They build
# only under `--features anvil-e2e`, and the job that runs them uses this default
# profile rather than `decdn-e2e`'s override — so they need their own row here.
# Sized above `anvil_settlement_e2e`'s own 780s `OVERALL_TIMEOUT`, which is what
# actually bounds that one; `anvil_bringup_shutdown_e2e` carries only per-stage
# timeouts, so this row is its only whole-test bound. A new `anvil_*` target
# belongs in this filter as well as in that job's `--test` list.
[[profile.default.overrides]]
filter = 'binary(anvil_settlement_e2e) + binary(anvil_bringup_shutdown_e2e)'
slow-timeout = { period = "120s", terminate-after = 8 }

# The in-process `decdn-node` suite tears its iroh fixtures down through
# `tests/support::shutdown`, which bounds its own work and names the stage it
# stalled in. This cap does not have to absorb a teardown wedge, so it catches only
# a hang that predates teardown and can sit close to the suite's real cost: the
# slowest test in the package measures ~13s uninstrumented, and
# `silent_upstreams_do_not_starve_the_candidate_loop` drives
# `selection::outer_pull_deadline` at `5s+5s` budgets for `77.5s` to survive
# `cargo llvm-cov` slowdown. `180s` (60s×3) still leaves room for that outer
# deadline plus instrumentation and a loaded runner while naming a wedge 120s
# sooner than the global `300s` (60s×5) backstop, with the first `SLOW` line at 60s.
#
# `success-output` is what makes a teardown breach visible: `shutdown` warns rather
# than failing (the stranded-driver half is a known open defect no test can fix),
# and nextest's default of `never` would capture and discard that line for a test
# that still passes.
[[profile.default.overrides]]
filter = 'package(decdn-node) - binary(anvil_settlement_e2e) - binary(anvil_bringup_shutdown_e2e)'
slow-timeout = { period = "60s", terminate-after = 3 }
success-output = "final"
