# foundry.toml — deCDN contracts
#
# Profile layout:
#   default  — local dev (light fuzz; fast inner loop)
#   ci       — CI gate (1024 fuzz runs, 256-depth invariants, verbose traces)
#   fuzz     — nightly / on-demand heavy fuzz on math-bearing contracts
#   coverage — forge coverage (optimizer off for accurate source mapping)
#
# OZ v5.1 requires ^0.8.20. Pinning solc to a specific stable so audit diffs
# stay stable across machines; bump deliberately.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
cache_path = "cache"
# Testnet-only contracts live under `testnet/` (deliberately outside `src`)
# and are pulled in transitively by `script/TestnetFaucet.s.sol` +
# `test/TestnetFaucet.t.sol`. The on-disk separation pairs with the CI
# grep gate (`.github/workflows/ci.yml` → `solidity build+test` job) to
# enforce that `testnet/` references never leak into the production
# deploy surface.

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# `script/DeployProtocol.s.sol` writes the deploy manifest to
# `deployments/<chainId>.json` so downstream tooling (Arbiscan verification,
# website address injection, ops dashboards) has a deterministic source of
# truth. Scoped to one directory so the test sandbox stays tight.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

fuzz = { runs = 256 }
invariant = { runs = 32, depth = 25 }

[profile.ci]
# Pinned fuzz/invariant seed so ci-profile gas is fully deterministic. This is
# what lets the gas-snapshot gate run `forge snapshot --check` (ci.yml →
# `solidity build+test`) without flaking on fuzz mean/median gas: a `--check`
# failure now means the committed `.gas-snapshot` is genuinely stale vs. the
# contracts, not seed noise. Exploratory, unpinned fuzzing lives in
# [profile.fuzz] (nightly / on-demand) so seed-pinning here costs no coverage.
# Bump the seed deliberately if you ever want a fresh ci input corpus.
fuzz = { runs = 1024, seed = "0x6465636e" }
invariant = { runs = 256, depth = 50 }
verbosity = 3

[profile.fuzz]
# Keep max_test_rejects at the foundry default (65_536). A test hitting the
# ceiling means inputs are over-constrained (typically vm.assume overuse);
# fix the test with vm.bound or tighter input types rather than raising
# this further — see https://book.getfoundry.sh/forge/fuzz-testing.
fuzz = { runs = 10_000, max_test_rejects = 65_536 }
invariant = { runs = 1024, depth = 100 }

[profile.coverage]
optimizer = false
via_ir = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
# `unsafe-typecast` fires on every `bytes32("literal")` event-key cast and
# every `uint64(block.timestamp / EPOCH_LENGTH)` epoch derivation. All
# literal casts are short strings (≤ 23 chars, no truncation possible) and
# the timestamp downcasts are safe for ~290 billion years.
#
# `erc20-unchecked-transfer` fires on `token.transfer(...)` calls in
# test files (against the project's own OZ ERC20 which always returns true).
# Tests don't need to assert the return.
#
# Suppressing globally avoids ~60 per-line waivers across src/ and test/.
exclude_lints = ["unsafe-typecast", "erc20-unchecked-transfer"]

# Issue: https://github.com/decdn/decdn/issues/452 — full 14-contract surface.
