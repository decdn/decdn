[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = true

fs_permissions = [{ access = "read-write", path = "./out" }]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 64
depth = 32

[profile.ci]
verbosity = 3
fuzz = { runs = 10_000 }
invariant = { runs = 256, depth = 32 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "params_first"
wrap_comments = true
# Never reformat vendored dependencies — they are audited artifacts and
# reformatting them would produce noisy diffs on every submodule update.
ignore = ["lib/**/*"]

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_KEY}", chain = 421_614 }
