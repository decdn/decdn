# foundry.toml — deCDN contracts
#
# Profile layout:
#   default  — local dev (light fuzz; fast inner loop)
#   ci       — CI gate (1024 fuzz runs, 256-depth invariants, verbose traces)
#   fuzz     — nightly / on-demand heavy fuzz on math-bearing contracts
#   coverage — forge coverage (optimizer off for accurate source mapping)
#
# OZ v5.1 requires ^0.8.20. Pinning solc to a specific stable so audit diffs
# stay stable across machines; bump deliberately.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
cache_path = "cache"

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

fuzz = { runs = 256 }
invariant = { runs = 32, depth = 25 }

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 50 }
verbosity = 3

[profile.fuzz]
# Keep max_test_rejects at the foundry default (65_536). A test hitting the
# ceiling means inputs are over-constrained (typically vm.assume overuse);
# fix the test with vm.bound or tighter input types rather than raising
# this further — see https://book.getfoundry.sh/forge/fuzz-testing.
fuzz = { runs = 10_000, max_test_rejects = 65_536 }
invariant = { runs = 1024, depth = 100 }

[profile.coverage]
optimizer = false
via_ir = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# forge-lint exclusions. block-timestamp fires on StakingRegistry's
# unbonding check (block.timestamp < req.unlockAt). Validator clock-drift
# manipulation is bounded by consensus tolerance (seconds), dwarfed by the
# unbonding period (days, per ADR 003) — the comparison is the explicit
# design. Suppressed at project level rather than inline so the directive
# is portable across forge versions (older releases don't recognize
# unknown lint ids and treat them as warnings, breaking --deny-warnings).
[lint]
exclude_lints = ["block-timestamp"]

# Issue: https://github.com/decdn/decdn/issues/452 — full 14-contract surface.
