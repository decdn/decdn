# contracts/local/docker-compose.yml
#
# Throwaway internal-testnet anvil for the deCDN contract surface. This is a
# DISPOSABLE dev rig — never a stand-in for the Arbitrum Sepolia / mainnet
# deploy path. To scrap the whole thing: `docker compose down -v` then delete
# `contracts/local/`. See ./README.md for the full runbook.
#
# Foundry's image ENTRYPOINT is `/bin/sh -c`, so `command` is ONE folded string.
name: decdn-local

services:
  anvil:
    image: ${FOUNDRY_IMAGE:-ghcr.io/foundry-rs/foundry:latest}
    # `--state` persists the chain across restarts (named volume below).
    # `--block-time` advances chain time without txs so epoch / dispute-window /
    # unbonding logic progresses like a real chain (set BLOCK_TIME=0 to omit).
    command: >
      anvil
      --host 0.0.0.0
      --port 8545
      --chain-id ${CHAIN_ID:-31337699}
      --state /state/anvil-state.json
      --block-time ${BLOCK_TIME:-2}
    # SECURITY: anvil's JSON-RPC is UNAUTHENTICATED and exposes the `anvil_*`
    # cheat methods plus well-known dev private keys, so the port is published
    # ONLY to 127.0.0.1 — this rig is local-only. Exposing a shared test RPC to
    # the team (and hardening it) is handled by the devops test-RPC setup, not
    # here.
    ports:
      - "127.0.0.1:${RPC_PORT:-8545}:8545"
    volumes:
      - anvil-state:/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  # --------------------------------------------------------------------------
  # OPTIONAL self-hosted iroh relay (opt-in via `--profile relay`).
  #
  # The node honors `[network] relay_url` (DECDN_RELAY_URL): set it to
  # http://127.0.0.1:3340 to route iroh traffic through this relay instead of
  # the public n0 servers (see README § iroh relay). Not started by the default
  # `up` — run `docker compose --profile relay up -d`. You must set
  # IROH_RELAY_IMAGE in `.env` to a relay image/build first (there is no default
  # since iroh does not publish an official relay image). `--dev` disables
  # TLS / abuse limits, fine for a local rig.
  # No healthcheck here (unlike anvil): the image is operator-supplied and we
  # can't assume a probe tool is present. The node's own relay reachability
  # probe (warn-and-continue) covers startup diagnosis.
  relay:
    image: ${IROH_RELAY_IMAGE}
    command: --dev
    ports:
      - "127.0.0.1:3340:3340"
    restart: unless-stopped
    profiles: ["relay"]

volumes:
  anvil-state:
