[package]
name = "ed25519-vectors"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "ed25519-vectors"
path = "src/main.rs"

# Versions pinned to the deCDN workspace Cargo.lock so an offline build resolves
# against the already-fetched registry cache.
[dependencies]
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
hex = "=0.4.3"
# keccak256 for the CapacityBond.registerNode digest (section 4). Pinned to the
# version already in the deCDN workspace Cargo.lock so the offline build resolves
# from the fetched registry cache.
sha3 = "=0.10.8"

# Empty table: this is a standalone workspace, isolated from the parent Rust
# workspace (which excludes contracts/ anyway).
[workspace]
